<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EFF6; --card:#FFFFFF; --ink:#1B2540; --muted:#5B6782; --line:#D3DCE8;
  --sun:#F2B705; --sunInk:#3A2A00; --happy:#E0507A; --health:#2E9E6A; --smarts:#3A6FD8; --looks:#9255C9;
  --bad:#C8372D; --good:#23845A; --ai:#7A5AF8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#111726; --card:#1A2236; --ink:#E7ECF5; --muted:#95A2BC; --line:#2A3551; --bad:#F06B60; --good:#4CC98E; --ai:#A78BFA; }
}
:root[data-theme="dark"]{ --paper:#111726; --card:#1A2236; --ink:#E7ECF5; --muted:#95A2BC; --line:#2A3551; --bad:#F06B60; --good:#4CC98E; --ai:#A78BFA; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--smarts);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{padding:12px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who{min-width:0}
.who h1{font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:1.4rem;margin:0;line-height:1.1}
.who p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:.75rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.side{display:flex;align-items:flex-start;gap:8px}
.cash{text-align:right}
.cash b{font-family:Fredoka,system-ui,sans-serif;font-size:1.2rem;display:block}
.cash span{color:var(--muted);font-size:.8rem;display:block}
.energy{font-size:.8rem;color:var(--muted);letter-spacing:1px;margin-top:2px}
.menu{background:var(--card);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;font-size:1.1rem}
.logwrap{flex:1;position:relative;min-height:0}
.log{height:100%;overflow-y:auto;padding:4px 18px 56px}
.yr{margin:0 0 14px}
.yr h2{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:.95rem;margin:0 0 4px;color:var(--smarts)}
.yr p{margin:0 0 3px;line-height:1.45}
.good{color:var(--good)} .bad{color:var(--bad)} .ai{color:var(--ai)}
.skip{position:absolute;right:14px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.85rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.skip:disabled{opacity:.5}
.stats{cursor:pointer;padding:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;background:var(--card);border-top:1px solid var(--line);position:relative}
.stat{display:grid;grid-template-columns:5.2em 1fr 2.2em;align-items:center;gap:8px;font-size:.82rem}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s ease}
.stat em{font-style:normal;text-align:right;color:var(--muted)}
#pops{position:absolute;left:0;right:0;bottom:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px 8px;pointer-events:none}
.pop{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);animation:pop 1.8s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
nav{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;align-items:end;background:var(--card);padding:6px 8px 10px;border-top:1px solid var(--line)}
nav button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
nav button .ic{font-size:1.35rem;line-height:1}
.age{justify-self:center;width:76px;height:76px;margin-top:-34px;border-radius:50%;background:var(--sun);color:var(--sunInk)!important;border:5px solid var(--card)!important;box-shadow:0 4px 0 #C99400;font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:1rem!important;justify-content:center}
.age:active{transform:translateY(3px);box-shadow:0 1px 0 #C99400}
.age .plus{font-size:1.5rem;line-height:.9}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
#modalWrap{z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:Fredoka,system-ui,sans-serif;font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.9rem;line-height:1.4}
.sheet h4{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:1rem;margin:18px 0 8px;color:var(--muted)}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--paper);border:0;border-radius:14px;padding:12px 14px;margin:0 0 8px}
.row:disabled{opacity:.45;cursor:default}
.row b{display:block;font-weight:700}
.row small{color:var(--muted);display:block}
.row .r{font-family:Fredoka,system-ui,sans-serif;white-space:nowrap;text-align:right}
.row .r small{font-family:Nunito,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .row{flex-direction:column;align-items:flex-start;margin:0;min-height:74px;gap:2px}
.close{margin-top:10px;width:100%;background:none;border:2px solid var(--line);border-radius:14px;padding:10px}
.back{background:none;border:0;color:var(--smarts);padding:0;margin:0 0 8px;font-weight:700}
.relbar{height:6px;width:70px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.relbar i{display:block;height:100%;background:var(--happy)}
.modal{align-items:center}
.modal .sheet{border-radius:22px;margin:0 14px calc(18px + env(safe-area-inset-bottom,0px))}
.event-text{font-size:1.1rem;line-height:1.5;margin:0 0 16px}
.choice{width:100%;background:var(--sun);color:var(--sunInk);border:0;border-radius:14px;padding:12px;margin:0 0 8px;font-weight:700}
.choice.alt{background:var(--paper);color:var(--ink)}
.choice.trait{background:var(--paper);color:var(--ink);border:2px dashed var(--looks)}
.choice:disabled{opacity:.4;cursor:default}
.ribbon{display:inline-block;background:var(--sun);color:var(--sunInk);font-family:Fredoka,system-ui,sans-serif;font-weight:700;padding:8px 18px;border-radius:999px;margin:6px 0 14px}
.obit{font-family:Georgia,"Times New Roman",serif;font-size:1rem;line-height:1.6;margin:0 0 14px;white-space:pre-wrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px}
dt{color:var(--muted)} dd{margin:0;font-weight:700;text-align:right}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.slider{width:100%;accent-color:var(--sun);margin:6px 0 10px;height:32px}
.amt{width:100%;font:inherit;font-size:1.15rem;font-weight:700;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:0 0 10px}
.tabs button{flex:0 0 auto;border:0;background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{font-size:.82rem;color:var(--muted);margin:0 0 4px;font-weight:700}
.flash{background:var(--paper);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.92rem;line-height:1.4}
.econ{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--paper);font-weight:700;font-size:.85rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.btns .row{margin:0;justify-content:center;text-align:center;font-weight:700}
.chart{width:100%;height:auto;display:block;margin:0 0 14px}
.chart text{font-size:10px;fill:var(--muted);font-family:Nunito,system-ui,sans-serif}
.review li{margin:0 0 4px;line-height:1.4}
.review ul{padding-left:20px;margin:0 0 14px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--card);border-radius:14px;padding:10px 14px;font-weight:700;font-size:.92rem;animation:toast 3.2s ease forwards;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle .sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:var(--paper);border-radius:12px;padding:10px;font-size:.85rem}
.ach b{display:block;font-size:.9rem}
.ach.locked{opacity:.45}
.warn{color:var(--bad);font-weight:700}
.supcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 8px;display:flex;flex-direction:column;gap:4px}
.supcard.new{border:2px solid var(--sun)}
.suphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.supprice{margin:0;font-family:Fredoka,system-ui,sans-serif;font-size:1.15rem;font-variant-numeric:tabular-nums}
.supprice small{font-family:Nunito,system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
.supbar{display:grid;grid-template-columns:7.4em 1fr 2em;align-items:center;gap:8px;font-size:.82rem}
.supbar em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.pick{background:var(--sun);color:var(--sunInk);border-color:var(--sun);font-weight:700}
button.chip{font:inherit;font-size:.75rem;cursor:pointer}
.chip.good{color:var(--good);border-color:var(--good)} .chip.bad{color:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion: reduce){ .bar i,.toggle .sw::after{transition:none} .pop,.toast{animation-duration:.01s;animation-delay:1.5s} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="who"><h1 id="nm"></h1><p id="meta"></p><div class="chips" id="traits"></div></div>
    <div class="side">
      <div class="cash"><b id="money"></b><span>Cash</span><div class="energy" id="energy"></div></div>
      <button class="menu" id="bMenu" aria-label="Menu">☰</button>
    </div>
  </header>
  <div class="logwrap"><div class="log" id="log" aria-live="polite"></div><button class="skip" id="bUndo" title="Go back one year">↩ Undo year</button></div>
  <div class="stats" id="statsWrap" role="button" tabindex="0" aria-label="Open my character stats" title="Tap for all my stats"><div id="pops" aria-hidden="true"></div><div id="stats" style="display:contents"></div></div>
  <nav>
    <button id="bJob"><span class="ic">💼</span>Work</button>
    <button id="bMoney"><span class="ic">💰</span>Money</button>
    <button id="bAge" class="age" aria-label="Age up one year"><span class="plus">+</span>Age</button>
    <button id="bRel"><span class="ic">❤️</span>People</button>
    <button id="bAct"><span class="ic">🎯</span>Activities</button>
  </nav>
</div>
<div class="scrim" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div class="scrim modal" id="modalWrap"><div class="sheet" id="modal"></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* ================= helpers ================= */
/* Replay dice: every game roll comes from rnd(). Each life has a life code (S.seed) and the dice
   position (S.rng) is saved with it, so the same life code plus the same choices gives the same life.
   Math.random() is only used to make new life codes and for the AI storyteller's roll. */
let RS=1;
function rnd(){RS=(RS+0x6D2B79F5)|0;let t=RS;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}
const newSeed=()=>100000+Math.floor(Math.random()*900000);
const R=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
const uid=()=>rnd().toString(36).slice(2,9);
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const $=id=>document.getElementById(id);
function h(tag,props={},...kids){const e=document.createElement(tag);for(const k in props){const v=props[k];if(k==='on')e.onclick=v;else if(k==='style')e.setAttribute('style',v);else if(k in e)e[k]=v;else e.setAttribute(k,v);}kids.flat().forEach(c=>c!=null&&c!==false&&e.append(c));return e;}
function wpick(arr,w){const tot=arr.reduce((a,x)=>a+w(x),0);let r=rnd()*tot;for(const x of arr){r-=w(x);if(r<=0)return x;}return arr[arr.length-1];}

/* ================= data ================= */
const FM=['Liam','Noah','Mateo','Kai','Theo','Ezra','Omar','Ravi','Jonah','Felix','Marcus','Diego','Sam','Hugo','Arlo','Tobias','Kofi','Luca','Bram','Idris'];
const FF=['Ava','Maya','Isla','Zara','Nora','Leah','Priya','Chloe','Ruby','Ines','Hana','Sofia','Amara','Iris','Lena','June','Tessa','Mila','Wren','Esme'];
const LAST=['Carter','Nguyen','Okafor','Silva','Brennan','Patel','Lindqvist','Moreau','Hayes','Kowalski','Mendez','Ito','Walsh','Adeyemi','Fischer','Rossi','Kim','Bishop','Varga','Quinn'];
/* ================= COUNTRIES ================= */
// pp: price level & spending power, wage/rent: cost levels, corp:[small rate, main rate, small-profit threshold], div: dividend tax,
// inc: income tax brackets [from, rate], rate: loan-rate add-on, vol: economic swings, grow: demand growth, red: red tape,
// corrupt: bribery risk, union: union strength, pop: market depth (slows outlet saturation)
const COUNTRIES={
 us:{n:'USA',ic:'🇺🇸',cities:['Austin','Portland','Chicago'],pp:1,wage:1,rent:1,corp:[.21,.21,0],div:.15,inc:[[0,.1],[11000,.22],[95000,.24],[180000,.32],[400000,.37]],rate:0,vol:1,grow:1,red:.9,corrupt:.05,union:.7,pop:1.2},
 uk:{n:'UK',ic:'🇬🇧',cities:['Leeds','Glasgow','London'],pp:.95,wage:.9,rent:1.05,corp:[.19,.25,50000],div:.25,inc:[[0,0],[12500,.2],[50000,.4],[125000,.45]],rate:.005,vol:1,grow:.8,red:.8,corrupt:.03,union:1,pop:1},
 ca:{n:'Canada',ic:'🇨🇦',cities:['Toronto','Vancouver'],pp:.9,wage:.85,rent:.95,corp:[.12,.26,500000],div:.25,inc:[[0,.15],[55000,.205],[111000,.26],[172000,.29],[246000,.33]],rate:0,vol:.9,grow:.9,red:.8,corrupt:.03,union:1.1,pop:.9},
 au:{n:'Australia',ic:'🇦🇺',cities:['Melbourne','Sydney'],pp:1,wage:1.1,rent:1.1,corp:[.25,.3,5000000],div:.3,inc:[[0,0],[18000,.16],[45000,.3],[135000,.37],[190000,.45]],rate:.01,vol:.8,grow:1,red:.8,corrupt:.03,union:1.1,pop:.9},
 nz:{n:'New Zealand',ic:'🇳🇿',cities:['Auckland','Wellington'],pp:.9,wage:.85,rent:1,corp:[.28,.28,0],div:.2,inc:[[0,.105],[10000,.175],[32000,.3],[50000,.33],[110000,.39]],rate:.01,vol:.9,grow:.8,red:.6,corrupt:.02,union:.9,pop:.5},
 ie:{n:'Ireland',ic:'🇮🇪',cities:['Dublin','Cork'],pp:1,wage:.95,rent:1.2,corp:[.125,.125,0],div:.4,inc:[[0,.2],[42000,.4]],rate:0,vol:1.1,grow:1.2,red:.7,corrupt:.03,union:.9,pop:.6},
 de:{n:'Germany',ic:'🇩🇪',cities:['Berlin','Munich'],pp:.95,wage:1,rent:.95,corp:[.3,.3,0],div:.26,inc:[[0,0],[11000,.24],[60000,.42],[270000,.45]],rate:-.005,vol:.8,grow:.7,red:1.3,corrupt:.02,union:1.4,pop:1},
 ch:{n:'Switzerland',ic:'🇨🇭',cities:['Zurich','Geneva'],pp:1.5,wage:1.4,rent:1.35,corp:[.14,.14,0],div:.2,inc:[[0,.1],[50000,.2],[150000,.35]],rate:-.02,vol:.6,grow:.8,red:.9,corrupt:.01,union:.7,pop:.5},
 ae:{n:'UAE',ic:'🇦🇪',cities:['Dubai','Abu Dhabi'],pp:1.1,wage:.9,rent:1.3,corp:[0,.09,100000],div:0,inc:[[0,0]],rate:.005,vol:1.1,grow:1.3,red:.7,corrupt:.15,union:.1,pop:.6},
 ng:{n:'Nigeria',ic:'🇳🇬',cities:['Lagos','Abuja'],pp:.35,wage:.25,rent:.45,corp:[0,.3,60000],div:.1,inc:[[0,.07],[5000,.15],[15000,.19],[30000,.21],[60000,.24]],rate:.12,vol:1.8,grow:1.3,red:1.4,corrupt:.5,union:.6,pop:1.3},
 za:{n:'South Africa',ic:'🇿🇦',cities:['Cape Town','Johannesburg'],pp:.55,wage:.45,rent:.6,corp:[.27,.27,0],div:.2,inc:[[0,.18],[15000,.26],[25000,.31],[35000,.36],[50000,.41],[100000,.45]],rate:.06,vol:1.4,grow:.6,red:1.1,corrupt:.3,union:1.3,pop:.9},
 in:{n:'India',ic:'🇮🇳',cities:['Mumbai','Bengaluru'],pp:.3,wage:.2,rent:.35,corp:[.25,.25,0],div:.3,inc:[[0,0],[4000,.05],[8000,.1],[12000,.15],[16000,.2],[20000,.3]],rate:.05,vol:1.3,grow:1.6,red:1.5,corrupt:.35,union:.8,pop:1.5},
 jp:{n:'Japan',ic:'🇯🇵',cities:['Tokyo','Osaka'],pp:.9,wage:.8,rent:.9,corp:[.3,.3,0],div:.2,inc:[[0,.05],[13000,.1],[22000,.2],[45000,.23],[60000,.33],[120000,.4],[280000,.45]],rate:-.03,vol:.8,grow:.5,red:1.2,corrupt:.02,union:.8,pop:1.3},
 sg:{n:'Singapore',ic:'🇸🇬',cities:['Singapore'],pp:1.2,wage:1.1,rent:1.5,corp:[.085,.17,150000],div:0,inc:[[0,0],[15000,.02],[30000,.07],[60000,.115],[90000,.15],[120000,.18],[180000,.22],[250000,.24]],rate:0,vol:1,grow:1.1,red:.5,corrupt:.01,union:.2,pop:.7},
 my:{n:'Malaysia',ic:'🇲🇾',cities:['Kuala Lumpur','Penang'],pp:.45,wage:.35,rent:.45,corp:[.17,.24,130000],div:.02,inc:[[0,0],[1100,.03],[8000,.08],[11000,.13],[15000,.21],[22000,.245],[130000,.26],[440000,.28],[670000,.3]],rate:.02,vol:1.1,grow:1.3,red:.9,corrupt:.2,union:.5,pop:.8},
 ph:{n:'Philippines',ic:'🇵🇭',cities:['Manila','Cebu'],pp:.35,wage:.25,rent:.4,corp:[.2,.25,90000],div:.1,inc:[[0,0],[4500,.15],[7000,.2],[14000,.25],[36000,.3],[144000,.35]],rate:.04,vol:1.3,grow:1.4,red:1.3,corrupt:.4,union:.5,pop:1.2}};
const CITIES=Object.values(COUNTRIES).flatMap(c=>c.cities.map(x=>`${x}, ${c.n}`));
const ctyKeyOfCity=city=>{const n=(city||'').split(',').slice(1).join(',').trim();return Object.keys(COUNTRIES).find(k=>COUNTRIES[k].n===n)||'us';};
const resKey=()=>ctyKeyOfCity(S.city);const resC=()=>COUNTRIES[resKey()];

function nameGroup(ck,last){
  const n=namePool(ck);if(!n)return null;
  if(!n.g)return n;

}

  if(!S)return true;

  try{body=slotBody()}catch(e){saveFail=true;return false}

  undoSnap=null;

    S.log.splice(0,Math.max(1,Math.floor(S.log.length/4)));

const MIG={

      Object.assign(n,keep,{life:b.me?'hands':'delegate',inv:1-(b.own||1)});if(b.public)n.pub={sent:1};return n;});
  },

};
function fillDefaults(s){
  if(!s)return s;
  if(!Array.isArray(s.qs))s.qs=[];
  if(typeof s.karma!=='number')s.karma=50;
  if(typeof s.ethic!=='number')s.ethic=50;
  if(!s.sk)s.sk={biz:0,tech:0,ppl:0};
  if(!s.born)s.born=(()=>{try{const n=(s.city||'').split(',').slice(1).join(',').trim();return Object.keys(COUNTRIES).find(k=>COUNTRIES[k].n===n)||'us'}catch(e){return 'us'}})();
  if(!Array.isArray(s.log)||!s.log.length)s.log=[{age:s.age||0,lines:[]}];
  if(!Array.isArray(s.miles))s.miles=[];
  if(!Array.isArray(s.nwHist))s.nwHist=[];
  if(!s.st)s.st={happy:50,health:50,smarts:50,looks:50};
  if(!s.used)s.used={};
  if(!s.flags)s.flags={crimes:0,jailYears:0,exes:0,record:false};
  if(!Array.isArray(s.rels))s.rels=[];
  if(!Array.isArray(s.biz))s.biz=[];
  if(!Array.isArray(s.assets))s.assets=[];
  if(!Array.isArray(s.angels))s.angels=[];
  if(!Array.isArray(s.exes))s.exes=[];
  if(!s.mem)s.mem={};
  if(!s.seen)s.seen={};
  if(!s.cecon)s.cecon=initCecon(s.econ?s.econ.phase:'normal');
  return s;
}
function migrate(s){
  if(!s)return s;
  if(typeof s.v!=='number')s.v=3;
  let guard=0;
  while(s.v<SAVE_V&&MIG[s.v]&&guard++<40){MIG[s.v](s);}
  if(s.v<SAVE_V)s.v=SAVE_V;   // gap in the chain: keep the life, fill defaults
  fillDefaults(s);           // a newer save than we know is loaded as-is, never wiped
  if(!s.seed)s.seed=newSeed();
  RS=s.rng!=null?s.rng:s.seed;
  return s;
}
function bootLoad(){
  loadPrefs();
  let any=false;for(let i=1;i<=NSLOTS;i++)if(lsGet(kSlot(i)))any=true;
  if(!any){const old=lsGet(K_OLD);
    if(old){try{const s=JSON.parse(old);let m={};try{m=JSON.parse(lsGet(K_OLDMETA)||'{}')}catch(e){}
      lsSet(kSlot(1),JSON.stringify({v:(s.v||3),S:s,META:Object.assign(blankMeta(),m),undo:null}));}catch(e){}}
  }
  const c=parseInt(lsGet(K_CUR)||'1',10);curSlot=(c>=1&&c<=NSLOTS)?c:1;
  let s=readSlot(curSlot);
  if(!s){for(let i=1;i<=NSLOTS;i++){const t=readSlot(i);if(t){curSlot=i;s=t;break;}}}
  if(s){
    S=migrate(s);useSlot(curSlot);
    if(bootPending&&undoSnap&&undoSnap.S){
      // a decision was still on screen when the game was closed. Replay that year
      // so the decision comes back instead of leaving things half finished.
      try{
        const back=JSON.parse(undoSnap.S), bm=JSON.parse(undoSnap.M);
        S=migrate(back);META=Object.assign(blankMeta(),bm||{});
        undoSnap=null;bootPending=false;Q=[];save();
        render();
        setTimeout(()=>toast('You left a decision unanswered, so age '+(S.age+1)+' will play again.'),400);
        return;
      }catch(e){}
    }
    render();if(!S.alive)showDeath();
  }
  else {useSlot(curSlot);startNew();}
}

{id:'firststeps',min:1,max:2,cls:'good',auto:()=>{S.st.health+=3;S.st.happy+=5;mile('Took my first steps');return 'I took my first steps across the living room and fell into the sofa. There was applause.'}},
{id:'babytoy',min:1,max:3,init:()=>({t:pick(['a wooden duck','a plastic spoon','one single sock','a saucepan lid','a cardboard box'])}),text:c=>`I have decided that ${c.t} is the most important object in the world.`,ch:[
  ['Take it everywhere',c=>{S.st.happy+=6;return `${c.t.charAt(0).toUpperCase()+c.t.slice(1)} came to the shops, to bed, and into the bath. My parents have stopped arguing about it.`}],
  ['Guard it and share nothing',()=>{S.st.happy+=3;const sb=sibling();if(sb)sb.rel-=4;return 'Mine. It is mine. This was not up for discussion.'}],
  ['Give it to someone I like',()=>{S.st.happy+=2;const p0=parent();if(p0)p0.rel+=6;S.karma=(S.karma||50)+2;return 'I handed it over with great ceremony. My parent still has it in a drawer years later.'}]]},
{id:'babysib',min:1,max:4,cond:()=>!!sibling(),init:()=>({n:sibling()?sibling().name:''}),text:c=>`${fname(c.n)} got a present and I did not.`,ch:[
  ['Wail about the injustice',()=>{const sb=sibling();if(sb)sb.rel-=5;S.st.happy-=2;return 'I made my feelings known at length. Nobody changed their mind.'}],
  ['Quietly take it when they leave the room',()=>{const sb=sibling();if(sb)sb.rel-=8;S.st.smarts+=2;S.karma=(S.karma||50)-3;return 'A clean operation. I was caught within four minutes.'}],
  ['Play with them instead',()=>{const sb=sibling();if(sb)sb.rel+=8;S.st.happy+=4;S.karma=(S.karma||50)+2;return 'We ended up sharing it, which was somehow better than having it.'}]]},
{id:'daycare',min:2,max:4,text:'My parents are talking about sending me somewhere with other small people.',ch:[
  ['Love it immediately',()=>{S.st.happy+=6;S.st.smarts+=3;return 'I walked in, found the sandpit, and did not look back. My parents were slightly offended.'}],
  ['Cling to the doorframe',()=>{const p0=parent();if(p0)p0.rel+=5;S.st.happy-=3;return 'I held on for eleven minutes. Eventually I let go, and by pickup I had made two friends.'}],
  ['Stay home instead',()=>{S.st.happy+=3;S.st.smarts-=2;const p0=parent();if(p0)p0.rel+=4;return 'I stayed home. A lot of daytime television was watched by both of us.'}]]},
{id:'tooth',min:6,max:7,cls:'good',auto:()=>{const g=R(1,5);S.money+=g;S.st.happy+=3;return `I lost my first tooth. The tooth fairy left ${fmt(g)}, which felt like a fortune.`}},
{id:'sandbox',min:3,max:6,text:'A kid at the playground snatched my plastic shovel.',ch:[
  ['Share nicely',()=>{S.st.happy+=2;return 'We built a lopsided sandcastle together.'}],
  ['Grab it back',()=>{if(rnd()<.5){S.st.happy+=4;return 'I reclaimed the shovel. Justice.'}S.st.happy-=4;return 'They bit me. We both went home crying.'}],
  ['Throw sand at them',()=>{S.st.happy+=3;const p=parent();if(p)p.rel-=5;return 'Direct hit. My parent gave me a long talk in the car.'},null,'hothead']]},
{id:'bday',min:3,max:10,text:'My parents asked what I want for my birthday.',ch:[
  ['A puppy',()=>{if(rnd()<.5){S.rels.push({id:uid(),type:'Pet',gender:'M',name:pick(PETS)+' the dog',age:0,rel:90,alive:true});S.st.happy+=12;return 'They got me a puppy! Best day ever.'}S.st.happy-=5;return 'They said no to the puppy. I sulked for a week.'}],
  ['A video game',()=>{S.st.happy+=8;return 'I got the game and played until my thumbs hurt.'}],
  ['A stack of books',()=>{S.st.smarts+=has('genius')?8:5;return 'I read every single one under the covers with a flashlight.'}]]},
{id:'bully',min:6,max:12,init:()=>({n:fullName(pick(['M','F']))}),text:c=>`A kid named ${fname(c.n)} keeps picking on me at school.`,ch:[
  ['Fight back',c=>{const win=rnd()<(has('hothead')||has('athletic')?.75:.45);remember('bully',{name:c.n,how:win?'won':'lost'});if(win){S.st.happy+=8;return 'I stood up for myself. They never bothered me again.'}S.st.health-=8;S.st.happy-=5;return 'I lost the fight and went home with a black eye.'}],
  ['Tell a teacher',c=>{remember('bully',{name:c.n,how:'told'});S.st.happy+=3;return 'The teacher sorted it out. Some kids called me a snitch for a month.'}],
  ['Try to befriend them',c=>{const ok=rnd()<(has('charming')||has('kind')?.8:.4);remember('bully',{name:c.n,how:ok?'friend':'lost'});if(ok){S.st.happy+=8;return 'Turns out they were lonely. We became real friends.'}S.st.happy-=5;return 'They laughed at me. It did not work.'}],
  ['Ignore it',c=>{remember('bully',{name:c.n,how:'ignored'});S.st.happy-=6;return 'It kept happening. School felt miserable for a while.'}]]},
{id:'talent',min:6,max:9,init:()=>({k:pick(['music','soccer','drawing'])}),text:c=>`My teacher says I have a real gift for ${c.k}.`,ch:[
  ['Beg for lessons',c=>{S.talent={k:c.k,lvl:1,at:S.age};S.st.happy+=5;return `My parents signed me up for ${c.k} lessons.`}],
  ['Meh, not interested',()=>'I went back to eating glue sticks.']]},
{id:'talent2',pri:1,min:9,max:15,cond:()=>S.talent&&S.talent.lvl===1&&S.age>=S.talent.at+3,text:()=>`My ${S.talent.k==='soccer'?'coach':'teacher'} wants me to enter a regional ${S.talent.k==='soccer'?'tournament':S.talent.k==='music'?'recital':'art show'}.`,ch:[
  ['Practice all summer',()=>{const fit=(has('athletic')&&S.talent.k==='soccer')||(has('creative')&&S.talent.k!=='soccer');S.talent.lvl=2;S.talent.at=S.age;
    if(rnd()<(fit?.8:.55)){S.st.happy+=10;mile(`Won a regional ${S.talent.k} competition`);return 'I practiced until everything ached, and I won first place!'}S.st.happy+=3;return 'I came fourth, but I got a lot better.'}],
  ['Skip it',()=>{S.talent.lvl=0;return 'I skipped it. My teacher looked quietly disappointed.'}]]},
{id:'talent3',pri:1,min:15,max:18,cond:()=>S.talent&&S.talent.lvl===2&&S.age>=S.talent.at+3,text:()=>`A scout saw me ${S.talent.k==='soccer'?'play':S.talent.k==='music'?'perform':'exhibit my work'} and offered me a university scholarship.`,ch:[
  ['Accept the scholarship',()=>{S.talent.lvl=3;S.talent.at=S.age;S.flags.scholarship=true;S.st.happy+=15;mile(`Earned a ${S.talent.k} scholarship`);return 'Free tuition! My parents screamed.'}],
  ['Turn it down',()=>{S.talent.lvl=3;S.talent.at=S.age;return 'I turned it down to keep my options open.'}]]},
{id:'talent4',pri:1,min:21,max:45,cond:()=>S.talent&&S.talent.lvl===3&&S.age>=S.talent.at+4,text:()=>({music:'Someone who heard me play years ago wants me to perform at weddings on weekends.',soccer:'A local club asked me to coach their youth team on weekends.',drawing:'A café owner who saw my old art show wants to commission murals.'})[S.talent.k],ch:[
  ['Say yes',()=>{S.talent.lvl=4;S.flags.talentPay=Math.round(R(8000,22000)*payF());unlock('prodigy');mile(`Turned a childhood love of ${S.talent.k} into paid work`);S.st.happy+=10;return `I said yes. It pays about ${fmt(S.flags.talentPay)} a year and I love it.`}],
  ['I\'m too busy',()=>{S.talent.lvl=0;return 'I said no. Sometimes I still wonder.'}]]},
{id:'sciencefair',min:9,max:13,text:'The school science fair is coming up.',ch:[
  ['Build a baking-soda volcano',()=>{S.st.smarts+=2;S.st.happy+=3;return 'It erupted all over the judge. Honorable mention.'}],
  ['Build a robot',()=>{if(rnd()<(has('genius')?.8:.35)){S.st.smarts+=6;S.st.happy+=8;mile('Won the school science fair');return 'My robot won first prize!'}S.st.smarts+=3;return 'My robot fell over during judging. Still learned a lot.'}],
  ['Skip it',()=>'I skipped it and watched cartoons.']]},
{id:'hamster',min:5,max:10,text:'The class hamster needs someone to look after it over the holidays.',ch:[
  ['Volunteer',()=>{if(rnd()<.8){S.st.happy+=5;return 'Mr. Nibbles and I had a lovely holiday.'}S.st.happy-=8;return 'Mr. Nibbles escaped into the walls. He was never seen again.'}],
  ['Let someone else',()=>'Somebody else took Mr. Nibbles home.']]},
/* ---- teens ---- */
{id:'cig',min:13,max:17,text:'Someone at a party offered me a cigarette.',ch:[
  ['Try it',()=>{remember('smoker');S.st.health-=4;S.st.happy+=2;return 'I coughed a lot but felt cool for about a minute.'}],['Say no',()=>{S.st.happy+=2;return 'I passed. Nobody cared.'}]]},
{id:'crush',min:14,max:17,init:()=>({n:first(S.gender==='M'?(rnd()<.85?'F':'M'):(rnd()<.85?'M':'F'))+' '+lastN()}),text:c=>`My crush, ${fname(c.n)}, smiled at me in the hallway.`,ch:[
  ['Ask them out',c=>{if(rnd()<S.st.looks/120+(has('charming')?.3:.15)){remember('crush',{name:c.n});S.st.happy+=12;return 'They said yes! We went for milkshakes and held hands.'}S.st.happy-=8;return 'They laughed and said no. I replayed it in my head for years.'}],
  ['Play it cool',c=>{remember('crush',{name:c.n,never:true});return 'I smiled back and kept walking.'}]]},
{id:'tutor',min:15,max:17,text:'My teacher offered me free after-school tutoring.',ch:[['Accept',()=>{S.st.smarts+=has('genius')?10:7;return 'My grades went up.'}],['Decline',()=>'I had better things to do.']]},
{id:'uncle',min:14,max:17,text:'My uncle offered to explain how investing works.',ch:[['Sure',()=>{S.st.smarts+=4;S.money+=500;return 'He explained index funds and gave me $500 to start with.'}],['Sounds boring',()=>'I passed on the finance lesson.']]},
{id:'party',min:14,max:17,text:'My friends are sneaking out to a party tonight.',ch:[
  ['Sneak out too',()=>{S.st.happy+=6;if(rnd()<.25){const p=parent();if(p)p.rel-=10;return 'I had a blast, then got caught climbing back in the window.'}return 'Best night of the year. Nobody found out.'}],
  ['Stay home',()=>'I stayed home and heard all about it on Monday.'],
  ['Throw my own party while my parents are away',()=>{S.st.happy+=12;if(rnd()<.4){living(['Mother','Father']).forEach(p=>p.rel-=25);return 'Legendary party. Also, someone broke the TV. I was grounded until graduation.'}return 'Legendary party. We cleaned up just in time.'},null,'reckless']]},
{id:'exam',min:14,max:17,text:"Big exam tomorrow and I haven't studied at all.",ch:[
  ['Cram all night',()=>{S.st.smarts+=3;S.st.health-=2;return 'I survived on energy drinks and scraped a B.'}],
  ['Cheat',()=>{if(rnd()<.7){S.st.happy+=2;return 'Nobody noticed. I felt a little gross about it.'}S.st.happy-=10;return 'I got caught. Detention, and a call home.'}],
  ['Wing it',()=>{S.st.happy+=6;return 'I walked in cold and got an A. Teachers hate me.'},null,'genius']]},
{id:'driving',min:16,max:17,auto:()=>{if(rnd()<.5+S.st.smarts/200){S.st.happy+=6;return 'I passed my driving test on the first try!'}return 'I failed my driving test. I may have driven over a cone. Several cones.'}},
{id:'teenviral',min:13,max:17,w:.2,cls:'good',auto:()=>{S.st.happy+=10;S.st.looks+=3;return 'A silly dance video I posted got two million views. Strangers recognize me now.'}},
/* ---- adult life ---- */
{id:'flu',rep:1,min:18,max:99,w:.6,cls:'bad',auto:()=>{S.st.health-=R(3,10);return 'I came down with a nasty flu.'}},
{id:'scam',min:18,max:80,text:'A stranger online offered me a "guaranteed" crypto investment for $2,000.',ch:[
  ['Invest',()=>{S.money-=2000;if(rnd()<.1){S.money+=6000;return 'Somehow it tripled. I made $4,000!'}return 'The website vanished the next day, along with my $2,000.'}],['Block them',()=>'I blocked them.']]},
{id:'speeding',rep:1,min:18,max:95,cond:hasCar,text:'I got pulled over for speeding.',ch:[
  ['Pay the $250 ticket',()=>{S.money-=250;return 'I paid the ticket.'}],
  ['Fight it in court',()=>{if(rnd()<.5)return 'The judge dismissed it!';S.money-=600;return 'I lost and paid $600 with court fees.'}],
  ['Charm the officer',()=>{if(rnd()<.7)return 'We chatted about their dog. They let me off with a warning.';S.money-=250;return 'They were immune to my charm. $250 ticket.'},null,'charming']]},
{id:'wedding',rep:1,min:20,max:65,text:'An old friend invited me to their wedding.',ch:[['Go',()=>{S.money-=300;S.st.happy+=7;return 'Great party. I danced until my shoes gave out.'}],['Skip it',()=>'I sent a card instead.']]},
{id:'raffle',rep:1,min:18,max:99,w:.5,cls:'good',auto:()=>{const w=R(50,500);S.money+=w;return `I won ${fmt(w)} in a grocery store raffle.`}},
{id:'coat',min:18,max:99,w:.5,cls:'good',auto:()=>{S.money+=40;return 'I found $40 in an old coat pocket. Past me is a hero.'}},
{id:'toilet',min:18,max:80,w:.5,cls:'bad',auto:()=>{S.money-=800;return 'My phone fell in the toilet. $800 for a new one.'}},
{id:'refund',rep:1,min:22,max:99,w:.4,cls:'good',auto:()=>{const r=R(300,3000);S.money+=r;return `I got a tax refund of ${fmt(r)}.`}},
{id:'jury',min:21,max:75,auto:()=>{S.st.happy-=2;return 'I got jury duty. The case was about a stolen lawn gnome. Riveting.'}},
{id:'idtheft',min:20,max:80,text:'Someone stole my identity and opened credit cards in my name.',ch:[
  ['Freeze my credit ($200)',()=>{S.money-=200;return 'I locked everything down quickly.'}],['Hope it sorts itself out',()=>{const l=R(2000,8000);S.money-=l;return `It did not. I lost ${fmt(l)}.`}]]},
{id:'gymsales',min:20,max:70,text:'A gym salesperson cornered me with a "lifetime" membership for $1,200.',ch:[
  ['Sign up',()=>{S.money-=1200;S.st.health+=has('athletic')?8:4;return 'I actually went. Mostly.'}],['Run away',()=>'I faked a phone call and fled.']]},
{id:'trip',rep:1,min:22,max:75,cond:partner,text:'My partner wants to go on a trip together.',ch:[
  ['Plan something ($2,000)',()=>{S.money-=2000;partner().rel+=relGain(15);S.st.happy+=joy(8);return 'We had an amazing week away.'}],['Stay home',()=>{partner().rel-=8;return 'They were disappointed.'}]]},
{id:'cousin',min:22,max:80,cond:()=>S.money>5000,text:'My cousin asked to borrow $2,000.',ch:[
  ['Lend it',()=>{if(rnd()<.5)return 'They paid me back a few months later.';S.money-=2000;remember('cousin');return 'I never saw that money again.'}],
  ['Refuse',()=>'I said no. Family dinner was awkward.']]},
{id:'cousin2',pri:1,min:25,max:99,cond:()=>mem('cousin')&&S.age>=mem('cousin').at+6,cls:'good',auto:()=>{S.money+=6000;return 'Out of nowhere, my cousin hit it big in Vegas and paid back that old $2,000 loan... as $6,000.'}},
{id:'cat',min:5,max:100,text:'A stray cat followed me home.',ch:[
  ['Adopt it',()=>{S.rels.push({id:uid(),type:'Pet',gender:'F',name:pick(PETS)+' the cat',age:R(1,4),rel:80,alive:true});S.st.happy+=8;return 'I adopted the cat. It now owns me.'}],['Shoo it away',()=>'It gave me a judgmental look and wandered off.']]},
{id:'wallet',min:8,max:90,init:()=>({n:fullName(pick(['M','F']))}),text:c=>`I found a wallet on the sidewalk with $200 inside. The ID says ${c.n}.`,ch:[
  ['Keep the cash',c=>{S.money+=200;remember('wallet',{name:c.n,kept:true});return 'I pocketed the $200.'}],
  ['Return it',c=>{S.money+=20;S.st.happy+=has('kind')?10:6;remember('wallet',{name:c.n});return 'The owner was so grateful they gave me $20.'}]]},
{id:'checkup',rep:1,min:55,max:110,text:'My doctor recommended a full checkup.',ch:[['Go ($300)',()=>{S.money-=300;S.st.health+=8;return 'They caught a small issue early.'}],['Skip it',()=>{S.st.health-=3;return 'I skipped it.'}]]},
{id:'hip',min:50,max:110,cls:'bad',auto:()=>{S.st.health-=R(5,15);return 'I slipped on ice and hurt my hip.'}},
{id:'phoneapp',min:65,max:100,text:'My grandkid is trying to teach me a new phone app.',ch:[['Learn it',()=>{S.st.smarts+=2;S.st.happy+=3;return 'I now send everyone way too many stickers.'}],['Absolutely not',()=>'I told them phones were for calling people.']]},
{id:'midlife',min:40,max:50,text:'Midlife crisis! I suddenly feel like I need to...',ch:[
  ['Buy a sports car ($115,000)',()=>{S.money-=115000;S.assets.push({n:'Sports coupe',v:115000,k:'car',run:8000,age:0});S.st.happy+=joy(15);return 'I bought a red sports coupe. I feel 25 again.'},()=>S.money<115000],
  ['Take up surfing',()=>{S.st.health+=6;S.st.happy+=6;return 'I wiped out a lot. Then I caught one wave. Worth it.'}],
  ['Get a dramatic haircut',()=>{S.st.looks+=R(-8,10);S.st.happy+=4;return 'Bold choice. People have opinions.'}],
  ['Quit everything and travel ($10,000)',()=>{S.money-=10000;S.st.happy+=15;if(S.job){const t=title(S.job);S.job=null;return `I quit my job as a ${t} and backpacked across three continents.`}return 'I backpacked across three continents.'},null,'reckless']]},
{id:'grandkid',rep:1,min:45,max:100,w:.6,cond:()=>kids().some(k=>k.alive&&k.age>=25&&k.age<=40),init:()=>({k:pick(kids().filter(k=>k.alive&&k.age>=25&&k.age<=40))}),cls:'good',auto:c=>{S.st.happy+=12;mile('Became a grandparent');return `My child ${fname(c.k.name)} had a baby. I'm a grandparent!`}},
/* ---- neighbor storyline ---- */
{id:'neighbor',min:25,max:70,cond:()=>homes().some(a=>!a.rent),init:()=>({n:first(pick(['M','F']))}),text:c=>`My new neighbor ${c.n} complained that my music is too loud.`,ch:[
  ['Apologize',c=>{remember('neighbor',{n:c.n,good:true});return `I apologized and brought ${c.n} cookies.`}],
  ['Ignore it',c=>{remember('neighbor',{n:c.n});return 'I kept the volume where it was.'}],
  ['Turn it up',c=>{remember('neighbor',{n:c.n,war:true});S.st.happy+=5;return 'I turned it up. It felt amazing.'},null,'hothead']]},
{id:'neighbor2',pri:1,min:27,max:99,cond:()=>mem('neighbor')&&S.age>=mem('neighbor').at+2,init:()=>mem('neighbor'),
  text:c=>c.good?`${c.n}, the neighbor I apologized to, turns out to be a retired stockbroker. Over coffee they whispered: "Nimbus Tech. Trust me."`:`My feud with ${c.n} next door escalated. They're suing me over a "property line issue".`,
  ch:c=>c.good?[['Thank them',()=>{S.tip='NMBS';remember('tipNMBS');return 'I made a note. Maybe I should buy some Nimbus Tech.'}]]:[
    ['Fight it in court ($5,000)',()=>{S.money-=5000;if(rnd()<(c.war?.35:.5))return 'I won! The fence stays where it is.';const d=R(10000,40000);S.money-=d;return `I lost and paid ${fmt(d)} in damages.`}],
    ['Settle for $8,000',()=>{S.money-=8000;return `I paid ${c.n} to go away. We still don't wave.`}]]},
/* ---- sibling storyline ---- */
{id:'sib',min:25,max:60,cond:()=>sibling()&&S.money>=15000,init:()=>({p:sibling()}),text:c=>`My ${c.p.gender==='M'?'brother':'sister'} ${fname(c.p.name)} is drowning in debt and asked me for $15,000.`,ch:[
  ['Lend it',c=>{S.money-=15000;remember('sib',{id:c.p.id,how:'lent'});c.p.rel+=10;return 'I lent them the money and made them promise to pay it back.'}],
  ['Refuse',c=>{remember('sib',{id:c.p.id,how:'refused'});c.p.rel-=25;return 'I said no. They hung up on me.'}],
  ['Give it as a gift',c=>{S.money-=15000;remember('sib',{id:c.p.id,how:'gift'});c.p.rel+=30;S.st.happy+=6;return 'I told them it was a gift, no strings attached. They cried.'},null,'kind']]},
{id:'sib2',pri:1,min:28,max:99,cond:()=>mem('sib')&&S.age>=mem('sib').at+3&&S.rels.some(p=>p.id===mem('sib').id&&p.alive),init:()=>({m:mem('sib'),p:S.rels.find(p=>p.id===mem('sib').id)}),
  text:c=>c.m.how==='refused'?`${fname(c.p.name)} and I haven't talked in years. They just texted: "can we talk?"`:c.m.how==='gift'?`${fname(c.p.name)} used my gift to start a bakery. It's doing great.`:`${fname(c.p.name)} called about the $15,000 I lent them.`,
  ch:c=>c.m.how==='refused'?[['Reconnect',()=>{c.p.rel+=35;S.st.happy+=8;return 'We talked for three hours. It felt like old times.'}],['Leave it on read',()=>{c.p.rel-=10;return 'I left it on read.'}]]
   :c.m.how==='gift'?[['Visit the bakery',()=>{S.money+=5000;S.st.happy+=8;c.p.rel+=10;return 'They handed me $5,000 and a lifetime supply of croissants.'}]]
   :rnd()<.6?[['Answer',()=>{S.money+=20000;c.p.rel+=15;return 'They paid me back $20,000, with interest, and a hug.'}]]
   :[['Answer',()=>{c.p.rel-=15;S.st.happy-=6;return 'They lost it all again and asked for more. I said no this time.'}]]},
/* ---- marriage storyline ---- */
{id:'marr',rep:1,min:22,max:90,w:2,cond:()=>spouse()&&spouse().rel<45&&!mem('marr'),init:()=>({p:spouse()}),text:c=>`${fname(c.p.name)} and I keep fighting about everything.`,ch:[
  ['Couples counseling ($3,000)',c=>{S.money-=3000;c.p.rel+=20;remember('marr',{id:c.p.id});return 'We started counseling. It was awkward and it helped.'}],
  ['Plan a date night',c=>{c.p.rel+=relGain(8);remember('marr',{id:c.p.id});return 'We had a nice dinner. It helped a little.'}],
  ['Ignore it',c=>{c.p.rel-=10;remember('marr',{id:c.p.id});return 'I buried myself in other things.'}]]},
{id:'marr2',pri:1,min:24,max:99,cond:()=>mem('marr')&&S.age>=mem('marr').at+2&&spouse()&&spouse().id===mem('marr').id,init:()=>({p:spouse()}),
  text:c=>c.p.rel>=55?`${fname(c.p.name)} surprised me by asking to renew our vows.`:`${fname(c.p.name)} sat me down and said they want a separation.`,
  ch:c=>{const done=()=>{delete S.mem.marr;};return c.p.rel>=55?[['Say yes',()=>{done();S.money-=5000;S.st.happy+=15;c.p.rel+=10;return 'We renewed our vows on a beach. Everyone cried.'}]]
   :[['Fight for us',()=>{done();if(rnd()<.5+(has('charming')?.2:0)){c.p.rel+=30;return 'We worked through it. We\'re stronger now.'}return divorce(c.p)}],['Agree to divorce',()=>{done();return divorce(c.p)}]]}},
/* ---- illness storyline ---- */

/* ================= economy & markets ================= */
/* S.econ is the world economy: it drives the global markets (stocks, crypto, bonds) and supplier prices.
   S.cecon holds each country's own economy: jobs, loans, home prices and business sales follow it. */
const initCecon=ph=>{const o={};Object.keys(COUNTRIES).forEach(k=>o[k]={phase:ph||'normal',yrs:0});return o;};
const phaseOf=k=>((S.cecon&&S.cecon[k])||S.econ).phase;
const localPhase=()=>phaseOf(resKey());
const bizPhase=b=>phaseOf(b.cty&&COUNTRIES[b.cty]?b.cty:resKey());
// Each country moves on its own, but tends to follow the world when the world economy turns.
function countryEconYear(glob,globTurned){
  S.cecon=S.cecon||initCecon(glob);
  const mine=resKey();
  Object.entries(COUNTRIES).forEach(([k,c])=>{const e=S.cecon[k]=S.cecon[k]||{phase:glob,yrs:0},old=e.phase;
    const follow=globTurned?.5:glob==='crash'?.3:.08;
    if(rnd()<follow)e.phase=glob;
    else{const x=rnd(),v=c.vol,g=c.grow;
      if(old==='normal')e.phase=x<.13*g?'boom':x<.13*g+.11*v?'recession':'normal';
      else if(old==='boom')e.phase=x<.1*v?'crash':x<.1*v+.35?'normal':'boom';
      else if(old==='recession')e.phase=x<.4?'normal':x<.4+.08*v?'crash':'recession';
      else e.phase=x<.6?'recession':'normal';}
    e.yrs=e.phase===old?e.yrs+1:0;
    if(k===mine&&e.phase!==old&&S.age>=16){const msg={boom:'is booming.',normal:'has settled back to normal.',recession:'fell into a recession.',crash:'crashed into a deep slump.'}[e.phase];
      line(`${c.ic} ${c.n}'s economy ${msg}`,e.phase==='boom'||e.phase==='normal'?'good':'bad');}
  });
}
function econYear(){
  const e=S.econ,old=e.phase,x=rnd();
  if(old==='normal')e.phase=x<.15?'boom':x<.27?'recession':'normal';
  else if(old==='boom')e.phase=x<.15?'crash':x<.5?'normal':'boom';
  else if(old==='recession')e.phase=x<.4?'normal':x<.5?'crash':'recession';
  else e.phase=x<.6?'recession':'normal';
  e.yrs=e.phase===old?e.yrs+1:0;
  if(e.phase!==old&&S.age>=16){const msg={boom:'World markets are booming.',normal:'World markets have settled back to normal.',recession:'World markets fell into a slump.',crash:'The global stock market crashed!'}[e.phase];line(`🌍 ${msg}`,e.phase==='boom'||e.phase==='normal'?'good':'bad');}
  countryEconYear(e.phase,e.phase!==old);
  const [mu,sd]=PHASE[e.phase].m;const mret=mu+gauss()*sd;
  TICK.forEach(t=>{const q=S.mkt[t.s];let r;
    if(t.fixed!=null)r=t.fixed;
    else if(t.crypto){const y=rnd();r=y<.3?-50+gauss()*12:y<.65?-5+gauss()*20:y<.9?45+gauss()*20:130+gauss()*50;if(e.phase==='crash')r-=30;}
    else if(t.meme){const y=rnd();r=y<.1?-99:y<.65?-70+gauss()*10:y<.9?30+gauss()*20:y<.985?200+gauss()*60:1200;}
    else if(t.penny){r=rnd()<.07?-100:gauss()*70;}
    else r=t.drift+t.beta*mret+gauss()*t.sd;
    if(S.tip===t.s){r=150+gauss()*30;const own=(S.hold[t.s]||0)*q.p;if(own>0){line(`${t.n} shares rocketed ${Math.round(r)}% this year. That tip was real!`,'good');if(mem('tipVLTR')&&t.s==='VLTR')unlock('timetravel');}}
    r=Math.max(-100,r);q.chg=r;q.p=q.p*(1+r/100);q.h=q.h||[];q.h.push({age:S.age,nw:q.p});if(q.h.length>40)q.h.shift();
    if(t.penny&&r<=-100){if(S.hold[t.s]>0)line(`${t.n} went bankrupt. My shares are now worthless.`,'bad');S.hold[t.s]=0;S.basis[t.s]=0;q.p=t.start;}
    if(q.p<t.start*1e-6)q.p=t.start*1e-6;
  });
  S.tip=null;
  S.ret.bal=Math.round(S.ret.bal*(1+S.mkt.MKT.chg/100));
  const hr=PHASE[localPhase()].home+gauss()*3;S.homeIdx*=1+hr/100;
  S.assets.forEach(a=>{if(a.k==='car'){a.v=Math.round(a.v*.88);a.age=(a.age||0)+1;}else a.v=Math.round(a.v*(1+(hr+hArea(a).g+gauss()*2)/100));});
}

/* ================= property, debt, costs ================= */
function propertyYear(){
  let rentIn=0;
  homes().forEach(a=>{
    S.money-=Math.round(a.v*hCond(a).up);
    if(a.mort&&a.mort.bal>0){const int=a.mort.bal*a.mort.rate;const pay=Math.min(a.mort.pay,a.mort.bal+int);a.mort.bal=Math.max(0,Math.round(a.mort.bal+int-pay));S.money-=Math.round(pay);
      if(a.mort.bal===0){a.mort=null;line(`I paid off the mortgage on my ${a.n.toLowerCase()}!`,'good');unlock('debtfree');}}
    if(a.rent){const y=rnd();
      if(y<.12)line(`My tenant at the ${a.n.toLowerCase()} stopped paying rent this year.`,'bad');
      else{let r=Math.round(a.v*hYld(a));if(y<.22){const fix=Math.round(a.v*.02);r-=fix;line(`Repairs at my rental cost ${fmt(fix)}.`,'bad');}rentIn+=r;}}
  });
  S.assets.filter(a=>a.k==='car').forEach(a=>{S.money-=carRun(a);if(rnd()<(a.age||0)*.025){const fix=Math.round(Math.max(800,a.v*.15+R(500,2500)));S.money-=fix;line(`My ${a.n.toLowerCase()} broke down. Repairs cost ${fmt(fix)}.`,'bad');}});
  if(rentIn){S.money+=Math.round(rentIn*.8);line(`My rental properties earned ${fmt(rentIn*.8)} after tax.`,'good');}
  const atHome=S.age<22&&living(['Mother','Father']).length&&!homes().length;
  if(S.age>=18&&!S.jail&&!atHome)S.money-=livingCost();
  if(S.sloan>0){S.sloan=Math.round(S.sloan*1.04);if(S.job){const p=Math.min(S.sloan,Math.round(S.job.s*.1));S.sloan-=p;S.money-=p;if(S.sloan===0)line('I paid off my student loans!','good');}}
  if(S.flags.talentPay&&!S.jail&&S.age<70){S.money+=S.flags.talentPay;}
  // trustee protects minors
  if(S.age<18&&S.money<0){homes().sort((a,b)=>a.v-b.v).forEach(a=>{if(S.money<0){S.money+=saleVal(a)-(a.mort?a.mort.bal:0);S.assets=S.assets.filter(x=>x!==a);line(`My trustee sold the ${a.n.toLowerCase()} to cover costs.`,'bad');}});if(S.money<0)S.money=0;}
  if(S.money<0&&S.age>=18){S.money=Math.round(S.money*1.07);S.st.happy-=3;}
}

/* ================= work ================= */
function workYear(){
  const j=S.job;if(!j)return;const C=CAREERS[j.c];
  if(S.jail){line(`I lost my job as a ${title(j)} while in prison.`,'bad');S.job=null;return;}
  const lay={boom:.01,normal:.02,recession:.07,crash:.14}[localPhase()]*(C.pub?.35:1);
  if(rnd()<lay){const sev=Math.round(j.s*.1);S.money+=sev;line(`I was laid off from my job as a ${title(j)}. I got ${fmt(sev)} in severance.`,'bad');S.job=null;S.st.happy-=12;return;}
  const contrib=Math.round(j.s*S.ret.pct/100),match=Math.round(j.s*Math.min(S.ret.pct,5)/100*.5);

  j.perf+=style+(S.st.smarts-50)/12+((S.ethic||50)-50)/10+Math.min(3,j.lvlYrs/2)+R(-7,6)+(has('ambitious')?4:0)-(has('lazy')?4:0)+(C.art&&has('creative')?3:0);
  if(j.style==='hustle'){S.st.happy-=4;S.st.health-=2;}if(j.style==='slack')S.st.happy+=3;

  else if(j.perf<60){j.warn=0;j.s=Math.round(j.s*1.03);msg='Meets expectations. 3% raise.';}
  else if(j.perf<85){j.warn=0;j.s=Math.round(j.s*1.05);const b=Math.round(j.s*.05);S.money+=netPay(j.s+b)-netPay(j.s);msg=`Exceeds expectations. 5% raise and a ${fmt(b)} bonus.`;cls='good';}
  else{j.warn=0;j.s=Math.round(j.s*1.06);const b=Math.round(j.s*R(10,20)/100);S.money+=netPay(j.s+b)-netPay(j.s);msg=`Outstanding! 6% raise and a ${fmt(b)} bonus.`;cls='good';
    if(canPromote(j)&&rnd()<.55){line(`Performance review: ${msg}`,cls);line(promote(j),'good');return;}}
  line(`Performance review: ${msg}`,cls);trackBest();
}
function trackBest(){if(S.job){const x=cexp(S.job.c);x.lvl=Math.max(x.lvl,S.job.lvl);}if(S.job&&(!S.bestJob||S.job.s>S.bestJob.s))S.bestJob={t:title(S.job),s:S.job.s};}
function cexp(c){S.cexp=S.cexp||{};if(!S.cexp[c])S.cexp[c]={yrs:S.careers.includes(c)&&!(S.job&&S.job.c===c)?1:0,lvl:0};return S.cexp[c];}
function canPromote(j){const C=CAREERS[j.c];return j.lvl<C.t.length-1&&j.lvlYrs>=1&&S.st.smarts>=reqSm(C,j.lvl+1);}
function promote(j){const C=CAREERS[j.c];j.lvl++;j.s=Math.max(Math.round(j.s*1.12),Math.round(C.t[j.lvl][1]*payF()));j.lvlYrs=0;j.perf=55;S.st.happy+=10;mile(`Promoted to ${title(j)}`);trackBest();sfx('good');return `I was promoted to ${title(j)}! New salary: ${fmt(j.s)}.`;}
function hire(id,lvl=0,sal){const C=CAREERS[id];S.job={c:id,s:sal||Math.round(C.t[lvl][1]*payF()),perf:50,lvl,yrs:0,lvlYrs:0,warn:0,style:'normal'};S.biz.forEach(b=>{if(b.life==='hands')b.life='delegate'});if(!S.careers.includes(id)){S.careers.push(id);mile(`Started working as a ${C.t[lvl][0]}`);}trackBest();}

/* ---- job openings and interviews ---- */
const STATIC_JOBS=['police','teach','nurse','med','law'];
const JOB_COS=['Northwind','Brightpath','Kestrel Labs','Bluefin','Orbital','Halcyon','Ironwood','Summit & Co','Lumen','Redline','Parkside','Crestview'];
function openings(){
  if(S.jobOpen&&S.jobOpen.age===S.age)return S.jobOpen.list;
  const list=[],mine=S.job?S.job.c:null;
  STATIC_JOBS.forEach(c=>{if(c!==mine||S.job.lvl>0)list.push({c,lvl:0,static:1});});
  // senior roles where I have experience
  Object.entries(S.cexp||{}).forEach(([c,x])=>{if(!CAREERS[c]||x.yrs<1)return;const top=Math.min(x.lvl,CAREERS[c].t.length-1);
    const lv=[...new Set([top,Math.max(0,top-1),Math.max(0,top-2)])].filter(l=>l>0&&!(c===mine&&l<=S.job.lvl));
    lv.forEach(l=>{if(l===top||rnd()<.6)list.push({c,lvl:l,co:pick(JOB_COS)});});});
  // random odd jobs and entry-level roles
  const pool=Object.keys(CAREERS).filter(c=>!STATIC_JOBS.includes(c)&&c!==mine);
  const n=R(3,5);for(let i=0;i<n&&pool.length;i++){const c=pool.splice(Math.floor(rnd()*pool.length),1)[0];list.push({c,lvl:0,co:CAREERS[c].sm===0&&!CAREERS[c].deg?null:pick(JOB_COS)});}
  list.forEach(o=>{const base=CAREERS[o.c].t[o.lvl][1]*payF();o.pay=Math.round(base*(o.static?1:R(90,115)/100)/100)*100;o.id=uid();});
  S.jobOpen={age:S.age,list};return list;}
function jobBlock(o){const C=CAREERS[o.c],dg=S.edu.degrees,need=C.sm||0;
  return S.flags.hs===false&&need>0?'Needs a diploma':C.deg&&!dg.includes(C.deg)?`Needs ${C.deg} degree`:C.car&&!hasCar()?'Needs a car':C.clean&&S.flags.record?'Criminal record':S.st.smarts<need?`Needs smarts ${need}+`:null;}
function hireChance(o,bonus=0){const C=CAREERS[o.c],x=(S.cexp||{})[o.c],need=reqSm(C,o.lvl);
  let c=.5+(S.st.smarts-need)/200+(S.st.looks-50)/400+(S.st.happy-50)/250+(has('charming')?.05:0)+bonus;
  if(x&&x.yrs)c+=Math.min(.12,x.yrs*.015);
  c+=((S.ethic||50)-50)/600+sk('ppl')/600+((S.karma||50)-50)/1000+(o.c==='tech'?sk('tech')/400:0)+(o.lvl>=2?sk('biz')/800:0);
  if(o.lvl>0)c-=o.lvl===(x?x.lvl:0)?.12:0;
  if(C.sm===0&&!C.deg)c+=.2;
  c*={boom:1.1,normal:1,recession:.85,crash:.7}[localPhase()];
  return Math.max(.05,Math.min(.95,c));}
const IVQ=[
  ['Tell us about a time you failed.',['Share an honest story and what I learned','happy'],['Turn it into a success story','looks'],['Walk through the root cause in detail','smarts']],
  ['Why should we hire you over the other candidates?',['Talk about how much I care about the work','happy'],['Sell myself with confidence','looks'],['List the results I can prove','smarts']],
  ['How do you handle a difficult coworker?',['Talk it out calmly and kindly','happy'],['Win them over with charm','looks'],['Set clear rules and processes','smarts']],
  ['Where do you see yourself in five years?',['Growing here with the team','happy'],['Leading this department','looks'],['Being the top expert in the field','smarts']],
  ['Here is a tricky problem. How would you solve it?',['Admit what I do not know and think out loud','happy'],['Answer fast and confidently','looks'],['Break it into steps and solve it properly','smarts']],
];
function applyJob(o){const C=CAREERS[o.c],t=C.t[o.lvl][0];
  const finish=bonus=>{S.used.apps=(S.used.apps||0)+1;const had=S.job;
    if(rnd()<hireChance(o,bonus)){hire(o.c,o.lvl,o.pay);S.jobOpen.list=S.jobOpen.list.filter(y=>y!==o);stay(`I got hired as a ${t}${o.co?` at ${o.co}`:''}!${had?' I left my old job.':''}`,'good');}
    else{o.gone=1;S.st.happy-=2;stay(pick([`They went with someone else for the ${t} role.`,`I interviewed to be a ${t} but didn't get it.`,`The ${t} role went to an internal candidate.`]),'bad');}};
  if(C.sm===0&&!C.deg&&o.lvl===0)return finish(0);
  const q=pick(IVQ),lvlNote=o.lvl>0?' It\'s a senior role, so they dig deep.':'';
  choiceModal(`Interview: ${t}`,`${o.co?o.co+'. ':''}"${q[0]}"${lvlNote}`,q.slice(1).map(([txt,st])=>[txt,()=>{
    const v=st==='looks'?S.st.looks+(has('charming')?10:0):S.st[st];const bonus=(v-50)/250+R(-5,5)/100;finish(bonus);}]));}

function annuity(P,r,n){return P*r/(1-Math.pow(1+r,-n));}
function loanRate(){return Math.max(.01,{boom:.07,normal:.06,recession:.05,crash:.045}[localPhase()]+resC().rate+(S.age>=18?(700-creditScore())/12000:0));}

function unlock(id){if(META.ach[id]||!ACH[id])return;META.ach[id]=Date.now();saveMeta();const [ic,n]=ACH[id];toast(`🏆 ${ic} ${n}`);sfx('ach');}

  if(S.biz.some(b=>b.gens>=3))unlock('family3');

function checkChal(){

}

/* ================= obituary ================= */
function ribbon(){
  const nw=netWorth();
  if(S.biz.some(b=>b.public)||S.peak>=50e6)return 'Tycoon';
  if(nw>=1e6)return 'Rich';
  if(S.flags.jailYears>=5)return 'Criminal';
  if(S.job&&S.job.lvl===CAREERS[S.job.c].t.length-1)return 'Top of the ladder';
  if(S.st.smarts>=90)return 'Genius';
  if(kids().length>=3)return 'Family person';
  if(S.flags.exes>=4)return 'Heartbreaker';
  if(S.age>=95)return 'Survivor';
  if(S.st.happy>=80)return 'Content';
  if(S.age<30)return 'Brief';
  return 'Ordinary';
}
const ADJ={ambitious:'relentlessly ambitious',lazy:'gloriously unhurried',charming:'impossible not to like',genius:'the smartest person in most rooms',athletic:'always the first one up the hill',reckless:'fearless to a fault',frugal:'legendarily thrifty',spender:'generous with their credit card',lucky:'improbably lucky',anxious:'a devoted worrier',creative:'endlessly creative',hothead:'quick to anger and quicker to laugh',kind:'deeply kind',hustler:'always working an angle'};
const listJoin=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function obituary(){
  const fn=fname(S.name),P=[],nw=netWorth();
  P.push(`${S.name} died at age ${S.age} from ${S.cause}, in ${S.city}. ${fn} was ${listJoin(S.traits.map(t=>ADJ[t]))}.`);
  if(S.careers.length){const top=S.bestJob?S.bestJob.t:null;
    P.push(`${fn} worked ${S.careers.length>2?`in ${S.careers.length} different fields`:'for years'}${top?`, rising as high as ${top.toLowerCase()}`:''}.${S.miles.some(m=>m.t.startsWith('Got fired'))?' There was at least one firing, which they described as "a mutual misunderstanding."':''}`);}
  else if(S.age>=25)P.push(`${fn} never held a steady job, which they called "a lifestyle choice."`);
  const degs=S.edu.degrees;if(degs.length)P.push(`They earned ${degs.length>1?'degrees':'a degree'} in ${degs.join(' and ')}.`);
  const founded=S.miles.filter(m=>/went out of business|was sold|closed its doors|Sold /.test(m.t));
  if(S.biz.length||founded.length)P.push(`An entrepreneur at heart, ${fn} ${S.biz.length?`still owned ${listJoin(S.biz.map(b=>b.name))}`:'built businesses'}${founded.length?`, and had ${founded.length} other venture${founded.length>1?'s':''} that ${founded.some(m=>m.t.includes('went out'))?'did not all survive':'ended on their own terms'}`:''}.`);
  const memeGain=S.flags.memeProfit||0;
  P.push(nw<0?`They left behind more debt than furniture.`:nw<20000?`They left a modest estate and a very full junk drawer.`:nw<1e6?`They left a comfortable nest egg of ${fmt(nw)}.`:`They left a fortune of ${fmt(nw)}${memeGain>=1e5?', much of it, bafflingly, from Moonpaw Coin':''}.`);
  const odd=S.miles.filter(m=>/lightning|treasure|game show|strange lights|memoir|science fair|competition|scholarship|paid work/.test(m.t));
  if(odd.length)P.push(`Friends will remember that they ${odd.slice(0,2).map(m=>m.t.charAt(0).toLowerCase()+m.t.slice(1)).join(', and ')}.`);
  if(S.flags.jailYears)P.push(`They served ${S.flags.jailYears} year${S.flags.jailYears>1?'s':''} in prison, a chapter the family politely skips at holidays.`);
  const sp=spouse(),k=kids().filter(c=>c.alive),pets=living(['Pet']);
  const surv=[];if(sp)surv.push(`their spouse ${fname(sp.name)}`);if(k.length)surv.push(`${k.length} child${k.length>1?'ren':''}`);if(pets.length)surv.push(pets.map(p=>fname(p.name)).join(' and ')+(pets.length>1?', their pets':', their pet'));
  if(surv.length)P.push(`${fn} is survived by ${surv.join(', ')}${S.flags.exes>=3?', and several exes who were "not surprised"':''}.`);
  else P.push(`${fn} is survived by ${S.flags.exes>=2?'a handful of exes and ':''}a houseplant that has seen things.`);
  P.push(pick(['In lieu of flowers, the family asks that you call your mother.','A small service will be held, with snacks.','They would want you to know they were right about most things.','Their last words were reportedly "wait, watch this."']));
  return P.join(' ');
}

function b64enc(str){try{return btoa(unescape(encodeURIComponent(str)))}catch(e){return ''}}
function b64dec(str){try{return decodeURIComponent(escape(atob(String(str).replace(/\s+/g,''))))}catch(e){return null}}
function backupCode(){return 'ONELIFE1:'+b64enc(JSON.stringify({v:SAVE_V,S,META}));}
function savesSheet(){openSheet(s=>{

  for(let i=1;i<=NSLOTS;i++){
    const inf=slotInfo(i), here=i===curSlot;
    const sub=inf?`${inf.name}, age ${inf.age}${inf.gen>1?`, gen ${inf.gen}`:''}${inf.alive?'':' (died)'}${inf.city?`, ${inf.city}`:''}`:'Empty slot';
    s.append(row(`${here?'\u25b6 ':''}Slot ${i}`,sub,here?'In use':(inf?'Load':'New life'),()=>{
      if(here)return;
      if(inf)choiceModal(`Load slot ${i}?`,`This saves ${S.name} in slot ${curSlot} first, then opens ${inf.name}.`,[

        ['Cancel',()=>{}]]);
      else choiceModal(`Start a life in slot ${i}?`,`This saves ${S.name} in slot ${curSlot} first, then begins a brand new life in slot ${i}.`,[
        ['Start a new life',()=>{save();useSlot(i);META=blankMeta();undoSnap=null;Q=[];closeSheet();startNew();}],
        ['Cancel',()=>{}]]);
    }));
  }
  s.append(h('h4',{},'Erase a slot'));
  let anyErase=false;
  for(let i=1;i<=NSLOTS;i++){const inf=slotInfo(i);if(!inf||i===curSlot)continue;anyErase=true;
    s.append(row(`\ud83d\uddd1\ufe0f Slot ${i}: ${inf.name}`,`Age ${inf.age}. This cannot be undone`,'',()=>choiceModal('Erase this slot?',`${inf.name} and everything in slot ${i} will be deleted for good.`,[
      ['Erase it',()=>{lsDel(kSlot(i));if(curSheet)drawSheet();}],['Cancel',()=>{}]])));}

function exportModal(){
  const code=backupCode();
  const ta=h('textarea',{rows:5,readOnly:true,style:'width:100%;font-size:.65rem;line-height:1.3;border-radius:10px;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)'});
  ta.value=code;
  const msg=h('p',{className:'sub'},`About ${Math.max(1,Math.round(code.length/1024))} KB of text. Keep it somewhere safe, like a notes app or an email to yourself.`);
  const btn=h('button',{className:'choice',on:()=>{
    let done=false;
    try{ta.focus();ta.select();ta.setSelectionRange(0,code.length);}catch(e){}
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code);done=true;}}catch(e){}
    if(!done){try{done=document.execCommand('copy')}catch(e){}}
    msg.textContent=done?'Copied. Paste it somewhere safe.':'Copy did not work here. Select the text above and copy it by hand.';
  }},'Copy code');
  choiceModal('Back up this life','Copy the whole code below. You can paste it back into this game later, on any device.',
    [['Done',()=>{}]],h('div',{},ta,btn,msg));
}
function importModal(){
  const ta=h('textarea',{rows:5,placeholder:'Paste your backup code here',style:'width:100%;font-size:.65rem;line-height:1.3;border-radius:10px;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)'});
  choiceModal('Load from a backup','Paste the full code, then choose where to put it. The code starts with ONELIFE1.',[
    ['Load into this slot',()=>doImport(ta.value,curSlot)],
    ['Load into an empty slot',()=>{let t=0;for(let i=1;i<=NSLOTS;i++)if(!slotInfo(i)){t=i;break;}
      if(!t){flash={t:'No empty slot. Erase one first, or load into this slot.',c:'bad'};if(curSheet)drawSheet();return;}
      doImport(ta.value,t);}],
    ['Cancel',()=>{}]],h('div',{},ta));
}
function doImport(raw,slot){
  const txt=String(raw||'').trim();
  const body=txt.indexOf('ONELIFE1:')===0?txt.slice(9):txt;
  const json=b64dec(body);
  let d=null;try{d=JSON.parse(json)}catch(e){}
  if(!d||!d.S||!d.S.name){flash={t:'That backup code could not be read. Copy the whole code and try again.',c:'bad'};if(curSheet)drawSheet();return;}
  save();
  useSlot(slot);
  META=Object.assign(blankMeta(),d.META||{});
  undoSnap=null;Q=[];
  S=migrate(d.S);
  save();closeSheet();render();if(!S.alive)showDeath();
}

const outside=b=>(b.co?b.co.share:0)+(b.inv||0);
const hasBoard=b=>outside(b)>=.01;
const tier=b=>!hasBoard(b)?'sole':b.own>.75?'super':b.own>.5?'control':b.own>=.25?'seat':'minority';
const TIERS={sole:['Sole owner','No board. I decide everything.'],super:['Supermajority (over 75%)','I control the board and can take the company private or sell it without a vote.'],control:['Majority control (over 50%)','I control the board. My motions pass and I can\'t be removed.'],seat:['Board seat (25 to 50%)','I hold board seats, can propose motions, and can block takeovers with enough support.'],minority:['Minority (under 25%)','Little say. The board can remove me if confidence stays low.']};
function govOf(b){if(!hasBoard(b))return null;if(!b.gov)b.gov={conf:60,low:0,dirs:[],capMult:1,acq:0,pill:false,why:[],mine:0};syncBoard(b);return b.gov;}
function dhondt(w,n){const seats=w.map(()=>0);for(let k=0;k<n;k++){let bi=0,bv=-1;w.forEach((x,i)=>{const v=x/(seats[i]+1);if(v>bv){bv=v;bi=i;}});seats[bi]++;}return seats;}
function seatPlan(b){const n=b.pub?7:5,me=b.own,co=b.co?b.co.share:0,inv=b.inv||0;let m,c,i,ind;
  if(me>.5){m=Math.floor(n/2)+1;const rest=n-m;ind=b.pub&&rest>=2?1:0;[c,i]=dhondt([co,inv],rest-ind);}
  else{ind=1;[m,c,i]=dhondt([me,co,inv],n-1);}
  if(b.gov&&b.gov.mine>m){const extra=Math.min(b.gov.mine-m,c+i+ind);m+=extra;let e=extra;const t=Math.min(e,ind);ind-=t;e-=t;const ti=Math.min(e,i);i-=ti;e-=ti;c-=e;}
  return {me:m,co:c,inv:i,ind};}
function mkDir(bloc,b){const nm=bloc==='co'&&b.co?b.co.name:fullName(pick(['M','F']));const T={me:[70,95,20,50,30,70,10,40],co:[40,80,20,60,30,70,30,60],inv:[20,55,50,90,30,70,40,70],ind:[30,55,30,60,20,60,70,95]}[bloc];
  return {id:uid(),name:nm,bloc,loyal:R(T[0],T[1]),greed:R(T[2],T[3]),risk:R(T[4],T[5]),indep:R(T[6],T[7])};}
function syncBoard(b){const g=b.gov,plan=seatPlan(b);['me','co','inv','ind'].forEach(k=>{let cur=g.dirs.filter(d=>d.bloc===k);while(cur.length>plan[k]){const d=cur.pop();g.dirs=g.dirs.filter(x=>x!==d);}while(cur.length<plan[k]){const d=mkDir(k,b);g.dirs.push(d);cur.push(d);}});
  const cp=b.co&&S.rels.find(r=>r.id===b.co.pid);g.dirs.filter(d=>d.bloc==='co').forEach(d=>{if(cp)d.loyal=clamp(cp.rel);});}
const BLOCN={me:'My nominee',co:'Co-founder',inv:'Investor director',ind:'Independent'};
function dirYes(b,d,m){const g=b.gov,c=g.conf;let p={me:.92,co:.1+d.loyal/100*.8,inv:.3+(c-50)/100,ind:.35+(c-50)/80}[d.bloc];
  if(d.bloc!=='me')p+=(d.loyal-50)/300;
  if(m==='reinstate'&&d.bloc!=='me')p+=(c-50)/100;if(m==='pay')p-=d.greed/250;if(m==='buyback')p+=d.greed/250;if(m==='divup')p+=d.greed/200;if(m==='divdown')p-=d.greed/200;
  if(m==='acq'||m==='expand')p+=(d.risk-50)/150+(b.lastPre>0?.1:-.15);if(m==='sale')p+=d.greed/250-d.loyal/400+(b.lastPre<0?.15:0);if(m==='pill')p+=(d.loyal-50)/200-d.indep/400;if(m==='remove')p=d.bloc==='me'?.05:(1-d.loyal/100)*.9+(25-c)/100;
  return Math.max(.03,Math.min(.97,p));}
function boardVote(b,m){const g=govOf(b);if(!g)return {pass:true,auto:true,yes:0,no:0,votes:[]};const auto=['control','super'].includes(tier(b))&&m!=='remove';
  const votes=g.dirs.map(d=>({d,y:auto&&d.bloc==='me'?true:rnd()<dirYes(b,d,m)}));const yes=votes.filter(v=>v.y).length;
  return {pass:auto||yes>g.dirs.length/2,auto,yes,no:g.dirs.length-yes,votes};}
const capMult=b=>['control','super','sole'].includes(tier(b))?2:(b.gov&&b.gov.capMult)||1;
const canExpand=b=>['sole','control','super'].includes(tier(b))||(b.gov&&b.gov.exp>0);
const saleOffer=b=>{if(!b.saleOff||b.saleOff.age!==S.age)b.saleOff={age:S.age,v:Math.round(Math.max(bizVal(b),BIZ[b.type].cost*.3*b.locs)*R(105,135)/100/1000)*1000};return b.saleOff.v;};

const divPol=b=>b.divPol||0;
function govYear(b,pre,net,paidDiv){const g=govOf(b);if(!g)return;const why=[];let d=0;
  if(b.yrs>1){const gr=(b.lastPre-b.prevPre)/Math.max(50000,Math.abs(b.prevPre));const x=Math.max(-8,Math.min(8,gr*10));if(Math.abs(x)>=1){d+=x;why.push(`${x>0?'+':''}${Math.round(x)} profit ${x>0?'grew':'fell'}`);}
    const rg=b.prevRev?(b.lastRev-b.prevRev)/Math.max(1,b.prevRev):0,y=Math.max(-4,Math.min(4,rg*20));if(Math.abs(y)>=1){d+=y;why.push(`${y>0?'+':''}${Math.round(y)} sales ${y>0?'grew':'fell'}`);}}
  const r=Math.max(-4,Math.min(4,(b.rep-60)/5));if(Math.abs(r)>=1){d+=r;why.push(`${r>0?'+':''}${Math.round(r)} reputation`);}
  if(b.lastPre<0){d-=6;why.push('-6 a loss year');}
  if(b.prevRep!=null&&b.prevRep-b.rep>=10){d-=8;why.push('-8 scandal or bad press');}
  if((b.overpaid||0)>0){d-=5;why.push('-5 my pay is above market');}
  if(paidDiv>0){const gr=g.dirs.reduce((a,x)=>a+x.greed,0)/Math.max(1,g.dirs.length);const x=2+(gr>60?1:0);d+=x;why.push(`+${x} dividends paid`);}
  if(b.pub&&b.pub.chg!=null){const x=Math.max(-5,Math.min(5,b.pub.chg/10));if(Math.abs(x)>=1){d+=x;why.push(`${x>0?'+':''}${Math.round(x)} share price`);}}
  d+=(55-g.conf)*.05;g.conf=clamp(Math.round(g.conf+d));g.why=why;if(g.acq>0)g.acq--;if(g.exp>0)g.exp--;shareholderMotion(b,g);
  g.low=g.conf<25?g.low+1:0;
  if(g.conf<40&&!b.ousted&&b.own<=.5)line(`⚠️ Board confidence at ${b.name} is down to ${g.conf}%. If it stays under 25% for 2 years, they may vote me out.`,'bad');
  if(!b.ousted&&b.own<=.5&&g.low>=2){const v=boardVote(b,'remove');g.low=0;if(v.pass){b.ousted=true;b.life='absent';line(`🪑 The board of ${b.name} voted ${v.yes} to ${v.no} to remove me as CEO. I still own my shares and can fight back through a shareholder vote.`,'bad');mile(`Ousted as CEO of ${b.name}`);}else line(`🪑 The board of ${b.name} voted on removing me. I survived, ${v.no} to ${v.yes}.`,'good');}
  if(b.ousted&&b.own>.5){b.ousted=false;b.life='delegate';line(`As majority owner of ${b.name}, I appointed myself CEO again.`,'good');}}

function shareholderMotion(b,g){const others=(b.inv||0)+(b.co?b.co.share:0);if(others<.1||b.pub&&rnd()<.5||rnd()>.4)return;
  const M=[];
  if(b.lastPre>0&&divPol(b)<75)M.push(['div',`raise the dividend to ${Math.min(75,divPol(b)+25)}%`,.65]);
  if(b.lastPre<0)M.push(['cut','cut costs hard: lay off staff and freeze spending',.6]);
  if(b.yrs>=3)M.push(['sell',`sell the company to a buyer offering ${fmt(saleOffer(b))}`,b.lastPre<0?.65:.45]);
  if(b.ceo&&b.lastPre<0)M.push(['ceo',`fire the CEO, ${b.ceo.name}`,.6]);
  if(!M.length)return;const [k,txt,lean]=pick(M);
  const vote=myYes=>{const oy=others*(rnd()<lean?1:0);const yes=(myYes?b.own:0)+oy,pass=yes>(b.own+others)/2;
    const tally=`${Math.round(yes/(b.own+others)*100)}% voted for.`;
    if(!pass)return `The motion failed. ${tally}`;
    if(k==='div'){b.divPol=Math.min(75,divPol(b)+25);return `It passed. ${tally} Dividend policy is now ${b.divPol}%.`;}
    if(k==='cut'){const n=Math.max(1,Math.round(b.staff*.2));b.staff=Math.max(1,b.staff-n);b.morale=Math.max(0,(b.morale||60)-15);b.mkt=0;return `It passed. ${tally} ${n} staff were laid off and spending was frozen. Morale fell.`;}
    if(k==='ceo'){b.ceo=null;return `It passed. ${tally} The CEO was fired, so ${b.name} needs a new one.`;}
    if(k==='sell'){bizView=null;return `It passed. ${tally} `+sellBiz(b,Math.round(saleOffer(b)*b.own));}};
  Q.push({own:true,text:`🗳️ Shareholders of ${b.name} put a motion to a vote: ${txt}. I hold ${Math.round(b.own*100)}% of the votes${b.own>.5?', enough to decide it':others>.5?'. They hold a majority, so it will likely pass whatever I vote':''}.`,
    ch:[['Vote for',()=>vote(true)],['Vote against',()=>vote(false)]]});}
function payDividend(b,net){const pct=divPol(b);if(!pct||net<=0||b.cash<=0)return 0;const pay=Math.round(Math.min(b.cash,net*pct/100));if(pay<=0)return 0;
  b.cash-=pay;cfAdd(b,'owner',-pay);const mine=Math.round(pay*b.own*(1-divTax()));S.money+=mine;line(`💸 ${b.name} paid ${fmt(pay)} in dividends. My share was ${fmt(mine)} after ${Math.round(divTax()*100)}% tax.`);return pay;}

function govBlock(s,b,ro){const t=tier(b),g=govOf(b),co=b.co?b.co.share:0;
  s.append(h('h4',{},'🏛️ Ownership and control'),h('p',{className:'sub'},`Voting power: me ${(b.own*100).toFixed(1)}%${co?`, ${fname(b.co.name)} ${(co*100).toFixed(1)}%`:''}${b.inv>0?`, ${b.pub?'investors and public':'investors'} ${(b.inv*100).toFixed(1)}%`:''}. One share, one vote.`),

function motionPicker(b){const g=govOf(b),t=tier(b),M=[];
  if(b.ousted)M.push(['reinstate','Reinstate me as CEO']);

function runMotion(b,k,label){const g=govOf(b);S.used['bm'+b.id]=true;spend(1);const v=boardVote(b,k);let res='';
  if(v.pass){if(k==='reinstate'){b.ousted=false;b.life='delegate';res='I\'m CEO again.';}
    if(k==='pay'){g.capMult=Math.min(2,(g.capMult||1)+.5);res=`My pay cap is now ${Math.round(g.capMult*100)}% of normal.`;}
    if(k==='buyback'){const f=Math.min(.1,b.inv*.5,Math.max(0,b.cash)/Math.max(1,bizVal(b)));if(f<=.001)res='But the company had no spare cash for it.';else{const cost=Math.round(bizVal(b)*f);b.cash-=cost;const keep=1-f;b.own/=keep;if(b.co)b.co.share/=keep;b.inv=(b.inv-f)/keep;b.pub.sent=Math.min(3,b.pub.sent*(1+f*1.5));res=`${b.name} bought back ${(f*100).toFixed(1)}% of its shares for ${fmt(cost)}. My stake rose to ${(b.own*100).toFixed(1)}%.`;}}
    if(k==='divup'){b.divPol=Math.min(75,divPol(b)+25);res=`Dividend policy is now ${b.divPol}%.`;}if(k==='divdown'){b.divPol=Math.max(0,divPol(b)-25);res=`Dividend policy is now ${b.divPol}%.`;}
    if(k==='acq'){g.acq=2;res='I can now merge acquisitions into this business for 2 years.';}if(k==='expand'){g.exp=2;res='I can open new outlets and cities for 2 years.';}if(k==='sale'){bizView=null;const p=Math.round(saleOffer(b)*b.own);res=sellBiz(b,p)+' Every shareholder was bought out at the same price.';}if(k==='pill'){g.pill=true;res='Takeover raids are now much harder.';}}
  const tally=v.auto?'Passed by my majority control.':`Vote: ${v.yes} for, ${v.no} against. `+v.votes.map(x=>`${x.d.name} ${x.y?'✅':'❌'}`).join(', ')+'.';
  g.conf=clamp(g.conf+(v.pass?0:-2));stay(`🗳️ "${label}": ${v.pass?'passed':'failed'}. ${tally} ${res}`,v.pass?'good':'bad');}
function agmVote(b){S.used['agm'+b.id]=true;spend(1);const g=govOf(b),co=b.co?b.co.share:0,cp=b.co&&S.rels.find(r=>r.id===b.co.pid);
  const turnout=b.pub?.6:1,inv=(b.inv||0)*turnout,invYes=inv*Math.max(.05,Math.min(.9,(g.conf/100)*.9+(S.fame||0)/400)),coYes=co&&rnd()<(cp?cp.rel/100:.5)?co:0;

function startLoanMax(capital){

function bizLoanMax(b){

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EFF6; --card:#FFFFFF; --ink:#1B2540; --muted:#5B6782; --line:#D3DCE8;
  --sun:#F2B705; --sunInk:#3A2A00; --happy:#E0507A; --health:#2E9E6A; --smarts:#3A6FD8; --looks:#9255C9;
  --bad:#C8372D; --good:#23845A; --ai:#7A5AF8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#111726; --card:#1A2236; --ink:#E7ECF5; --muted:#95A2BC; --line:#2A3551; --bad:#F06B60; --good:#4CC98E; --ai:#A78BFA; }
}
:root[data-theme="dark"]{ --paper:#111726; --card:#1A2236; --ink:#E7ECF5; --muted:#95A2BC; --line:#2A3551; --bad:#F06B60; --good:#4CC98E; --ai:#A78BFA; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--smarts);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{padding:12px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who{min-width:0}
.who h1{font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:1.4rem;margin:0;line-height:1.1}
.who p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:.75rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.side{display:flex;align-items:flex-start;gap:8px}
.cash{text-align:right}
.cash b{font-family:Fredoka,system-ui,sans-serif;font-size:1.2rem;display:block}
.cash span{color:var(--muted);font-size:.8rem;display:block}
.energy{font-size:.8rem;color:var(--muted);letter-spacing:1px;margin-top:2px}
.menu{background:var(--card);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;font-size:1.1rem}
.logwrap{flex:1;position:relative;min-height:0}
.log{height:100%;overflow-y:auto;padding:4px 18px 56px}
.yr{margin:0 0 14px}
.yr h2{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:.95rem;margin:0 0 4px;color:var(--smarts)}
.yr p{margin:0 0 3px;line-height:1.45}
.good{color:var(--good)} .bad{color:var(--bad)} .ai{color:var(--ai)}
.skip{position:absolute;right:14px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.85rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.skip:disabled{opacity:.5}
.stats{padding:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;background:var(--card);border-top:1px solid var(--line);position:relative}
.stat{display:grid;grid-template-columns:5.2em 1fr 2.2em;align-items:center;gap:8px;font-size:.82rem}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s ease}
.stat em{font-style:normal;text-align:right;color:var(--muted)}
#pops{position:absolute;left:0;right:0;bottom:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px 8px;pointer-events:none}
.pop{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);animation:pop 1.8s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
nav{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;align-items:end;background:var(--card);padding:6px 8px 10px;border-top:1px solid var(--line)}
nav button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
nav button .ic{font-size:1.35rem;line-height:1}
.age{justify-self:center;width:76px;height:76px;margin-top:-34px;border-radius:50%;background:var(--sun);color:var(--sunInk)!important;border:5px solid var(--card)!important;box-shadow:0 4px 0 #C99400;font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:1rem!important;justify-content:center}
.age:active{transform:translateY(3px);box-shadow:0 1px 0 #C99400}
.age .plus{font-size:1.5rem;line-height:.9}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
#modalWrap{z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:Fredoka,system-ui,sans-serif;font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.9rem;line-height:1.4}
.sheet h4{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:1rem;margin:18px 0 8px;color:var(--muted)}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--paper);border:0;border-radius:14px;padding:12px 14px;margin:0 0 8px}
.row:disabled{opacity:.45;cursor:default}
.row b{display:block;font-weight:700}
.row small{color:var(--muted);display:block}
.row .r{font-family:Fredoka,system-ui,sans-serif;white-space:nowrap;text-align:right}
.row .r small{font-family:Nunito,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .row{flex-direction:column;align-items:flex-start;margin:0;min-height:74px;gap:2px}
.close{margin-top:10px;width:100%;background:none;border:2px solid var(--line);border-radius:14px;padding:10px}
.back{background:none;border:0;color:var(--smarts);padding:0;margin:0 0 8px;font-weight:700}
.relbar{height:6px;width:70px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.relbar i{display:block;height:100%;background:var(--happy)}
.modal{align-items:center}
.modal .sheet{border-radius:22px;margin:0 14px calc(18px + env(safe-area-inset-bottom,0px))}
.event-text{font-size:1.1rem;line-height:1.5;margin:0 0 16px}
.choice{width:100%;background:var(--sun);color:var(--sunInk);border:0;border-radius:14px;padding:12px;margin:0 0 8px;font-weight:700}
.choice.alt{background:var(--paper);color:var(--ink)}
.choice.trait{background:var(--paper);color:var(--ink);border:2px dashed var(--looks)}
.choice:disabled{opacity:.4;cursor:default}
.ribbon{display:inline-block;background:var(--sun);color:var(--sunInk);font-family:Fredoka,system-ui,sans-serif;font-weight:700;padding:8px 18px;border-radius:999px;margin:6px 0 14px}
.obit{font-family:Georgia,"Times New Roman",serif;font-size:1rem;line-height:1.6;margin:0 0 14px;white-space:pre-wrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px}
dt{color:var(--muted)} dd{margin:0;font-weight:700;text-align:right}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.slider{width:100%;accent-color:var(--sun);margin:6px 0 10px;height:32px}
.amt{width:100%;font:inherit;font-size:1.15rem;font-weight:700;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:0 0 10px}
.tabs button{flex:0 0 auto;border:0;background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{font-size:.82rem;color:var(--muted);margin:0 0 4px;font-weight:700}
.flash{background:var(--paper);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.92rem;line-height:1.4}
.econ{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--paper);font-weight:700;font-size:.85rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.btns .row{margin:0;justify-content:center;text-align:center;font-weight:700}
.chart{width:100%;height:auto;display:block;margin:0 0 14px}
.chart text{font-size:10px;fill:var(--muted);font-family:Nunito,system-ui,sans-serif}
.review li{margin:0 0 4px;line-height:1.4}
.review ul{padding-left:20px;margin:0 0 14px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--card);border-radius:14px;padding:10px 14px;font-weight:700;font-size:.92rem;animation:toast 3.2s ease forwards;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle .sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:var(--paper);border-radius:12px;padding:10px;font-size:.85rem}
.ach b{display:block;font-size:.9rem}
.ach.locked{opacity:.45}
.warn{color:var(--bad);font-weight:700}
@media (prefers-reduced-motion: reduce){ .bar i,.toggle .sw::after{transition:none} .pop,.toast{animation-duration:.01s;animation-delay:1.5s} }
</style>
</head>

let S=null,Q=[],META={ach:{},tree:[],sound:true,ai:false};
function save(){try{localStorage.setItem('onelife-save-v3',JSON.stringify(S))}catch(e){}}
function load(){try{const v=localStorage.getItem('onelife-save-v3');return v?JSON.parse(v):null}catch(e){return null}}
function saveMeta(){try{localStorage.setItem('onelife-meta',JSON.stringify(META))}catch(e){}}
function loadMeta(){try{const v=localStorage.getItem('onelife-meta');if(v)META=Object.assign(META,JSON.parse(v))}catch(e){}}
function person(type,gender,age,last,name){return {id:uid(),type,gender,name:name||(first(gender)+' '+last),age,rel:R(55,90),alive:true};}
function addYear(){S.log.push({age:S.age,lines:[]});if(S.log.length>50)S.log.shift();}
function line(t,c=''){if(!t)return;S.log[S.log.length-1].lines.push({t,c});}
function mile(t){S.miles.push({age:S.age,t});}
const has=k=>S&&S.traits.includes(k);
const mem=k=>S.mem[k];
function remember(k,o={}){S.mem[k]=Object.assign({at:S.age},o);}
function norm(){for(const k in S.st)S.st[k]=clamp(S.st[k]);S.rels.forEach(p=>p.rel=clamp(p.rel));if(S.job)S.job.perf=clamp(S.job.perf);S.biz.forEach(b=>b.rep=clamp(b.rep));}
const living=t=>S.rels.filter(p=>p.alive&&(!t||t.includes(p.type)));
const partner=()=>living(['Partner','Spouse'])[0];
const spouse=()=>living(['Spouse'])[0];
const kids=()=>S.rels.filter(p=>p.type==='Child');
const hasCar=()=>S.assets.some(a=>a.k==='car');
const homes=()=>S.assets.filter(a=>a.k==='home');
const lastName=()=>S.name.split(' ').slice(1).join(' ');
const badCredit=()=>S.flags.badCreditUntil&&S.age<S.flags.badCreditUntil;
const price=s=>S.mkt[s].p;
const investVal=()=>TICK.reduce((a,t)=>a+(S.hold[t.s]||0)*price(t.s),0);
const saleVal=a=>Math.round(a.k==='home'?a.v*.94:a.v);
const propEquity=()=>S.assets.reduce((a,x)=>a+saleVal(x)-(x.mort?x.mort.bal:0),0);
const angelVal=()=>S.angels.reduce((a,x)=>a+x.amt,0);
const netWorth=()=>Math.round(S.money-S.sloan+investVal()+S.ret.bal+propEquity()+stakeVal()+angelVal());
const canManage=()=>S.alive&&S.age>=18&&!S.jail;
function initMkt(){const m={};TICK.forEach(t=>m[t.s]={p:t.start,chg:0});return m;}
function energyMax(){if(S.age<6)return 2;if(S.age<12)return 3;let e=5;if(has('athletic'))e++;if(has('lazy'))e--;if(S.age>=75)e--;
  if(S.job&&S.job.style==='hustle')e--;if(S.job&&S.job.style==='slack')e++;e-=S.biz.filter(b=>b.life==='hands').length;return Math.max(1,e);}
const energyLeft=()=>Math.max(0,energyMax()-S.eUsed);
const spend=n=>{S.eUsed+=n;};
const livingCost=()=>{let c=homes().some(a=>!a.rent)?5000:11000;if(S.edu.major)c=Math.min(c,6000);if(has('frugal'))c*=.7;if(has('spender'))c*=1.3;return Math.round(c);};
const joy=n=>Math.round(n*(has('spender')?2:has('frugal')?.5:1));
const relGain=n=>Math.round(n*(has('charming')?1.5:1));

function newLife(o={}){
  const g=o.gender||pick(['M','F']);const last=o.last||pick(LAST);
  const traits=rollTraits(o.inherit);
  S={v:4,id:uid(),dyn:o.dyn||uid(),name:o.name||first(g)+' '+last,gender:g,city:o.city||pick(CITIES),age:o.age||0,alive:true,traits,
    st:{happy:R(45,100),health:R(65,100),smarts:R(10,100),looks:R(10,100)},money:o.money||0,sloan:0,eUsed:0,
    log:[],job:null,edu:{major:null,yrs:0,degrees:[]},rels:[],assets:o.assets||[],jail:0,gen:o.gen||1,
    used:{},flags:{crimes:0,jailYears:0,exes:0,record:false,hs:(o.age||0)>=18?true:undefined},retired:false,pension:0,cause:null,
    hold:{},basis:{},mkt:o.mkt||initMkt(),econ:o.econ||{phase:'normal',yrs:0},homeIdx:o.homeIdx||1,
    biz:o.biz||[],ret:{bal:0,pct:0},angels:[],gig:null,peak:0,fame:0,rivals:o.rivals||[],forSale:[],mentees:[],trend:o.trend||null,regs:o.regs||{wage:1,foodTax:0,tax:.2,deliv:.15,zoning:1},supIdx:o.supIdx||1,holding:null,exes:[],chal:o.chal||null,mem:{},seen:{},miles:[],nwHist:[],talent:null,aiNext:null,tip:null,careers:[]};
  if(o.addTrait&&!S.traits.includes(o.addTrait)){S.traits[S.traits.length-1]=o.addTrait;if(o.addTrait==='hustler')S.traits=S.traits.filter(t=>t!=='lazy'||t==='hustler');}
  if(has('genius'))S.st.smarts=R(70,100);if(has('athletic'))S.st.health=R(85,100);if(has('charming'))S.st.looks=Math.min(100,S.st.looks+15);
  S.biz.forEach(b=>{if(b.life==='hands')b.life='delegate';b.gens=(b.gens||1)+(o.gen?1:0);});
  if(o.parents)S.rels.push(...o.parents);else{
    S.rels.push(person('Mother','F',R(20,40),last));S.rels.push(person('Father','M',R(22,45),last));
    if(Math.random()<.5)S.rels.push(person('Sibling',pick(['M','F']),R(1,8),last));}
  if(o.siblings)S.rels.push(...o.siblings);
  if(o.start){S.rels.forEach(p=>p.age+=S.age);S.flags.hs=true;S.edu.degrees=o.degrees||[];if(o.poor)S.flags.poor=true;
    (o.bizTypes||[]).forEach(t=>{const T=BIZ[t];S.biz.push(newBiz(t,pick(T.names)));S.flags.founded=(S.flags.founded||0)+1;});}
  addYear();
  const tr=S.traits.map(k=>TRAITS[k].n.toLowerCase()).join(', ');
  if(o.gen){line(`I am ${S.name}, age ${S.age}, generation ${S.gen} of this family. People say I'm ${tr}.`);
    if(o.money>0)line(`I inherited ${fmt(o.money)} in cash after estate taxes.`,'good');
    if(S.assets.length)line(`I also inherited: ${S.assets.map(a=>a.n).join(', ')}.`,'good');
    if(S.biz.length)line(`The family business passed to me: ${S.biz.map(b=>b.name).join(', ')}.${S.age<18?' A trustee will run things until I turn 18.':''}`,'good');}
  else if(o.start){line(`${o.chal?`🎯 Challenge: ${CHAL[o.chal].n}. `:'🏙️ Tycoon mode. '}I'm ${S.name}, ${S.age}, in ${S.city}, with ${fmt(S.money)}${S.biz.length?` and a ${BIZ[S.biz[0].type].n.toLowerCase()} called ${S.biz[0].name}`:''}. People say I'm ${tr}.`);if(o.chal)line(CHAL[o.chal].d);}
  else{const m=S.rels[0],f=S.rels[1];line(`I was born a ${g==='M'?'boy':'girl'} in ${S.city}. The nurses say I seem ${tr}.`);line(`My mother is ${m.name} (${m.age}) and my father is ${f.name} (${f.age}).`);
    const sib=living(['Sibling'])[0];if(sib)line(`I have a ${sib.gender==='M'?'brother':'sister'}, ${fname(sib.name)}, who is ${sib.age}.`);}
  Q=[];prevSnap=null;save();render();
}

{id:'trip',rep:1,min:22,max:75,cond:partner,text:'My partner wants to go on a trip together.',ch:[
  ['Plan something ($2,000)',()=>{S.money-=2000;partner().rel+=relGain(15);S.st.happy+=joy(8);return 'We had an amazing week away.'}],['Stay home',()=>{partner().rel-=8;return 'They were disappointed.'}]]},
{id:'cousin',min:22,max:80,cond:()=>S.money>5000,text:'My cousin asked to borrow $2,000.',ch:[
  ['Lend it',()=>{if(Math.random()<.5)return 'They paid me back a few months later.';S.money-=2000;remember('cousin');return 'I never saw that money again.'}],
  ['Refuse',()=>'I said no. Family dinner was awkward.']]},
{id:'cousin2',pri:1,min:25,max:99,cond:()=>mem('cousin')&&S.age>=mem('cousin').at+6,cls:'good',auto:()=>{S.money+=6000;return 'Out of nowhere, my cousin hit it big in Vegas and paid back that old $2,000 loan... as $6,000.'}},
{id:'cat',min:5,max:100,text:'A stray cat followed me home.',ch:[
  ['Adopt it',()=>{S.rels.push({id:uid(),type:'Pet',gender:'F',name:pick(PETS)+' the cat',age:R(1,4),rel:80,alive:true});S.st.happy+=8;return 'I adopted the cat. It now owns me.'}],['Shoo it away',()=>'It gave me a judgmental look and wandered off.']]},
{id:'wallet',min:8,max:90,init:()=>({n:first(pick(['M','F']))+' '+pick(LAST)}),text:c=>`I found a wallet on the sidewalk with $200 inside. The ID says ${c.n}.`,ch:[
  ['Keep the cash',c=>{S.money+=200;remember('wallet',{name:c.n,kept:true});return 'I pocketed the $200.'}],
  ['Return it',c=>{S.money+=20;S.st.happy+=has('kind')?10:6;remember('wallet',{name:c.n});return 'The owner was so grateful they gave me $20.'}]]},
{id:'checkup',rep:1,min:55,max:110,text:'My doctor recommended a full checkup.',ch:[['Go ($300)',()=>{S.money-=300;S.st.health+=8;return 'They caught a small issue early.'}],['Skip it',()=>{S.st.health-=3;return 'I skipped it.'}]]},
{id:'hip',min:50,max:110,cls:'bad',auto:()=>{S.st.health-=R(5,15);return 'I slipped on ice and hurt my hip.'}},
{id:'phoneapp',min:65,max:100,text:'My grandkid is trying to teach me a new phone app.',ch:[['Learn it',()=>{S.st.smarts+=2;S.st.happy+=3;return 'I now send everyone way too many stickers.'}],['Absolutely not',()=>'I told them phones were for calling people.']]},
{id:'midlife',min:40,max:50,text:'Midlife crisis! I suddenly feel like I need to...',ch:[
  ['Buy a sports car ($115,000)',()=>{S.money-=115000;S.assets.push({n:'Sports coupe',v:115000,k:'car'});S.st.happy+=joy(15);return 'I bought a red sports coupe. I feel 25 again.'},()=>S.money<115000],
  ['Take up surfing',()=>{S.st.health+=6;S.st.happy+=6;return 'I wiped out a lot. Then I caught one wave. Worth it.'}],
  ['Get a dramatic haircut',()=>{S.st.looks+=R(-8,10);S.st.happy+=4;return 'Bold choice. People have opinions.'}],
  ['Quit everything and travel ($10,000)',()=>{S.money-=10000;S.st.happy+=15;if(S.job){const t=title(S.job);S.job=null;return `I quit my job as a ${t} and backpacked across three continents.`}return 'I backpacked across three continents.'},null,'reckless']]},
{id:'grandkid',rep:1,min:45,max:100,w:.6,cond:()=>kids().some(k=>k.alive&&k.age>=25&&k.age<=40),init:()=>({k:pick(kids().filter(k=>k.alive&&k.age>=25&&k.age<=40))}),cls:'good',auto:c=>{S.st.happy+=12;mile('Became a grandparent');return `My child ${fname(c.k.name)} had a baby. I'm a grandparent!`}},
/* ---- neighbor storyline ---- */
{id:'neighbor',min:25,max:70,cond:()=>homes().some(a=>!a.rent),init:()=>({n:first(pick(['M','F']))}),text:c=>`My new neighbor ${c.n} complained that my music is too loud.`,ch:[
  ['Apologize',c=>{remember('neighbor',{n:c.n,good:true});return `I apologized and brought ${c.n} cookies.`}],
  ['Ignore it',c=>{remember('neighbor',{n:c.n});return 'I kept the volume where it was.'}],
  ['Turn it up',c=>{remember('neighbor',{n:c.n,war:true});S.st.happy+=5;return 'I turned it up. It felt amazing.'},null,'hothead']]},
{id:'neighbor2',pri:1,min:27,max:99,cond:()=>mem('neighbor')&&S.age>=mem('neighbor').at+2,init:()=>mem('neighbor'),
  text:c=>c.good?`${c.n}, the neighbor I apologized to, turns out to be a retired stockbroker. Over coffee they whispered: "Nimbus Tech. Trust me."`:`My feud with ${c.n} next door escalated. They're suing me over a "property line issue".`,
  ch:c=>c.good?[['Thank them',()=>{S.tip='NMBS';remember('tipNMBS');return 'I made a note. Maybe I should buy some Nimbus Tech.'}]]:[
    ['Fight it in court ($5,000)',()=>{S.money-=5000;if(Math.random()<(c.war?.35:.5))return 'I won! The fence stays where it is.';const d=R(10000,40000);S.money-=d;return `I lost and paid ${fmt(d)} in damages.`}],
    ['Settle for $8,000',()=>{S.money-=8000;return `I paid ${c.n} to go away. We still don't wave.`}]]},
/* ---- sibling storyline ---- */
{id:'sib',min:25,max:60,cond:()=>sibling()&&S.money>=15000,init:()=>({p:sibling()}),text:c=>`My ${c.p.gender==='M'?'brother':'sister'} ${fname(c.p.name)} is drowning in debt and asked me for $15,000.`,ch:[
  ['Lend it',c=>{S.money-=15000;remember('sib',{id:c.p.id,how:'lent'});c.p.rel+=10;return 'I lent them the money and made them promise to pay it back.'}],
  ['Refuse',c=>{remember('sib',{id:c.p.id,how:'refused'});c.p.rel-=25;return 'I said no. They hung up on me.'}],
  ['Give it as a gift',c=>{S.money-=15000;remember('sib',{id:c.p.id,how:'gift'});c.p.rel+=30;S.st.happy+=6;return 'I told them it was a gift, no strings attached. They cried.'},null,'kind']]},
{id:'sib2',pri:1,min:28,max:99,cond:()=>mem('sib')&&S.age>=mem('sib').at+3&&S.rels.some(p=>p.id===mem('sib').id&&p.alive),init:()=>({m:mem('sib'),p:S.rels.find(p=>p.id===mem('sib').id)}),
  text:c=>c.m.how==='refused'?`${fname(c.p.name)} and I haven't talked in years. They just texted: "can we talk?"`:c.m.how==='gift'?`${fname(c.p.name)} used my gift to start a bakery. It's doing great.`:`${fname(c.p.name)} called about the $15,000 I lent them.`,
  ch:c=>c.m.how==='refused'?[['Reconnect',()=>{c.p.rel+=35;S.st.happy+=8;return 'We talked for three hours. It felt like old times.'}],['Leave it on read',()=>{c.p.rel-=10;return 'I left it on read.'}]]
   :c.m.how==='gift'?[['Visit the bakery',()=>{S.money+=5000;S.st.happy+=8;c.p.rel+=10;return 'They handed me $5,000 and a lifetime supply of croissants.'}]]
   :Math.random()<.6?[['Answer',()=>{S.money+=20000;c.p.rel+=15;return 'They paid me back $20,000, with interest, and a hug.'}]]
   :[['Answer',()=>{c.p.rel-=15;S.st.happy-=6;return 'They lost it all again and asked for more. I said no this time.'}]]},
/* ---- marriage storyline ---- */
{id:'marr',rep:1,min:22,max:90,w:2,cond:()=>spouse()&&spouse().rel<45&&!mem('marr'),init:()=>({p:spouse()}),text:c=>`${fname(c.p.name)} and I keep fighting about everything.`,ch:[
  ['Couples counseling ($3,000)',c=>{S.money-=3000;c.p.rel+=20;remember('marr',{id:c.p.id});return 'We started counseling. It was awkward and it helped.'}],
  ['Plan a date night',c=>{c.p.rel+=relGain(8);remember('marr',{id:c.p.id});return 'We had a nice dinner. It helped a little.'}],
  ['Ignore it',c=>{c.p.rel-=10;remember('marr',{id:c.p.id});return 'I buried myself in other things.'}]]},
{id:'marr2',pri:1,min:24,max:99,cond:()=>mem('marr')&&S.age>=mem('marr').at+2&&spouse()&&spouse().id===mem('marr').id,init:()=>({p:spouse()}),
  text:c=>c.p.rel>=55?`${fname(c.p.name)} surprised me by asking to renew our vows.`:`${fname(c.p.name)} sat me down and said they want a separation.`,
  ch:c=>{const done=()=>{delete S.mem.marr;};return c.p.rel>=55?[['Say yes',()=>{done();S.money-=5000;S.st.happy+=15;c.p.rel+=10;return 'We renewed our vows on a beach. Everyone cried.'}]]
   :[['Fight for us',()=>{done();if(Math.random()<.5+(has('charming')?.2:0)){c.p.rel+=30;return 'We worked through it. We\'re stronger now.'}return divorce(c.p)}],['Agree to divorce',()=>{done();return divorce(c.p)}]]}},
/* ---- illness storyline ---- */
{id:'ill',min:35,max:80,w:.5,text:"I've felt dizzy and exhausted for weeks.",ch:[
  ['See a specialist ($2,000)',()=>{S.money-=2000;remember('ill',{early:true});return 'I booked tests right away.'}],
  ['Tough it out',()=>{remember('ill',{early:false});return 'I told myself it was just stress.'}]]},
{id:'ill2',pri:1,min:36,max:99,cond:()=>mem('ill')&&!mem('ill').done&&S.age>=mem('ill').at+1,text:()=>mem('ill').early?'The specialist caught a heart condition early. A short treatment should fix it.':'It turned out to be a serious heart condition. Treatment costs $40,000.',
  ch:()=>{const m=mem('ill');m.done=true;return m.early?[['Get treated',()=>{S.st.health+=6;S.money-=3000;return 'Treatment went smoothly. I feel better than I have in years.'}]]
   :[['Pay for treatment',()=>{S.money-=40000;S.st.health+=10;return 'It was expensive and scary, but it worked.'}],['Try a cheaper option ($5,000)',()=>{S.money-=5000;if(Math.random()<.5){S.st.health-=25;return 'It didn\'t work. My health took a serious hit.'}return 'Somehow the cheaper option worked.'}]]}},
/* ---- work ---- */
{id:'credit',rep:1,min:18,max:70,cond:()=>S.job,text:'A coworker took credit for my work in a meeting.',ch:[
  ['Confront them',()=>{if(Math.random()<(has('hothead')?.65:.5)){S.job.perf+=10;return 'I set the record straight and my boss noticed.'}S.job.perf-=8;return 'It turned into a shouting match. My boss was not impressed.'}],
  ['Let it go',()=>{S.st.happy-=5;return 'I let it slide, but it stung.'}]]},
{id:'headhunter',rep:1,min:20,max:65,cond:()=>S.job&&S.job.lvlYrs>=1,text:()=>`A headhunter called. Another company wants me as a ${title(S.job)} for about 18% more pay.`,ch:[
  ['Take the new job',()=>{remember('oldboss',{c:S.job.c});S.job.s=Math.round(S.job.s*1.18);S.job.lvlYrs=0;S.job.perf=50;S.st.happy+=5;return `I switched companies. New salary: ${fmt(S.job.s)}.`}],
  ['Stay where I am',()=>{S.job.perf+=5;return 'I stayed loyal. My boss seemed to appreciate it.'}]]},
{id:'fraud',min:22,max:65,cond:()=>S.job&&S.job.lvl>=1,text:'My boss quietly asked me to help hide some accounting fraud.',ch:[
  ['Go along with it',()=>{const g=R(5000,20000);S.money+=g;remember('fraud');return `I kept quiet and got a ${fmt(g)} "bonus". I sleep a little worse now.`}],
  ['Report it',()=>{if(Math.random()<(has('kind')?.75:.6)){S.job.perf+=25;S.st.happy+=10;remember('whistle');unlock('whistle');mile('Blew the whistle on fraud at work');return 'I blew the whistle. My boss was fired and I was praised.'}const t=title(S.job);S.job=null;S.st.happy-=10;return `I reported it, but leadership retaliated. I lost my job as a ${t}.`}],
  ['Stay out of it',()=>{S.st.happy-=5;return 'I pretended not to hear and felt uneasy about it.'}]]},
{id:'burnout',rep:1,min:18,max:70,cond:()=>S.job&&S.job.style==='hustle',w:2,text:'I feel completely burned out from work.',ch:[
  ['Take time off',()=>{S.job.perf-=10;S.st.happy+=10;S.st.health+=5;return 'I took a few weeks off and recharged.'}],
  ['Push through',()=>{S.st.health-=8;S.st.happy-=8;S.job.perf+=4;return 'I kept grinding, but it took a toll.'}]]},
{id:'romance',min:18,max:60,cond:()=>S.job&&!partner(),text:'A cute coworker keeps flirting with me.',ch:[
  ['Ask them out',()=>{if(Math.random()<.5+S.st.looks/300+(has('charming')?.15:0)){const g=S.gender==='M'?'F':'M';const c=person('Partner',Math.random()<.85?g:S.gender,S.age+R(-4,4),pick(LAST));S.rels.push(c);return `${fname(c.name)} and I started dating!`}S.job.perf-=5;return 'It got awkward. They were not interested.'}],
  ['Keep it professional',()=>'I kept things professional.']]},
{id:'xmasparty',rep:1,min:18,max:70,cond:()=>S.job,text:"It's the company holiday party.",ch:[
  ['Go and have fun',()=>{S.st.happy+=5;if(Math.random()<(has('reckless')?.35:.15)){S.job.perf-=8;return 'I had a few too many and did karaoke on a table in front of the CEO.'}S.job.perf+=3;return 'I had a great time and bonded with coworkers.'}],['Skip it',()=>'I stayed home in pajamas.']]},
{id:'replyall',min:20,max:70,cond:()=>S.job,cls:'bad',auto:()=>{S.job.perf-=12;S.st.happy-=5;return 'I accidentally hit "reply all" on an email complaining about my boss. To 400 people.'}},
{id:'mentor',min:20,max:55,cond:()=>S.job,text:'A senior leader offered to mentor me.',ch:[['Accept',()=>{S.job.perf+=10;S.st.smarts+=3;return 'Our monthly coffees changed how I think about my career.'}],['Politely decline',()=>'I said I was too busy.']]},
{id:'bosskid',min:24,max:65,cond:()=>S.job&&S.job.lvl>=1,text:"My boss's 22-year-old kid was just hired as my manager.",ch:[
  ['Suck it up',()=>{S.st.happy-=6;return 'They scheduled a meeting about meetings. I survived.'}],
  ['Complain to HR',()=>{if(Math.random()<.4){S.job.perf+=5;return 'HR agreed. The kid was moved to a "special projects" role.'}S.job.perf-=10;return 'HR sided with the family. I am now on thin ice.'}],
  ['Quit on the spot',()=>{const t=title(S.job);S.job=null;S.st.happy+=5;return `I quit my job as a ${t}. Dramatic, but satisfying.`}]]},
{id:'acquired',min:22,max:65,cond:()=>S.job&&!CAREERS[S.job.c].pub,auto:()=>{if(Math.random()<.5){const b=R(5000,40000);S.money+=b;return `My company was acquired and my stock options paid out ${fmt(b)}.`}S.job.perf-=5;S.st.happy-=4;return 'My company was acquired. Everyone is nervous about layoffs.'}},
/* ---- callbacks ---- */
{id:'bullyboss',min:25,max:50,w:3,cond:()=>mem('bully')&&S.job&&S.age>=mem('bully').at+12,init:()=>mem('bully'),
  text:c=>c.how==='friend'?`My new manager is ${c.name}, the "bully" I befriended back in grade school. They remembered.`:`My new manager is ${c.name}... the kid who ${c.how==='won'?'I beat in a schoolyard fight':'bullied me'} in school.`,
  ch:c=>c.how==='friend'?[['Hug it out',()=>{S.job.perf+=20;S.st.happy+=10;unlock('forgive');return 'They fast-tracked me for a promotion. Kindness pays.'}]]:[
    ['Bury the hatchet',()=>{if(Math.random()<(has('charming')||has('kind')?.8:.5)){S.job.perf+=10;return 'We laughed about it over lunch. They are actually decent now.'}S.job.perf-=10;return 'They still hold a grudge. My reviews are suddenly worse.'}],
    ['Remind them who won',()=>{S.job.perf-=5;S.st.happy+=10;return 'I mentioned the fight in our first one-on-one. Worth it.'},()=>c.how!=='won','hothead'],
    ['Quit',()=>{const t=title(S.job);S.job=null;return `Nope. I quit my job as a ${t}.`}]]},
{id:'walletback',min:22,max:50,w:3,cond:()=>mem('wallet')&&!mem('wallet').kept&&S.age>=mem('wallet').at+8,init:()=>mem('wallet'),cls:'good',auto:c=>{const g=has('kind')?10000:5000;S.money+=g;return `${c.name}, whose wallet I returned years ago, tracked me down. They run a company now and sent a ${fmt(g)} "late reward".`}},
{id:'walletkarma',min:20,max:60,w:2,cond:()=>mem('wallet')&&mem('wallet').kept&&S.age>=mem('wallet').at+5,cls:'bad',auto:()=>{S.money-=300;return 'Karma: I lost my own wallet with $300 in it. Nobody returned it.'}},
{id:'crush2',min:28,max:45,w:3,cond:()=>mem('crush')&&!partner()&&S.age>=mem('crush').at+10,init:()=>mem('crush'),text:c=>`At a school reunion, I ran into ${c.name}, my old crush. They're single.`,ch:[
  ['Ask them out',c=>{if(Math.random()<(c.never?.5:.8)+(has('charming')?.1:0)){const g=S.gender==='M'?'F':'M';const p={id:uid(),type:'Partner',gender:g,name:c.name,age:S.age,rel:80,alive:true,crush:true};S.rels.push(p);return 'We talked all night. We are dating now!'}return 'They laughed kindly and said they were seeing someone.'}],
  ['Just catch up',()=>'We caught up and swapped numbers.']]},
{id:'smoker2',min:45,max:65,w:3,cond:()=>mem('smoker'),text:'My doctor spotted something worrying on my lung scan. Those teenage cigarettes caught up with me.',ch:[
  ['Follow the treatment ($8,000)',()=>{S.money-=8000;S.st.health+=5;return 'Treatment worked. Past me owes present me an apology.'}],['Ignore it',()=>{S.st.health-=15;return 'I ignored it. My breathing got worse.'}]]},
{id:'blackmail',pri:1,min:25,max:90,cond:()=>mem('fraud')&&S.age>=mem('fraud').at+5,text:'An old coworker knows about the fraud cover-up. They want $25,000 to keep quiet.',ch:[
  ['Pay them',()=>{S.money-=25000;return 'I paid. They promised it was a one-time thing.'}],
  ['Refuse',()=>{if(Math.random()<.5)return 'They were bluffing. Nothing happened.';S.flags.record=true;let out='They went to the press. ';if(S.job){out+=`I was fired as a ${title(S.job)}. `;S.job=null;}if(Math.random()<.4){S.jail=R(1,3);out+=`I was sentenced to ${S.jail} years.`}else{S.money-=15000;out+='I paid $15,000 in fines.'}return out}]]},
{id:'book',pri:1,min:26,max:90,cond:()=>mem('whistle')&&S.age>=mem('whistle').at+4,text:'A publisher wants my whistleblower story. Advance: $80,000.',ch:[
  ['Write the book',()=>{S.money+=80000;S.st.happy+=10;mile('Published a whistleblower memoir');return 'I wrote it. It was a modest bestseller.'}],['Keep it private',()=>'Some stories are better left alone.']]},
{id:'coldcase',pri:1,min:20,max:90,cond:()=>mem('burglary')&&S.age>=mem('burglary').at+4&&!S.jail,text:'Detectives reopened an old burglary case. They have new DNA evidence.',ch:[
  ['Hire a lawyer ($20,000)',()=>{S.money-=20000;if(Math.random()<.8)return 'My lawyer got the evidence thrown out.';S.jail=3;S.flags.record=true;return 'Even my lawyer couldn\'t save me. 3 years.'}],
  ['Wing it',()=>{if(Math.random()<.4)return 'The lab mixed up the samples. Case dropped.';S.jail=R(3,5);S.flags.record=true;if(S.job)S.job=null;return `I was convicted and sentenced to ${S.jail} years.`}]]},
{id:'oldboss',pri:1,min:23,max:70,cond:()=>mem('oldboss')&&S.age>=mem('oldboss').at+3&&S.job,text:'My old boss wants me back, offering 25% more than I make now.',ch:[
  ['Go back',()=>{delete S.mem.oldboss;S.job.s=Math.round(S.job.s*1.25);S.job.perf=60;return `I went back for ${fmt(S.job.s)}. Nice to be wanted.`}],['Stay put',()=>{delete S.mem.oldboss;return 'I thanked them and stayed.'}]]},
{id:'bizback',pri:1,min:20,max:80,cond:()=>mem('bizfail')&&S.age>=mem('bizfail').at+2&&S.biz.length<3&&S.age>=18,init:()=>mem('bizfail'),text:c=>`A loyal customer of my old business, ${c.name}, begged me to reopen it and offered $50,000 to help.`,ch:[
  ['Reopen it',c=>{delete S.mem.bizfail;const b=newBiz(c.type,c.name,{own:.75,inv:.25,cash:50000,rep:60});S.biz.push(b);mile(`Reopened ${c.name}`);return `${c.name} is back! The customer owns 25%.`}],
  ['No thanks',()=>{delete S.mem.bizfail;return 'That chapter is closed.'}]]},
{id:'angel',min:21,max:75,cond:()=>S.money>=10000,init:()=>({co:pick(BIZ.tech.names)}),text:c=>`My friend is launching a startup called ${c.co} and asked me to invest.`,ch:[
  ['Invest $10,000',c=>{S.money-=10000;S.angels.push({amt:10000,yrs:0,co:c.co});return 'I became an angel investor.'}],
  ['Invest $25,000',c=>{S.money-=25000;S.angels.push({amt:25000,yrs:0,co:c.co});return 'I went big on my friend\'s startup.'},()=>S.money<25000],
  ['Pass',()=>'I wished them luck but kept my money.']]},
{id:'angel2',pri:1,min:22,max:99,cond:()=>S.angels.some(a=>a.yrs===2&&!a.asked&&S.money>=10000),init:()=>({a:S.angels.find(a=>a.yrs===2&&!a.asked)}),text:c=>`${c.a.co} is struggling and needs one more round. They asked if I'd put in another $10,000.`,ch:[
  ['Double down',c=>{c.a.asked=true;S.money-=10000;c.a.amt+=10000;c.a.boost=.1;return 'I doubled down. Fingers crossed.'}],
  ['Hold',c=>{c.a.asked=true;c.a.boost=-.05;return 'I kept my stake as it is.'}]]},
{id:'marriedbiz',rep:1,min:22,max:90,w:2,cond:()=>spouse()&&S.biz.some(b=>b.life==='hands')&&spouse().rel<60,init:()=>({p:spouse()}),text:c=>`${fname(c.p.name)} says I'm married to my business.`,ch:[
  ['Step back',c=>{S.biz.forEach(b=>{if(b.life==='hands')b.life='delegate'});c.p.rel+=15;return 'I stepped back from the day-to-day. We have dinner together again.'}],
  ['Promise to do better',c=>{c.p.rel+=5;return 'I promised. We both know how that goes.'}],
  ['The business comes first',c=>{c.p.rel-=15;return 'I said the business comes first. The silence was deafening.'}]]},
/* ---- rare ---- */
{id:'lightning',min:10,max:95,w:.04,cls:'bad',auto:()=>{S.st.health-=20;unlock('lightning');mile('Got struck by lightning and lived');return 'I was struck by lightning. I survived, and my hair has never been the same.'}},
{id:'treasure',min:20,max:95,w:.05,cond:()=>homes().length,auto:()=>{const v=R(5000,60000);S.money+=v;mile('Found buried treasure in the garden');return `Digging in my garden, I found a rusty box of old coins. A dealer paid ${fmt(v)}.`},cls:'good'},

/* ================= economy & markets ================= */
function econYear(){
  const e=S.econ,old=e.phase,x=Math.random();
  if(old==='normal')e.phase=x<.15?'boom':x<.27?'recession':'normal';
  else if(old==='boom')e.phase=x<.15?'crash':x<.5?'normal':'boom';
  else if(old==='recession')e.phase=x<.4?'normal':x<.5?'crash':'recession';
  else e.phase=x<.6?'recession':'normal';
  e.yrs=e.phase===old?e.yrs+1:0;
  if(e.phase!==old&&S.age>=16){const msg={boom:'The economy is booming.',normal:'The economy has settled back to normal.',recession:'The economy fell into a recession.',crash:'The stock market crashed!'}[e.phase];line(`${PHASE[e.phase].ic} ${msg}`,e.phase==='boom'||e.phase==='normal'?'good':'bad');}
  const [mu,sd]=PHASE[e.phase].m;const mret=mu+gauss()*sd;
  TICK.forEach(t=>{const q=S.mkt[t.s];let r;
    if(t.fixed!=null)r=t.fixed;
    else if(t.crypto){const y=Math.random();r=y<.3?-50+gauss()*12:y<.65?-5+gauss()*20:y<.9?45+gauss()*20:130+gauss()*50;if(e.phase==='crash')r-=30;}
    else if(t.meme){const y=Math.random();r=y<.1?-99:y<.65?-70+gauss()*10:y<.9?30+gauss()*20:y<.985?200+gauss()*60:1200;}
    else if(t.penny){r=Math.random()<.07?-100:gauss()*70;}
    else r=t.drift+t.beta*mret+gauss()*t.sd;
    if(S.tip===t.s){r=150+gauss()*30;const own=(S.hold[t.s]||0)*q.p;if(own>0){line(`${t.n} shares rocketed ${Math.round(r)}% this year. That tip was real!`,'good');if(mem('tipVLTR')&&t.s==='VLTR')unlock('timetravel');}}
    r=Math.max(-100,r);q.chg=r;q.p=q.p*(1+r/100);
    if(t.penny&&r<=-100){if(S.hold[t.s]>0)line(`${t.n} went bankrupt. My shares are now worthless.`,'bad');S.hold[t.s]=0;S.basis[t.s]=0;q.p=t.start;}
    if(q.p<t.start*1e-6)q.p=t.start*1e-6;
  });
  S.tip=null;
  S.ret.bal=Math.round(S.ret.bal*(1+S.mkt.MKT.chg/100));
  const hr=PHASE[e.phase].home+gauss()*3;S.homeIdx*=1+hr/100;
  S.assets.forEach(a=>{if(a.k==='car')a.v=Math.round(a.v*.88);else a.v=Math.round(a.v*(1+(hr+gauss()*2)/100));});
}

/* ================= property, debt, costs ================= */
function propertyYear(){
  let rentIn=0;
  homes().forEach(a=>{
    S.money-=Math.round(a.v*.01);
    if(a.mort&&a.mort.bal>0){const int=a.mort.bal*a.mort.rate;const pay=Math.min(a.mort.pay,a.mort.bal+int);a.mort.bal=Math.max(0,Math.round(a.mort.bal+int-pay));S.money-=Math.round(pay);
      if(a.mort.bal===0){a.mort=null;line(`I paid off the mortgage on my ${a.n.toLowerCase()}!`,'good');unlock('debtfree');}}
    if(a.rent){const y=Math.random();
      if(y<.12)line(`My tenant at the ${a.n.toLowerCase()} stopped paying rent this year.`,'bad');
      else{let r=Math.round(a.v*.055);if(y<.22){const fix=Math.round(a.v*.02);r-=fix;line(`Repairs at my rental cost ${fmt(fix)}.`,'bad');}rentIn+=r;}}
  });
  if(rentIn){S.money+=Math.round(rentIn*.8);line(`My rental properties earned ${fmt(rentIn*.8)} after tax.`,'good');}
  const atHome=S.age<22&&living(['Mother','Father']).length&&!homes().length;
  if(S.age>=18&&!S.jail&&!atHome)S.money-=livingCost();
  if(S.sloan>0){S.sloan=Math.round(S.sloan*1.04);if(S.job){const p=Math.min(S.sloan,Math.round(S.job.s*.1));S.sloan-=p;S.money-=p;if(S.sloan===0)line('I paid off my student loans!','good');}}
  if(S.flags.talentPay&&!S.jail&&S.age<70){S.money+=S.flags.talentPay;}
  // trustee protects minors
  if(S.age<18&&S.money<0){homes().sort((a,b)=>a.v-b.v).forEach(a=>{if(S.money<0){S.money+=saleVal(a)-(a.mort?a.mort.bal:0);S.assets=S.assets.filter(x=>x!==a);line(`My trustee sold the ${a.n.toLowerCase()} to cover costs.`,'bad');}});if(S.money<0)S.money=0;}
  if(S.money<0&&S.age>=18){S.money=Math.round(S.money*1.07);S.st.happy-=3;}
}

/* ================= work ================= */
function workYear(){
  const j=S.job;if(!j)return;const C=CAREERS[j.c];
  if(S.jail){line(`I lost my job as a ${title(j)} while in prison.`,'bad');S.job=null;return;}
  const lay={boom:.01,normal:.02,recession:.07,crash:.14}[S.econ.phase]*(C.pub?.35:1);
  if(Math.random()<lay){const sev=Math.round(j.s*.1);S.money+=sev;line(`I was laid off from my job as a ${title(j)}. I got ${fmt(sev)} in severance.`,'bad');S.job=null;S.st.happy-=12;return;}
  const contrib=Math.round(j.s*S.ret.pct/100),match=Math.round(j.s*Math.min(S.ret.pct,5)/100*.5);
  S.ret.bal+=contrib+match;S.money+=Math.round((j.s-contrib)*.72);
  const style={slack:-8,normal:0,hustle:8}[j.style||'normal'];
  j.perf+=style+(S.st.smarts-50)/12+Math.min(3,j.lvlYrs/2)+R(-7,6)+(has('ambitious')?4:0)-(has('lazy')?4:0)+(C.art&&has('creative')?3:0);
  if(j.style==='hustle'){S.st.happy-=4;S.st.health-=2;}if(j.style==='slack')S.st.happy+=3;
  j.perf=clamp(j.perf);j.yrs++;j.lvlYrs++;
  if(j.perf<35&&j.perf>=25)line('My manager warned me that my performance is slipping.','bad');
  let msg,cls='';
  if(j.perf<25){j.warn=(j.warn||0)+1;if(j.warn>=2){line(`Performance review: needs improvement, again. I was fired from my job as a ${title(j)}.`,'bad');mile(`Got fired as a ${title(j)}`);S.job=null;S.st.happy-=15;return;}msg='Needs improvement. I got a formal warning. One more and I\'m out.';cls='bad';}
  else if(j.perf<60){j.warn=0;j.s=Math.round(j.s*1.03);msg='Meets expectations. 3% raise.';}
  else if(j.perf<85){j.warn=0;j.s=Math.round(j.s*1.05);const b=Math.round(j.s*.05);S.money+=Math.round(b*.72);msg=`Exceeds expectations. 5% raise and a ${fmt(b)} bonus.`;cls='good';}
  else{j.warn=0;j.s=Math.round(j.s*1.06);const b=Math.round(j.s*R(10,20)/100);S.money+=Math.round(b*.72);msg=`Outstanding! 6% raise and a ${fmt(b)} bonus.`;cls='good';
    if(canPromote(j)&&Math.random()<.55){line(`Performance review: ${msg}`,cls);line(promote(j),'good');return;}}
  line(`Performance review: ${msg}`,cls);trackBest();
}
function trackBest(){if(S.job&&(!S.bestJob||S.job.s>S.bestJob.s))S.bestJob={t:title(S.job),s:S.job.s};}
function canPromote(j){const C=CAREERS[j.c];return j.lvl<C.t.length-1&&j.lvlYrs>=1&&S.st.smarts>=reqSm(C,j.lvl+1);}
function promote(j){const C=CAREERS[j.c];j.lvl++;j.s=Math.max(Math.round(j.s*1.12),C.t[j.lvl][1]);j.lvlYrs=0;j.perf=55;S.st.happy+=10;mile(`Promoted to ${title(j)}`);trackBest();sfx('good');return `I was promoted to ${title(j)}! New salary: ${fmt(j.s)}.`;}
function hire(id){const C=CAREERS[id];S.job={c:id,s:C.t[0][1],perf:50,lvl:0,yrs:0,lvlYrs:0,warn:0,style:'normal'};S.biz.forEach(b=>{if(b.life==='hands')b.life='delegate'});if(!S.careers.includes(id)){S.careers.push(id);mile(`Started working as a ${C.t[0][0]}`);}trackBest();}

function annuity(P,r,n){return P*r/(1-Math.pow(1+r,-n));}
function loanRate(){return {boom:.07,normal:.06,recession:.05,crash:.045}[S.econ.phase];}

/* ================= relationships ================= */
function divorce(p){
  const fn=fname(p.name);S.rels=S.rels.filter(x=>x!==p);S.flags.exes++;S.exes.push(p.name);S.st.happy-=12;mile(`Divorced ${fn}`);
  if(p.prenup)return `${fn} and I divorced. The prenup kept my finances intact.`;
  const settle=Math.round((Math.max(0,propEquity())+stakeVal())*.5);
  if(S.money>0)S.money=Math.round(S.money/2);
  TICK.forEach(t=>{if(S.hold[t.s]){S.hold[t.s]/=2;S.basis[t.s]=(S.basis[t.s]||0)/2;}});
  S.ret.bal=Math.round(S.ret.bal/2);S.money-=settle;
  return `${fn} and I divorced. They got half my cash, investments and retirement${settle?`, plus a ${fmt(settle)} settlement for property and business`:''}.`;
}

/* ================= events engine ================= */
function evText(e,c){return typeof e.text==='function'?e.text(c):e.text;}
function evChoices(e,c){const ch=typeof e.ch==='function'?e.ch(c):e.ch;return ch.filter(x=>!x[3]||has(x[3])).map(([l,f,dis,tr])=>[tr?`${TRAITS[tr].ic} ${l}`:l,()=>f(c),dis,tr]);}
function fire(e){S.seen[e.id]=1;const c=e.init?e.init():{};if(e.auto){const r=e.auto(c);line(r,e.cls||'');return;}Q.push({text:evText(e,c),ch:evChoices(e,c)});}
function eligible(e){return S.age>=e.min&&S.age<=e.max&&(!S.seen[e.id]||e.rep)&&(!e.cond||e.cond());}
function queueEvents(){
  const due=EV.filter(e=>e.pri&&eligible(e));due.slice(0,2).forEach(fire);
  if(S.aiNext&&S.aiNext.age<=S.age){const a=S.aiNext;S.aiNext=null;if(S.age-a.age<=1){queueAI(a);return;}}
  if(due.length)return;
  if(Math.random()<.6){const pool=EV.filter(e=>!e.pri&&eligible(e));if(pool.length)fire(wpick(pool,e=>(e.w||1)*((e.w||1)<.1&&has('lucky')?3:1)));}
}

  S.gig=null;
  {const q0=Q.length;bizYear();
   if((S.age<18||S.jail)&&Q.length>q0){const mine=Q.splice(q0);const who=S.age<18?'My trustee':'My lawyer';
     mine.forEach(ev=>{const ch=(typeof ev.ch==='function'?ev.ch():ev.ch).find(c=>!(c[2]&&c[2]()));if(!ch)return;const r=ch[1]();line(`${ev.text} ${who} chose to ${ch[0].charAt(0).toLowerCase()+ch[0].slice(1)}. ${r||''}`.trim());});}}
  S.angels.forEach(a=>{a.yrs++;if(a.yrs>=4){const x=Math.random()-(a.boost||0)-(has('lucky')?.05:0);const m=x<.6?0:x<.85?2:x<.97?8:40;a.done=true;

  S.angels=S.angels.filter(a=>!a.done);

function decadeReview(){

function skipYears(n){

function checkDeath(){

/* ================= achievements ================= */
function unlock(id){if(META.ach[id]||!ACH[id])return;META.ach[id]=Date.now();saveMeta();const [ic,n]=ACH[id];toast(`🏆 ${ic} ${n}`);sfx('ach');}
function checkAch(){
  const nw=netWorth();
  if(nw>=1e6)unlock('millionaire');if(nw>=1e7)unlock('deca');if(nw>=1e9)unlock('billion');
  if(nw>=1e6&&S.gen===1&&!S.flags.lotto)unlock('selfmade');
  if(S.job){const C=CAREERS[S.job.c];if(S.job.lvl===C.t.length-1){unlock('ladder');if(S.flags.jailYears>0)unlock('cell2corner');}
    if(S.job.c==='med'&&S.job.lvl>=2)unlock('surgeon');if(S.job.c==='law'&&S.job.lvl>=2)unlock('partner');}
  if(homes().filter(a=>a.rent).length>=3)unlock('landlord');
  if(S.st.smarts>=100)unlock('genius');
  if(S.gen>=5)unlock('dynasty');
  if(kids().length>=5)unlock('bigfam');
  if(S.flags.exes>=5)unlock('heartbreak');
  if(S.flags.jailYears>=10)unlock('jailbird');
  if(S.biz.some(b=>b.type==='tech'&&bizVal(b)>=1e9))unlock('unicorn');
  if(S.flags.wasBankrupt&&nw>=1e6)unlock('phoenix');
  if(S.biz.some(b=>b.fr&&b.fr.n>=20))unlock('franchise');
  if(new Set(S.biz.filter(b=>b.lastPre>0).map(b=>b.type)).size>=3)unlock('empire');
  if(S.biz.some(b=>b.gens>=3))unlock('family3');
  if(S.biz.some(b=>b.turn!=null&&b.turn<35&&b.rep>=70))unlock('turnaround');
  checkChal();
}
function checkChal(){
  if(!S.chal||S.chalDone||S.chalFail)return;const C=CHAL[S.chal];
  if(C.goal()){S.chalDone=true;META.chals=META.chals||{};META.chals[S.chal]=true;saveMeta();unlock('challenge');line(`🎯 Challenge complete: ${C.n}!`,'good');mile(`Completed the "${C.n}" challenge`);toast(`🎯 Challenge complete: ${C.n}`);sfx('ach');}
  else if(C.dead&&C.dead()){S.chalFail=true;line(`🎯 Challenge failed: ${C.n}. Keep living anyway.`,'bad');}
}

/* ================= obituary ================= */
function ribbon(){
  const nw=netWorth();
  if(S.biz.some(b=>b.public)||S.peak>=50e6)return 'Tycoon';
  if(nw>=1e6)return 'Rich';
  if(S.flags.jailYears>=5)return 'Criminal';
  if(S.job&&S.job.lvl===CAREERS[S.job.c].t.length-1)return 'Top of the ladder';
  if(S.st.smarts>=90)return 'Genius';
  if(kids().length>=3)return 'Family person';
  if(S.flags.exes>=4)return 'Heartbreaker';
  if(S.age>=95)return 'Survivor';
  if(S.st.happy>=80)return 'Content';
  if(S.age<30)return 'Brief';
  return 'Ordinary';
}
const ADJ={ambitious:'relentlessly ambitious',lazy:'gloriously unhurried',charming:'impossible not to like',genius:'the smartest person in most rooms',athletic:'always the first one up the hill',reckless:'fearless to a fault',frugal:'legendarily thrifty',spender:'generous with their credit card',lucky:'improbably lucky',anxious:'a devoted worrier',creative:'endlessly creative',hothead:'quick to anger and quicker to laugh',kind:'deeply kind',hustler:'always working an angle'};
const listJoin=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function obituary(){
  const fn=fname(S.name),P=[],nw=netWorth();
  P.push(`${S.name} died at age ${S.age} from ${S.cause}, in ${S.city}. ${fn} was ${listJoin(S.traits.map(t=>ADJ[t]))}.`);
  if(S.careers.length){const top=S.bestJob?S.bestJob.t:null;
    P.push(`${fn} worked ${S.careers.length>2?`in ${S.careers.length} different fields`:'for years'}${top?`, rising as high as ${top.toLowerCase()}`:''}.${S.miles.some(m=>m.t.startsWith('Got fired'))?' There was at least one firing, which they described as "a mutual misunderstanding."':''}`);}
  else if(S.age>=25)P.push(`${fn} never held a steady job, which they called "a lifestyle choice."`);
  const degs=S.edu.degrees;if(degs.length)P.push(`They earned ${degs.length>1?'degrees':'a degree'} in ${degs.join(' and ')}.`);
  const founded=S.miles.filter(m=>/went out of business|was sold|closed its doors|Sold /.test(m.t));
  if(S.biz.length||founded.length)P.push(`An entrepreneur at heart, ${fn} ${S.biz.length?`still owned ${listJoin(S.biz.map(b=>b.name))}`:'built businesses'}${founded.length?`, and had ${founded.length} other venture${founded.length>1?'s':''} that ${founded.some(m=>m.t.includes('went out'))?'did not all survive':'ended on their own terms'}`:''}.`);
  const memeGain=S.flags.memeProfit||0;
  P.push(nw<0?`They left behind more debt than furniture.`:nw<20000?`They left a modest estate and a very full junk drawer.`:nw<1e6?`They left a comfortable nest egg of ${fmt(nw)}.`:`They left a fortune of ${fmt(nw)}${memeGain>=1e5?', much of it, bafflingly, from Moonpaw Coin':''}.`);
  const odd=S.miles.filter(m=>/lightning|treasure|game show|strange lights|memoir|science fair|competition|scholarship|paid work/.test(m.t));
  if(odd.length)P.push(`Friends will remember that they ${odd.slice(0,2).map(m=>m.t.charAt(0).toLowerCase()+m.t.slice(1)).join(', and ')}.`);
  if(S.flags.jailYears)P.push(`They served ${S.flags.jailYears} year${S.flags.jailYears>1?'s':''} in prison, a chapter the family politely skips at holidays.`);
  const sp=spouse(),k=kids().filter(c=>c.alive),pets=living(['Pet']);
  const surv=[];if(sp)surv.push(`their spouse ${fname(sp.name)}`);if(k.length)surv.push(`${k.length} child${k.length>1?'ren':''}`);if(pets.length)surv.push(pets.map(p=>fname(p.name)).join(' and ')+(pets.length>1?', their pets':', their pet'));
  if(surv.length)P.push(`${fn} is survived by ${surv.join(', ')}${S.flags.exes>=3?', and several exes who were "not surprised"':''}.`);
  else P.push(`${fn} is survived by ${S.flags.exes>=2?'a handful of exes and ':''}a houseplant that has seen things.`);
  P.push(pick(['In lieu of flowers, the family asks that you call your mother.','A small service will be held, with snacks.','They would want you to know they were right about most things.','Their last words were reportedly "wait, watch this."']));
  return P.join(' ');
}

/* ---- a reusable "choose an amount" modal: slider + typed number + quick chips ---- */
function amountModal({title,sub,min=0,max,init,btn,note,onOk,step}){
  max=Math.max(0,Math.floor(max));min=Math.max(0,Math.min(min,max));
  if(max<=0||max<min){toast('Not enough money for that right now.');return;}
  const m=$('modal');m.innerHTML='';let amt=Math.max(min,Math.min(max,Math.round(init==null?max*.25:init)));
  const noteEl=h('p',{className:'sub'}),ok=h('button',{className:'choice'});
  const st=step||Math.max(1,Math.round((max-min)/200/100)*100||1);
  const range=h('input',{type:'range',min:min,max:max,step:st,value:amt,className:'slider','aria-label':'Amount'});
  const num=h('input',{type:'number',min:min,max:max,step:1,value:amt,className:'amt','aria-label':'Amount in dollars',inputMode:'numeric'});
  const upd=(v,fromNum)=>{amt=Math.max(min,Math.min(max,Math.round(+v||0)));range.value=amt;if(!fromNum)num.value=amt;ok.textContent=btn(amt);ok.disabled=amt<=0||amt<min;noteEl.textContent=note?note(amt):'';};
  range.oninput=()=>upd(range.value);num.oninput=()=>upd(num.value,true);num.onblur=()=>{num.value=amt;};
  const chips=h('div',{className:'btns',style:'grid-template-columns:repeat(4,1fr)'},[.25,.5,.75,1].map(f=>h('button',{className:'row',on:()=>upd(min+(max-min)*f)},f===1?'Max':`${f*100}%`)));
  ok.onclick=()=>{if(amt<=0||amt<min)return;closeModal();onOk(amt);};
  m.append(h('h3',{},title),sub?h('p',{className:'sub'},sub):null,h('p',{className:'label'},`Slide or type an amount (${fmt(min)} to ${fmt(max)})`),range,num,chips,noteEl,ok,h('button',{className:'choice alt',on:closeModal},'Cancel'));
  upd(amt);$('modalWrap').classList.add('open');
}

/* ---- track business experience ---- */
function bizExp(){const f=S.flags;return {yrs:f.bizYears||0,exits:f.exits||0,busts:f.busts||0};}

/* ---- how interested investors are, with the reasons shown ---- */
function investorInterest(b,type){
  const e=bizExp(),parts=[];const add=(l,v)=>{v=Math.round(v);if(v)parts.push([l,v]);};
  add('Baseline',30);
  add(`Business experience (${e.yrs} yr${e.yrs===1?'':'s'})`,Math.min(25,e.yrs*2));
  add(`Successful exits (${e.exits})`,Math.min(20,e.exits*8));
  add(`Failed businesses (${e.busts})`,-Math.min(20,e.busts*7));
  add('Founder fame',(S.fame||0)*.25);
  if(S.edu.degrees.includes('MBA'))add('MBA',8);
  if(has('charming'))add('Charming',5);if(has('hustler'))add('Hustler',5);if(has('ambitious'))add('Ambitious',3);
  add(`Smarts (${S.st.smarts}%)`,(S.st.smarts-50)*.2);
  if(S.job&&S.job.lvl>0)add(`Career seniority (${title(S.job)})`,S.job.lvl*3);
  if(badCredit())add('Damaged credit',-10);
  if(b&&b.salary>marketSalary(b)*1.15)add('Founder pays themselves too much',-8);
  if(b){add(`Reputation (${b.rep}%)`,(b.rep-50)*.5);
    if(b.yrs>0)add(b.lastPre>0?'Profitable last year':'Lost money last year',b.lastPre>0?10:-8);
    if(b.hist&&b.hist.length>=2){const g=b.hist[b.hist.length-1].rev-b.hist[b.hist.length-2].rev;if(g>0)add('Revenue growing',6);}}
  else{const T=BIZ[type];if(T.tech)add('Investors love tech',6);if(T.hit)add('Hit-driven, risky',-5);}
  const score=Math.max(0,Math.min(100,parts.reduce((a,p)=>a+p[1],0)));
  return {score,parts};
}
const interestBox=ii=>h('div',{className:'flash'},h('b',{},`Investor interest: ${ii.score}/100 `),ii.score>=40?'(investors will take a meeting)':'(needs 40 for a meeting)',
  h('ul',{style:'margin:6px 0 0;padding-left:18px'},ii.parts.map(([l,v])=>h('li',{},`${l}: ${v>0?'+':''}${v}`))));

/* ---- bank lending ---- */
function startLoanMax(capital){
  if(badCredit()||S.age<18)return 0;const e=bizExp();
  const coll=Math.max(0,netWorth())*.5+(S.job?S.job.s*2:0)+Math.min(300000,e.yrs*15000)+e.exits*100000;
  return Math.max(0,Math.round(Math.min(capital*.7,coll)/1000)*1000);
}
function bizLoanMax(b){
  if(badCredit()||b.yrs<1)return 0;
  const cap=bizVal(b)*.4+Math.max(0,b.lastPre)*2-(b.loan.bal||0)-(b.credit||0);
  return Math.max(0,Math.round(cap/1000)*1000);
}
function addLoan(b,amt,extra=0){const r=loanRate()+.025+extra;const bal=(b.loan.bal||0)+amt;
  const rate=b.loan.bal?((b.loan.bal*b.loan.rate+amt*r)/bal):r;b.loan={bal,rate,pay:Math.round(annuity(bal,rate,LOAN_YEARS))};return b.loan;}

/* ---- investor offers ---- */
function investorOffer(score,preValue,amt){const pre=Math.round(preValue*(.7+score/100));const eq=amt/(pre+amt);return {pre,eq};}

/* ================= launch screen ================= */
let launch=null;
function startBiz(k){
  const T=BIZ[k];const nm=pick(T.names.filter(n=>!S.biz.some(b=>b.name===n)))||T.names[0];
  const cands=[];const sib=sibling(),pt=partner();if(pt)cands.push({p:pt,label:`${fname(pt.name)} (my ${pt.type.toLowerCase()})`});if(sib)cands.push({p:sib,label:`${fname(sib.name)} (my ${sib.gender==='M'?'brother':'sister'})`});
  const fr=first(pick(['M','F']))+' '+pick(LAST);cands.push({p:{id:null,name:fr},label:`${fname(fr)} (an old friend)`});
  launch={k,nm,capital:T.cost,mine:Math.min(Math.max(0,S.money),T.cost),loan:0,co:null,coAmt:0,inv:null,cands};
  bizView=null;flash=null;drawSheet(true);
}
function launchView(s){
  const L=launch,T=BIZ[L.k],setup=Math.round(T.cost*(1-T.cap));
  const inv=L.inv?L.inv.amt:0,raised=L.mine+L.loan+L.coAmt+inv,short=L.capital-raised;
  s.append(h('button',{className:'back',on:()=>{launch=null;flash=null;drawSheet(true)}},'‹ All businesses'),
    h('h3',{},`${T.ic} Launch ${L.nm}`),
    h('p',{className:'sub'},`A ${T.n.toLowerCase()} needs at least ${fmt(T.cost)}: ${fmt(setup)} for setup${T.cap<1?' (equipment, fit-out, permits)':''} and ${fmt(T.cost-setup)} of starting cash. Anything above the minimum becomes extra cash for the business.`));
  // capital
  s.append(h('h4',{},'1. Startup capital'),
    row('Capital to launch with',`Business starts with ${fmt(L.capital-setup)} in the bank`,fmt(L.capital),()=>amountModal({title:'Startup capital',sub:`Minimum ${fmt(T.cost)}. More capital means more runway for tough early years.`,min:T.cost,max:T.cost*5,init:L.capital,
      btn:a=>`Launch with ${fmt(a)}`,note:a=>`Setup ${fmt(setup)}, starting cash ${fmt(a-setup)}.`,onOk:a=>{L.capital=a;L.mine=Math.min(L.mine,a);flash=null;drawSheet();}})));
  // funding
  s.append(h('h4',{},'2. Funding'));
  s.append(row('💵 My own cash',`I have ${fmt(S.money)}`,fmt(L.mine),()=>amountModal({title:'How much of my own cash?',sub:`I have ${fmt(S.money)}.`,max:Math.min(Math.max(0,S.money),L.capital),init:L.mine,
    btn:a=>`Put in ${fmt(a)}`,note:a=>`I'd keep ${fmt(S.money-a)}.`,onOk:a=>{L.mine=a;drawSheet();}}),S.money<=0));
  const lm=startLoanMax(L.capital),r=loanRate()+.025;
  s.append(row('🏦 Bank loan',lm>0?`Up to ${fmt(lm)} at ${(r*100).toFixed(1)}%, repaid over ${LOAN_YEARS} years from business cash. Based on my net worth, income and experience`:badCredit()?'My credit is damaged. Banks said no':'The bank needs more net worth, income or business experience',fmt(L.loan),
    ()=>amountModal({title:'Business bank loan',sub:`Up to ${fmt(lm)} at ${(r*100).toFixed(1)}% over ${LOAN_YEARS} years.`,max:lm,init:L.loan||lm/2,btn:a=>`Borrow ${fmt(a)}`,
      note:a=>`Yearly payment about ${fmt(annuity(a,r,LOAN_YEARS))}, paid by the business.`,onOk:a=>{L.loan=a;drawSheet();}}),lm<=0));
  s.append(row('🤝 Co-founder',L.co?`${L.co.label} puts in ${fmt(L.coAmt)}`:'A partner, sibling or friend chips in for a share',L.co?fmt(L.coAmt):'',()=>{
    choiceModal('Pick a co-founder','They put in money and own a share in proportion. Business fights can hurt the relationship.',L.cands.map(c=>[c.label,()=>amountModal({title:`${fname(c.p.name)}'s investment`,sub:'Up to half the capital.',max:L.capital/2,init:L.capital/4,btn:a=>`They put in ${fmt(a)}`,onOk:a=>{L.co=c;L.coAmt=a;drawSheet();}})]).concat(L.co?[['Remove co-founder',()=>{L.co=null;L.coAmt=0;drawSheet();}]]:[]).concat([['Cancel',()=>{}]]));}));
  const ii=investorInterest(null,L.k);
  s.append(row('💸 Outside investors',L.inv?`${fmt(L.inv.amt)} for ${(L.inv.eq*100).toFixed(1)}% of the company`:S.used.pitch?'Already pitched this year':ii.score<40?`Interest too low (${ii.score}/100, needs 40)`:`Interest ${ii.score}/100. Pitch for an offer`,L.inv?fmt(L.inv.amt):'',
    ()=>{if(L.inv){choiceModal('Investor deal',`${fmt(L.inv.amt)} for ${(L.inv.eq*100).toFixed(1)}%.`,[['Drop this deal',()=>{L.inv=null;drawSheet();}],['Keep it',()=>{}]]);return;}
      amountModal({title:'How much to raise?',sub:`Investors value the idea at about ${fmt(investorOffer(ii.score,L.capital,0).pre)} before their money. A better pitch gets a better price.`,max:L.capital*.7,init:L.capital*.3,
        btn:a=>`Pitch for ${fmt(a)}`,note:a=>{const o=investorOffer(ii.score,L.capital,a);return `If the pitch goes okay, they'd want about ${(o.eq*100).toFixed(1)}% of the company.`;},
        onOk:a=>{S.used.pitch=true;pitch(`Pitching ${L.nm}`,sc=>{const fin=Math.round(ii.score*.6+sc*.4);
          if(fin>=45){const o=investorOffer(fin,L.capital,a);L.inv={amt:a,eq:o.eq};flash={t:`Investors offered ${fmt(a)} for ${(o.eq*100).toFixed(1)}% (pitch ${sc}, overall ${fin}).`,c:'good'};}
          else flash={t:`Investors passed (pitch ${sc}, overall ${fin}, needed 45). I can try again next year.`,c:'bad'};drawSheet();});}});},
    !L.inv&&(S.used.pitch||ii.score<40)));
  s.append(interestBox(ii));
  // summary
  const coShare=L.coAmt?(1-(L.inv?L.inv.eq:0))*L.coAmt/Math.max(1,L.mine+L.loan+L.coAmt):0;const myShare=1-(L.inv?L.inv.eq:0)-coShare;
  s.append(h('h4',{},'3. Launch'),h('dl',{},h('dt',{},'Capital needed'),h('dd',{},fmt(L.capital)),h('dt',{},'Raised'),h('dd',{className:short>0?'bad':'good'},fmt(raised)),
    h('dt',{},'My ownership'),h('dd',{},`${Math.round(myShare*100)}%`),coShare?h('dt',{},'Co-founder'):null,coShare?h('dd',{},`${Math.round(coShare*100)}%`):null,L.inv?h('dt',{},'Investors'):null,L.inv?h('dd',{},`${(L.inv.eq*100).toFixed(1)}%`):null,
    L.loan?h('dt',{},'Loan payment'):null,L.loan?h('dd',{},`${fmt(annuity(L.loan,r,LOAN_YEARS))}/yr`):null));
  if(short>0)s.append(h('p',{className:'sub warn'},`Still need ${fmt(short)}. Add my cash, a loan, a co-founder or investors.`));
  if(raised>L.capital)s.append(h('p',{className:'sub'},`That's ${fmt(raised-L.capital)} more than the capital, so it all goes into the business as extra cash.`));
  s.append(h('button',{className:'choice',disabled:short>0||S.money<L.mine,on:()=>{
    const T=BIZ[L.k];S.money-=L.mine;
    const b=newBiz(L.k,L.nm,{own:myShare,inv:L.inv?L.inv.eq:0,rep:50+(has('hustler')?10:0)+(S.edu.degrees.includes('MBA')?5:0),cash:raised-setup});
    if(L.loan)addLoan(b,L.loan);
    if(L.co){b.co={pid:L.co.p.id,name:L.co.p.name,share:coShare};if(L.co.p.rel!=null)L.co.p.rel+=8;}
    S.biz.push(b);S.flags.founded=(S.flags.founded||0)+1;unlock('founder');if(S.flags.founded>=5)unlock('serial');mile(`Founded ${L.nm}, a ${T.n.toLowerCase()}`);
    const nm=L.nm;launch=null;bizView=b.id;bTab='over';
    stay(`I launched ${nm} with ${fmt(raised)}${L.loan?`, including a ${fmt(L.loan)} bank loan`:''}${L.inv?` and ${fmt(L.inv.amt)} from investors`:''}. I own ${Math.round(myShare*100)}%.`,'good');}},short>0?`Need ${fmt(short)} more`:`🚀 Launch ${L.nm}`));
}

/* ================= finance tab ================= */
function finTab(s,b){
  const T=Tof(b),v=bizVal(b),ro=!canManage();
  // cash position
  const burn=b.lastPre<0?-b.lastPre:0;
  s.append(h('dl',{},h('dt',{},'Business cash'),h('dd',{className:b.cash<0?'bad':''},fmt(b.cash)),h('dt',{},'My cash'),h('dd',{className:S.money<0?'bad':''},fmt(S.money)),
    h('dt',{},'Last year profit'),h('dd',{className:b.lastPre<0?'bad':''},fmt(b.lastPre)),burn?h('dt',{},'Runway'):null,burn?h('dd',{},`${Math.max(0,b.cash/burn).toFixed(1)} years`):null,
    h('dt',{},'Bank loan'),h('dd',{},b.loan.bal?`${fmt(b.loan.bal)} at ${(b.loan.rate*100).toFixed(1)}%`:'None'),h('dt',{},'Credit line used'),h('dd',{},fmt(b.credit||0)),
    h('dt',{},'Company value'),h('dd',{},fmt(v))));
  s.append(h('p',{className:'label'},'Ownership'),h('p',{className:'sub'},[`Me ${Math.round(b.own*100)}%`,b.co?`${fname(b.co.name)} ${Math.round(b.co.share*100)}%`:null,b.inv>0?`Investors ${Math.round(b.inv*100)}%${b.inv>=.3?' (board seats)':''}`:null,b.pub?'Publicly traded':null].filter(Boolean).join(' · ')));
  if(!ro&&!b.ousted)s.append(salaryRow(b));
  if(ro){s.append(h('p',{className:'sub'},S.jail?"I can't make financial moves from prison.":S.age<18?'A trustee manages the money until I turn 18.':''));return;}
  if(b.ousted){const cost=Math.round(v*b.inv*1.2);s.append(row('Buy out the investors',`Take back control for ${fmt(cost)}`,'',()=>{S.money-=cost;b.own+=b.inv;b.inv=0;b.ousted=false;b.life='delegate';stay(`I bought out the investors and I'm CEO of ${b.name} again.`,'good')},S.money<cost));}
  if(b.cash<Math.max(10000,burn*.5)&&!b.ousted)s.append(h('p',{className:'flash bad'},`⚠️ ${b.name} is low on cash. Put money in, borrow from the bank, draw the credit line, or raise from investors below.`));
  if(!b.ousted){
    s.append(h('h4',{},'Move money'),h('div',{className:'btns'},row('💵 Take cash out',`Has ${fmt(b.cash)}`,'',()=>cashModal(b,'out'),b.cash<=0),row('💰 Put cash in',`I have ${fmt(S.money)}`,'',()=>cashModal(b,'in'),S.money<=0)));
    // bank
    const lm=bizLoanMax(b),r=loanRate()+.025;
    s.append(h('h4',{},'Bank loan'),
      row('🏦 Borrow from the bank',lm>0?`Up to ${fmt(lm)} more at about ${(r*100).toFixed(1)}%, over ${LOAN_YEARS} years`:b.yrs<1?'Banks want at least 1 year of trading':badCredit()?'My credit is damaged':'The business is already borrowed to the limit','',
        ()=>amountModal({title:`Borrow for ${b.name}`,sub:`The bank will lend up to ${fmt(lm)} based on the company's value and profits.`,max:lm,init:lm/2,btn:a=>`Borrow ${fmt(a)}`,
          note:a=>{const bal=(b.loan.bal||0)+a;return `New total ${fmt(bal)}. Yearly payment about ${fmt(annuity(bal,b.loan.bal?((b.loan.bal*b.loan.rate+a*r)/bal):r,LOAN_YEARS))}.`;},
          onOk:a=>{addLoan(b,a);b.cash+=a;stay(`${b.name} borrowed ${fmt(a)} from the bank.`)}}),lm<=0));
    if(b.loan.bal>0)s.append(row('Repay the loan',`From business cash. Owed ${fmt(b.loan.bal)}`,'',()=>amountModal({title:'Repay the bank loan',sub:`Owed ${fmt(b.loan.bal)}. Business cash ${fmt(b.cash)}.`,max:Math.min(b.loan.bal,b.cash),init:Math.min(b.loan.bal,b.cash),btn:a=>`Repay ${fmt(a)}`,
      onOk:a=>{b.cash-=a;b.loan.bal-=a;if(b.loan.bal<=0){b.loan={bal:0,rate:0,pay:0};stay('I paid off the business loan!','good');}else{b.loan.pay=Math.round(annuity(b.loan.bal,b.loan.rate,LOAN_YEARS));stay(`Repaid ${fmt(a)}. ${fmt(b.loan.bal)} left.`);}}}),b.cash<=0));
    // credit line
    const lim=creditLimit(b),room=Math.max(0,lim-(b.credit||0));
    s.append(h('h4',{},'Credit line'),h('p',{className:'sub'},lim?`${fmt(b.credit||0)} used of ${fmt(lim)}. 10% interest a year. It also covers shortfalls automatically.`:'Opens after 1 year of trading with good credit.'),
      h('div',{className:'btns'},row('Draw','','',()=>amountModal({title:'Draw on the credit line',max:room,init:room/2,btn:a=>`Draw ${fmt(a)}`,onOk:a=>{b.credit=(b.credit||0)+a;b.cash+=a;stay(`Drew ${fmt(a)} from the credit line.`)}}),room<=0),
        row('Repay','','',()=>amountModal({title:'Repay the credit line',max:Math.min(b.credit||0,b.cash),init:Math.min(b.credit||0,b.cash),btn:a=>`Repay ${fmt(a)}`,onOk:a=>{b.cash-=a;b.credit-=a;stay(`Repaid ${fmt(a)} of the credit line.`,'good')}}),!b.credit||b.cash<=0)));
    // investors
    const ii=investorInterest(b);const why=b.pub?'Public companies raise money on the stock market':S.used['raise'+b.id]?'Already pitched this year':ii.score<40?`Interest too low (${ii.score}/100, needs 40)`:energyLeft()<1?'Needs 1 energy (⚡)':b.own<=.15?'I own too little to sell more':null;
    s.append(h('h4',{},'Investors'),row('💸 Raise money from investors',why||'Sell part of the company. The money goes into the business','',()=>{const base=Math.max(v,T.cost);
      amountModal({title:`Raise money for ${b.name}`,sub:`Investors value it at about ${fmt(investorOffer(ii.score,base,0).pre)} before their money.`,max:base*.5,init:base*.2,btn:a=>`Pitch for ${fmt(a)}`,
        note:a=>`They'd want about ${(investorOffer(ii.score,base,a).eq*100).toFixed(1)}% of the company.`,
        onOk:a=>{S.used['raise'+b.id]=true;spend(1);pitch(`Raising for ${b.name}`,sc=>{const fin=Math.round(ii.score*.6+sc*.4);
          if(fin>=45){const o=investorOffer(fin,base,a);const tot=b.own+(b.co?b.co.share:0)+(b.inv||0)||1;const keep=1-o.eq;b.own*=keep;if(b.co)b.co.share*=keep;b.inv=(b.inv||0)*keep+o.eq;b.cash+=a;
            stay(`${b.name} raised ${fmt(a)} for ${(o.eq*100).toFixed(1)}% (overall score ${fin}). I now own ${Math.round(b.own*100)}%.${b.inv>=.3?' Investors now have board seats.':''}`,'good');}
          else stay(`Investors passed. Overall score ${fin}, they needed 45. I can try again next year.`,'bad');});}});},!!why),interestBox(ii));
    // IPO
    if(!b.pub){const need=5e6;s.append(h('h4',{},'Go public'),row('🔔 IPO',v<need?`Needs a company value of ${fmt(need)} (now ${fmt(v)})`:b.yrs<3?`Needs 3 years of trading (now ${b.yrs})`:'Sell 30% of my stake to the public. Shares trade in the Investing tab','',()=>{
      const cashOut=Math.round(v*b.own*.3*1.3);S.money+=cashOut;b.inv+=b.own*.3;b.own*=.7;b.pub={sent:1};S.fame=Math.min(100,(S.fame||0)+15);unlock('ipo');mile(`Took ${b.name} public`);stay(`${b.name} went public! I cashed out ${fmt(cashOut)}.`,'good')},v<need||b.yrs<3));}
  }
  // exit
  s.append(h('h4',{},'Exit'));
  {const sv=Math.max(v,Math.round(T.cost*.25*b.locs));s.append(row('🤝 Sell my stake',v>0?'Negotiate with a buyer':'Buyers will pay for the equipment and customers','~'+fmt(sv*b.own),()=>negotiate({title:`Selling ${b.name}`,offer:Math.round(sv*b.own*R(80,100)/100),lev:.4+b.rep/200,onDeal:p=>{bizView=null;return sellBiz(b,p);}})));}
  if(!b.ousted)s.append(row('Shut it down','Recover leftover cash, equipment and buildings','',()=>{bizView=null;stay(closeBiz(b,false))}));
}

/* ================= running out of money ================= */
function deficitEvent(b){
  const short=-b.cash;const lm=bizLoanMax(b),room=Math.max(0,creditLimit(b)-(b.credit||0)),ii=investorInterest(b);
  const eq=investorOffer(Math.max(20,ii.score-15),Math.max(bizVal(b),BIZ[b.type].cost*.3),short*1.5).eq;
  return {text:`${b.name} ran out of money. It's ${fmt(short)} short. How do I keep it alive?`,ch:[
    [`Cover it from my cash (${fmt(short)})`,()=>{S.money-=short;b.cash=0;return `I covered the shortfall to keep ${b.name} alive.`},()=>S.money<short],
    [`Emergency bank loan (${fmt(short*1.2)})`,()=>{addLoan(b,Math.round(short*1.2),.02);b.cash+=Math.round(short*1.2);return `The bank lent ${fmt(short*1.2)} at a higher rate to keep ${b.name} going.`},()=>lm<short*1.2],
    [`Draw the credit line (${fmt(short)})`,()=>{b.credit=(b.credit||0)+short;b.cash=0;return 'I drew on the credit line to cover it.'},()=>room<short],
    [`Rescue investor: ${fmt(short*1.5)} for ${(eq*100).toFixed(0)}%`,()=>{const keep=1-eq;b.own*=keep;if(b.co)b.co.share*=keep;b.inv=(b.inv||0)*keep+eq;b.cash+=Math.round(short*1.5);return `A rescue investor put in ${fmt(short*1.5)} for ${(eq*100).toFixed(0)}% of ${b.name}.`},()=>ii.score<30||b.pub||b.own<.2],
    [`Sell it for whatever I can get`,()=>{const p=Math.round(Math.max(0,BIZ[b.type].cost*.15*b.locs-b.loan.bal)*b.own);return sellBiz(b,p);}],
    ['Let it go under',()=>closeBiz(b,true)]]};
}

/* ================= spending-power note for costly actions ================= */
const powerNote=b=>h('p',{className:'sub'},`Spending power: ${fmt(Math.max(0,b.cash))} business cash + ${fmt(Math.max(0,S.money))} my cash. `,
  h('button',{className:'back',style:'display:inline;margin:0',on:()=>{bTab='fin';flash=null;drawSheet(true)}},'Need more? Finance ›'));

/* ================= owner salary ================= */
function salaryRow(b){
  const mk=marketSalary(b),mx=maxSalary(b),cur=b.salary||0;
  const zone=a=>a===0?'No salary. All profit stays in the business.':a<mk*.6?'Modest. Leaves more cash in the business.':a<=mk*1.15?'Fair for a business this size.':'Above market. Co-founders and investors will grumble, and the board may act if it lasts.';
  return row('💼 My salary',cur?`${fmt(cur)}/yr (${fmt(cur*.72)} after tax). ${zone(cur).split('.')[0]}.`:`Not paying myself. Fair pay for my role here is about ${fmt(mk)}/yr`,cur?fmt(cur):'',()=>{
    amountModal({title:`My salary from ${b.name}`,sub:`Fair pay for my role (${{hands:'hands-on',delegate:'delegating',absent:'hands-off'}[b.life]}) at a business with about ${fmt(b.yrs?b.lastRev:Tof(b).base*b.locs)} in yearly sales is around ${fmt(mk)}. The most I can justify is ${fmt(mx)}.`,
      min:0,max:mx,init:cur||mk,step:1000,btn:a=>a?`Pay myself ${fmt(a)}/yr`:'Stop paying myself',
      note:a=>`${zone(a)} Paid each year as a business expense, taxed like a paycheck: I'd get ${fmt(a*.72)}.${b.lastPre&&a>cur?` Profit would drop to about ${fmt(b.lastPre-(a-cur))}.`:''}`,
      onOk:a=>{b.salary=a;stay(a?`I set my salary at ${b.name} to ${fmt(a)} a year.`:`I stopped paying myself from ${b.name}.`)}});
  });
}
/* ================= boot ================= */
$('bAge').onclick=()=>{if(modalOpen())return;S.alive?ageUp():showDeath()};
$('bSkip').onclick=()=>skipYears(5);
$('bJob').onclick=jobSheet;$('bMoney').onclick=moneySheet;$('bRel').onclick=relSheet;$('bAct').onclick=actSheet;$('bMenu').onclick=menuSheet;
loadMeta();
S=load();
function migrate(){if(S.v===3){S.v=4;Object.assign(S,{fame:S.fame||0,rivals:S.rivals||[],forSale:[],mentees:[],trend:null,regs:{wage:1,foodTax:0,tax:.2,deliv:.15,zoning:1},supIdx:1,holding:null,exes:[],chal:null});
  S.biz=S.biz.map(b=>{const n=newBiz(b.type,b.name);const keep={};['id','own','cash','loan','rep','staff','locs','price','base','lastRev','lastPre','yrs','public'].forEach(k=>{if(b[k]!=null)keep[k]=b[k];});
    Object.assign(n,keep,{life:b.me?'hands':'delegate',inv:1-(b.own||1)});if(b.public)n.pub={sent:1};return n;});}}
if(S&&(S.v===3||S.v===4)){migrate();render();if(!S.alive)showDeath()}else newLife();
</script>

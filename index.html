  if(short>0)s.append(h('p',{className:'sub warn'},`Still need ${fmt(short)}. Add my cash, a loan or investors.`));
  if(raised>x.price)s.append(h('p',{className:'sub'},`The extra ${fmt(raised-x.price)} goes into the business as cash.`));
  s.append(h('button',{className:'choice',disabled:short>0||S.money<D.mine||S.biz.length>=5,on:()=>{
    S.money-=D.mine;const b=newBiz(x.type,x.name,{own:myShare,inv:D.inv?D.inv.eq:0,rep:x.rep,locs:x.locs,staff:f.staff,cash:f.cash+raised-x.price,lastRev:f.rev,lastPre:f.pre,founder:'someone else',turn:x.rep});
    b.base=T.base;seedProducts(b);if(D.loan)addLoan(b,D.loan,.005);S.biz.push(b);S.forSale=S.forSale.filter(y=>y!==x);mile(`Bought ${x.name}`);
    buyDeal=null;bizView=b.id;bTab='over';
    stay(`I bought ${x.name} for ${fmt(x.price)}${D.loan?`, with a ${fmt(D.loan)} bank loan`:''}${D.inv?` and ${fmt(D.inv.amt)} from investors`:''}. I own ${Math.round(myShare*100)}%.`,'good');}},short>0?`Need ${fmt(short)} more`:`🤝 Buy ${x.name}`));
}

/* ================= finance tab ================= */
function finTab(s,b){
  const T=Tof(b),v=bizVal(b),ro=!canManage();
  // cash position
  const burn=b.lastPre<0?-b.lastPre:0;
  s.append(h('dl',{},h('dt',{},'Business cash'),h('dd',{className:b.cash<0?'bad':''},fmt(b.cash)),h('dt',{},'My cash'),h('dd',{className:S.money<0?'bad':''},fmt(S.money)),
    h('dt',{},'Last year profit'),h('dd',{className:b.lastPre<0?'bad':''},fmt(b.lastPre)),burn?h('dt',{},'Runway'):null,burn?h('dd',{},`${Math.max(0,b.cash/burn).toFixed(1)} years`):null,
    h('dt',{},'Bank loan'),h('dd',{},b.loan.bal?`${fmt(b.loan.bal)} at ${(b.loan.rate*100).toFixed(1)}%`:'None'),h('dt',{},'Credit line used'),h('dd',{},fmt(b.credit||0)),
    h('dt',{},'Company value'),h('dd',{},fmt(v))));
  s.append(h('p',{className:'label'},'Ownership'),h('p',{className:'sub'},[`Me ${Math.round(b.own*100)}%`,b.co?`${fname(b.co.name)} ${Math.round(b.co.share*100)}%`:null,b.inv>0?`Investors ${Math.round(b.inv*100)}%${b.inv>=.3?' (board seats)':''}`:null,b.pub?'Publicly traded':null].filter(Boolean).join(' · ')));
  if(!ro&&!b.ousted)s.append(salaryRow(b));
  govBlock(s,b,ro);
  if(ro){s.append(h('p',{className:'sub'},S.jail?"I can't make financial moves from prison.":S.age<18?'A trustee manages the money until I turn 18.':''));return;}
  if(b.ousted){const cost=Math.round(v*b.inv*1.2);s.append(row('Buy out the investors',`Take back control for ${fmt(cost)}`,'',()=>{S.money-=cost;b.own+=b.inv;b.inv=0;b.ousted=false;b.life='delegate';stay(`I bought out the investors and I'm CEO of ${b.name} again.`,'good')},S.money<cost));}
  if(b.cash<Math.max(10000,burn*.5)&&!b.ousted)s.append(h('p',{className:'flash bad'},`⚠️ ${b.name} is low on cash. Put money in, borrow from the bank, draw the credit line, or raise from investors below.`));
  if(!b.ousted){
    s.append(h('h4',{},'Move money'),h('div',{className:'btns'},row(b.own<.999?'💰 Put money in':'💰 Deposit',`${b.own<.999?'Lend it or buy new shares':'Put my cash in'}. I have ${fmt(S.money)}${b.sl&&b.sl.bal?`. It owes me ${fmt(b.sl.bal)}`:''}`,'',()=>moveCash(b,'in'),S.money<=0),row('💵 Withdraw',`Taxed ${Math.round(divTax()*100)}% as a dividend in ${resC().n}. Business has ${fmt(b.cash)}`,'',()=>moveCash(b,'out'),b.cash<=0)));
    // bank
    const lm=bizLoanMax(b),r=loanRate()+.025;
    s.append(h('h4',{},'Bank loan'),
      row('🏦 Borrow from a bank',`Compare ${BANKS.length} banks with different rates, limits and loan lengths${b.loan.bal?`. Current loan: ${fmt(b.loan.bal)} at ${(b.loan.rate*100).toFixed(1)}%${b.loan.bank?` from ${b.loan.bank}`:''}`:''}`,'',()=>bankPicker(b)));
    if(b.loan.bal>0)s.append(row('Repay the loan',`From business cash. Owed ${fmt(b.loan.bal)}`,'',()=>amountModal({title:'Repay the bank loan',sub:`Owed ${fmt(b.loan.bal)}. Business cash ${fmt(b.cash)}.`,max:Math.min(b.loan.bal,b.cash),init:Math.min(b.loan.bal,b.cash),btn:a=>`Repay ${fmt(a)}`,
      onOk:a=>{b.cash-=a;b.loan.bal-=a;if(b.loan.bal<=0){b.loan={bal:0,rate:0,pay:0};stay('I paid off the business loan!','good');}else{b.loan.pay=Math.round(annuity(b.loan.bal,b.loan.rate,b.loan.yrs||LOAN_YEARS));stay(`Repaid ${fmt(a)}. ${fmt(b.loan.bal)} left.`);}}}),b.cash<=0));
    // credit line
    const lim=creditLimit(b),room=Math.max(0,lim-(b.credit||0));
    s.append(h('h4',{},'Credit line'),h('p',{className:'sub'},lim?`${fmt(b.credit||0)} used of ${fmt(lim)}. 10% interest a year. It also covers shortfalls automatically.`:'Opens after 1 year of trading with good credit.'),
      h('div',{className:'btns'},row('Draw','','',()=>amountModal({title:'Draw on the credit line',max:room,init:room/2,btn:a=>`Draw ${fmt(a)}`,onOk:a=>{b.credit=(b.credit||0)+a;b.cash+=a;stay(`Drew ${fmt(a)} from the credit line.`)}}),room<=0),
        row('Repay','','',()=>amountModal({title:'Repay the credit line',max:Math.min(b.credit||0,b.cash),init:Math.min(b.credit||0,b.cash),btn:a=>`Repay ${fmt(a)}`,onOk:a=>{b.cash-=a;b.credit-=a;stay(`Repaid ${fmt(a)} of the credit line.`,'good')}}),!b.credit||b.cash<=0)));
    // investors
    const ii=investorInterest(b);const why=b.pub?'Public companies raise money on the stock market':S.used['raise'+b.id]?'Already pitched this year':ii.score<40?`Interest too low (${ii.score}/100, needs 40)`:energyLeft()<1?'Needs 1 energy (⚡)':b.own<=.15?'I own too little to sell more':null;
    s.append(h('h4',{},'Investors'),row('💸 Raise money from investors',why||'Sell part of the company. The money goes into the business','',()=>{const base=Math.max(v,T.cost);
      amountModal({title:`Raise money for ${b.name}`,sub:`Investors value it at about ${fmt(investorOffer(ii.score,base,0).pre)} before their money.`,max:base*.5,init:base*.2,btn:a=>`Pitch for ${fmt(a)}`,
        note:a=>`They'd want about ${(investorOffer(ii.score,base,a).eq*100).toFixed(1)}% of the company.`,
        onOk:a=>{S.used['raise'+b.id]=true;spend(1);pitch(`Raising for ${b.name}`,sc=>{const fin=Math.round(ii.score*.6+sc*.4);
          if(fin>=45){const o=investorOffer(fin,base,a);const tot=b.own+(b.co?b.co.share:0)+(b.inv||0)||1;const keep=1-o.eq;b.own*=keep;if(b.co)b.co.share*=keep;b.inv=(b.inv||0)*keep+o.eq;b.cash+=a;
            stay(`${b.name} raised ${fmt(a)} for ${(o.eq*100).toFixed(1)}% (overall score ${fin}). I now own ${Math.round(b.own*100)}%.${b.inv>=.3?' Investors now have board seats.':''}`,'good');}
          else stay(`Investors passed. Overall score ${fin}, they needed 45. I can try again next year.`,'bad');});}});},!!why),interestBox(ii));
    // IPO
    if(!b.pub){const need=5e6;s.append(h('h4',{},'Go public'),row('🔔 IPO',v<need?`Needs a company value of ${fmt(need)} (now ${fmt(v)})`:b.yrs<3?`Needs 3 years of trading (now ${b.yrs})`:'Sell 30% of my stake to the public. Shares trade in the Investing tab','',()=>{
      const cashOut=Math.round(v*b.own*.3*1.3);S.money+=cashOut;b.inv+=b.own*.3;b.own*=.7;b.pub={sent:1};b.pub.px=sharePx(b);b.pub.h=[{age:S.age,nw:b.pub.px}];S.fame=Math.min(100,(S.fame||0)+15);unlock('ipo');mile(`Took ${b.name} public`);stay(`${b.name} went public! I cashed out ${fmt(cashOut)}.`,'good')},v<need||b.yrs<3));}
  }
  // exit
  s.append(h('h4',{},'Exit'));
  {const sv=Math.max(v,Math.round(T.cost*.25*b.locs));s.append(row('🤝 Sell my stake',v>0?'Negotiate with a buyer':'Buyers will pay for the equipment and customers','~'+fmt(sv*b.own),()=>negotiate({title:`Selling ${b.name}`,offer:Math.round(sv*b.own*R(80,100)/100),lev:.4+b.rep/200,onDeal:p=>{bizView=null;return sellBiz(b,p);}})));}
  if(!b.ousted)s.append(row('Shut it down','Recover leftover cash, equipment and buildings','',()=>{bizView=null;stay(closeBiz(b,false))}));
}

/* ================= running out of money ================= */
function deficitEvent(b){
  const short=-b.cash;const lm=bizLoanMax(b),room=Math.max(0,creditLimit(b)-(b.credit||0)),ii=investorInterest(b);
  const eq=investorOffer(Math.max(20,ii.score-15),Math.max(bizVal(b),BIZ[b.type].cost*.3),short*1.5).eq;
    // partial help: put in what I can, then choose how to cover the rest
    const part=(what,amt,act)=>[`${what} (${fmt(amt)} of it), then cover the rest`,()=>{act(amt);b.cash+=amt;Q.unshift(deficitEvent(b));return `I put ${fmt(amt)} toward the shortfall. ${fmt(-b.cash)} still to cover.`}];
    const my=Math.max(0,Math.floor(S.money)),lmx=Math.floor(lm/1.2);
    return {text:`${b.name} ran out of money. It's ${fmt(short)} short. How do I keep it alive?`,ch:[
    my>=short?[`Cover it from my cash (${fmt(short)})`,()=>{S.money-=short;b.cash=0;return `I covered the shortfall to keep ${b.name} alive.`}]:my>1000?part('Put in all my cash',my,a=>{S.money-=a;}):[`Cover it from my cash (I only have ${fmt(my)})`,()=>'',()=>true],
    lm>=short*1.2?[`Emergency bank loan (${fmt(short*1.2)})`,()=>{addLoan(b,Math.round(short*1.2),.02);b.cash+=Math.round(short*1.2);return `The bank lent ${fmt(short*1.2)} at a higher rate to keep ${b.name} going.`}]:lmx>1000?part('Borrow the most the bank allows',lmx,a=>{addLoan(b,Math.round(a*1.2),.02);b.cash+=Math.round(a*.2);}):[`Emergency bank loan (the bank said no: ${badCredit()?'my credit is damaged':b.yrs<1?'the business is too new':b.lastPre<0?'it lost money':'too much debt already'})`,()=>'',()=>true],
    room>=short?[`Draw the credit line (${fmt(short)})`,()=>{b.credit=(b.credit||0)+short;b.cash=0;return 'I drew on the credit line to cover it.'}]:room>1000?part('Use the rest of the credit line',Math.floor(room),a=>{b.credit=(b.credit||0)+a;}):[`Draw the credit line (already used up)`,()=>'',()=>true],
    [`Rescue investor: ${fmt(short*1.5)} for ${(eq*100).toFixed(0)}%`,()=>{const keep=1-eq;b.own*=keep;if(b.co)b.co.share*=keep;b.inv=(b.inv||0)*keep+eq;b.cash+=Math.round(short*1.5);return `A rescue investor put in ${fmt(short*1.5)} for ${(eq*100).toFixed(0)}% of ${b.name}.`},()=>ii.score<30||b.pub||b.own<.2],
    [`Sell it for whatever I can get`,()=>{const p=Math.round(Math.max(0,BIZ[b.type].cost*.15*b.locs-b.loan.bal)*b.own);return sellBiz(b,p);}],
    ['Let it go under',()=>closeBiz(b,true)]]};
}

/* ================= spending-power note for costly actions ================= */
const powerNote=b=>h('p',{className:'sub'},`Spending power: ${fmt(Math.max(0,b.cash))} business cash + ${fmt(Math.max(0,S.money))} my cash. `,
  h('button',{className:'back',style:'display:inline;margin:0',on:()=>{bTab='fin';flash=null;drawSheet(true)}},'Need more? Finance ›'));

/* ================= owner salary ================= */
function salaryRow(b){
  const mk=marketSalary(b),mx=maxSalary(b),cur=b.salary||0;
  const zone=a=>a===0?'No salary. All profit stays in the business.':a<mk*.6?'Modest. Leaves more cash in the business.':a<=mk*1.15?'Fair for a business this size.':'Above market. Co-founders and investors will grumble, and the board may act if it lasts.';
  return row('💼 My salary',cur?`${fmt(cur)}/yr (${fmt(netPay(cur))} after ${resC().n} income tax). ${zone(cur).split('.')[0]}.`:`Not paying myself. Fair pay for my role here is about ${fmt(mk)}/yr`,cur?fmt(cur):'',()=>{
    amountModal({title:`My salary from ${b.name}`,sub:`Fair pay for my role (${{hands:'hands-on',delegate:'delegating',absent:'hands-off'}[b.life]}) at a business with about ${fmt(b.yrs?b.lastRev:Tof(b).base*b.locs)} in yearly sales is around ${fmt(mk)}. The most I can justify is ${fmt(mx)}.`,
      min:0,max:mx,init:cur||mk,step:1000,btn:a=>a?`Pay myself ${fmt(a)}/yr`:'Stop paying myself',
      note:a=>`${zone(a)} Paid each year as a business expense, taxed as income in ${resC().n}: I'd get ${fmt(netPay(a))}.${b.lastPre&&a>cur?` Profit would drop to about ${fmt(b.lastPre-(a-cur))}.`:''}`,
      onOk:a=>{b.salary=a;stay(a?`I set my salary at ${b.name} to ${fmt(a)} a year.`:`I stopped paying myself from ${b.name}.`)}});
  });
}
/* ================= boot ================= */
// Warn once a year before aging up if a business has nothing to sell.
function emptyBiz(){return S.alive&&!S.used.emptyOk?S.biz.find(b=>isGoods(b)&&!b.ousted&&b.products&&!b.products.length):null;}
function unrunBiz(){return S.alive&&!S.used.unrunOk&&canManage()?S.biz.find(b=>!b.ousted&&runBy(b)==='none'):null;}
$('statsWrap').onclick=()=>{if(S)charSheet();};$('statsWrap').onkeydown=e=>{if(e.key==='Enter'&&S)charSheet();};
$('bAge').onclick=()=>{if(modalOpen())return;if(!S.alive)return showDeath();
  const u=!emptyBiz()&&unrunBiz();
  if(u)return choiceModal(`${Tof(u).ic} Nobody runs ${u.name}`,'Without me or a CEO in charge, quality and reputation slip every year.',[
    ['Choose who runs it',()=>{mTab='biz';bizView=u.id;bTab='people';openSheet(drawMoney);}],
    ['Age up anyway',()=>{S.used.unrunOk=true;ageUp();}]]);
  const b=emptyBiz();if(!b)return ageUp();
  const loss=Math.round(b.staff*wagePer(b)+(Tof(b).fixed*.5*b.locs+Tof(b).fixed*.5*Math.max(0,b.locs-b.prem)*b.rentMult)*cty(b).rent);
  choiceModal(`${Tof(b).ic} ${b.name} has nothing to sell`,`With no ${isSvc(b)?'services':'products'}, it will still pay staff and rent and lose about ${fmt(loss)} this year.`,[
    [`Add a ${isSvc(b)?'service':'product'} first`,()=>{mTab='biz';bizView=b.id;bTab='prod';openSheet(drawMoney);}],
    ['Age up anyway',()=>{S.used.emptyOk=true;ageUp();}]]);};
$('bUndo').onclick=()=>{
  if(!canUndo())return;
  if(modalOpen()){toast('Answer the decision on screen first.');return;}
  const back=undoSnap.age;
  choiceModal('Undo this year?',`This rewinds everything back to age ${back}: money, businesses, relationships, all of it. The year will play out differently.`,[
    [`Go back to age ${back}`,doUndo],['Stay here',()=>{}]]);
};
$('bJob').onclick=jobSheet;$('bMoney').onclick=moneySheet;$('bRel').onclick=relSheet;$('bAct').onclick=actSheet;$('bMenu').onclick=menuSheet;
bootLoad();
</script>

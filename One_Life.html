<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EFF6; --card:#FFFFFF; --ink:#1B2540; --muted:#5B6782; --line:#D3DCE8;
  --sun:#F2B705; --sunInk:#3A2A00; --happy:#E0507A; --health:#2E9E6A; --smarts:#3A6FD8; --looks:#9255C9;
  --bad:#C8372D; --good:#23845A; --ai:#7A5AF8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#111726; --card:#1A2236; --ink:#E7ECF5; --muted:#95A2BC; --line:#2A3551; --bad:#F06B60; --good:#4CC98E; --ai:#A78BFA; }
}
:root[data-theme="dark"]{ --paper:#111726; --card:#1A2236; --ink:#E7ECF5; --muted:#95A2BC; --line:#2A3551; --bad:#F06B60; --good:#4CC98E; --ai:#A78BFA; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--smarts);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{padding:12px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who{min-width:0}
.who h1{font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:1.4rem;margin:0;line-height:1.1}
.who p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:.75rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.side{display:flex;align-items:flex-start;gap:8px}
.cash{text-align:right}
.cash b{font-family:Fredoka,system-ui,sans-serif;font-size:1.2rem;display:block}
.cash span{color:var(--muted);font-size:.8rem;display:block}
.energy{font-size:.8rem;color:var(--muted);letter-spacing:1px;margin-top:2px}
.menu{background:var(--card);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;font-size:1.1rem}
.logwrap{flex:1;position:relative;min-height:0}
.log{height:100%;overflow-y:auto;padding:4px 18px 56px}
.yr{margin:0 0 14px}
.yr h2{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:.95rem;margin:0 0 4px;color:var(--smarts)}
.yr p{margin:0 0 3px;line-height:1.45}
.good{color:var(--good)} .bad{color:var(--bad)} .ai{color:var(--ai)}
.skip{position:absolute;right:14px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.85rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.skip:disabled{opacity:.5}
.stats{cursor:pointer;padding:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;background:var(--card);border-top:1px solid var(--line);position:relative}
.stat{display:grid;grid-template-columns:5.2em 1fr 2.2em;align-items:center;gap:8px;font-size:.82rem}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s ease}
.stat em{font-style:normal;text-align:right;color:var(--muted)}
#pops{position:absolute;left:0;right:0;bottom:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px 8px;pointer-events:none}
.pop{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);animation:pop 1.8s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
nav{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;align-items:end;background:var(--card);padding:6px 8px 10px;border-top:1px solid var(--line)}
nav button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
nav button .ic{font-size:1.35rem;line-height:1}
.age{justify-self:center;width:76px;height:76px;margin-top:-34px;border-radius:50%;background:var(--sun);color:var(--sunInk)!important;border:5px solid var(--card)!important;box-shadow:0 4px 0 #C99400;font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:1rem!important;justify-content:center}
.age:active{transform:translateY(3px);box-shadow:0 1px 0 #C99400}
.age .plus{font-size:1.5rem;line-height:.9}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
#modalWrap{z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:Fredoka,system-ui,sans-serif;font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.9rem;line-height:1.4}
.sheet h4{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:1rem;margin:18px 0 8px;color:var(--muted)}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--paper);border:0;border-radius:14px;padding:12px 14px;margin:0 0 8px}
.row.compact{padding:8px 12px;margin:0 0 6px;font-size:.92rem}
.row:disabled{opacity:.45;cursor:default}
.row b{display:block;font-weight:700}
.row small{color:var(--muted);display:block}
.row .r{font-family:Fredoka,system-ui,sans-serif;white-space:nowrap;text-align:right}
.row .r small{font-family:Nunito,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .row{flex-direction:column;align-items:flex-start;margin:0;min-height:74px;gap:2px}
.close{margin-top:10px;width:100%;background:none;border:2px solid var(--line);border-radius:14px;padding:10px}
.back{background:none;border:0;color:var(--smarts);padding:0;margin:0 0 8px;font-weight:700}
.relbar{height:6px;width:70px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.relbar i{display:block;height:100%;background:var(--happy)}
.modal{align-items:center}
.modal .sheet{border-radius:22px;margin:0 14px calc(18px + env(safe-area-inset-bottom,0px))}
.event-text{font-size:1.1rem;line-height:1.5;margin:0 0 16px}
.choice{width:100%;background:var(--sun);color:var(--sunInk);border:0;border-radius:14px;padding:12px;margin:0 0 8px;font-weight:700}
.choice.alt{background:var(--paper);color:var(--ink)}
.choice.trait{background:var(--paper);color:var(--ink);border:2px dashed var(--looks)}
.choice:disabled{opacity:.4;cursor:default}
.ribbon{display:inline-block;background:var(--sun);color:var(--sunInk);font-family:Fredoka,system-ui,sans-serif;font-weight:700;padding:8px 18px;border-radius:999px;margin:6px 0 14px}
.obit{font-family:Georgia,"Times New Roman",serif;font-size:1rem;line-height:1.6;margin:0 0 14px;white-space:pre-wrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px}
dt{color:var(--muted)} dd{margin:0;font-weight:700;text-align:right}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.slider{width:100%;accent-color:var(--sun);margin:6px 0 10px;height:32px}
.amt{width:100%;font:inherit;font-size:1.15rem;font-weight:700;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:0 0 10px}
.amt.compact{font-size:1.05rem;padding:8px 12px;margin:0 0 8px}
.tabs button{flex:0 0 auto;border:0;background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{font-size:.82rem;color:var(--muted);margin:0 0 4px;font-weight:700}
.flash{background:var(--paper);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.92rem;line-height:1.4}
.econ{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--paper);font-weight:700;font-size:.85rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.btns .row{margin:0;justify-content:center;text-align:center;font-weight:700}
.btns .row.compact{padding:8px 10px}
.chart{width:100%;height:auto;display:block;margin:0 0 14px}
.chart text{font-size:10px;fill:var(--muted);font-family:Nunito,system-ui,sans-serif}
.review li{margin:0 0 4px;line-height:1.4}
.review ul{padding-left:20px;margin:0 0 14px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--card);border-radius:14px;padding:10px 14px;font-weight:700;font-size:.92rem;animation:toast 3.2s ease forwards;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle .sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.toggle.compact .sw{width:40px;height:24px}
.toggle.compact .sw::after{width:18px;height:18px}
.toggle.compact[aria-pressed="true"] .sw::after{left:19px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:var(--paper);border-radius:12px;padding:10px;font-size:.85rem}
.ach b{display:block;font-size:.9rem}
.ach.locked{opacity:.45}
.warn{color:var(--bad);font-weight:700}
.supcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 8px;display:flex;flex-direction:column;gap:4px}
.supcard.new{border:2px solid var(--sun)}
.suphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.supprice{margin:0;font-family:Fredoka,system-ui,sans-serif;font-size:1.15rem;font-variant-numeric:tabular-nums}
.supprice small{font-family:Nunito,system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
.supbar{display:grid;grid-template-columns:7.4em 1fr 2em;align-items:center;gap:8px;font-size:.82rem}
.supbar em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.pick{background:var(--sun);color:var(--sunInk);border-color:var(--sun);font-weight:700}
button.chip{font:inherit;font-size:.75rem;cursor:pointer}
.chip.good{color:var(--good);border-color:var(--good)} .chip.bad{color:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion: reduce){ .bar i,.toggle .sw::after{transition:none} .pop,.toast{animation-duration:.01s;animation-delay:1.5s} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="who"><h1 id="nm"></h1><p id="meta"></p><div class="chips" id="traits"></div></div>
    <div class="side">
      <div class="cash"><b id="money"></b><span>Cash</span><div class="energy" id="energy"></div></div>
      <button class="menu" id="bMenu" aria-label="Menu">☰</button>
    </div>
  </header>
  <div class="logwrap"><div class="log" id="log" aria-live="polite"></div><button class="skip" id="bUndo" title="Go back one year">↩ Undo year</button></div>
  <div class="stats" id="statsWrap" role="button" tabindex="0" aria-label="Open my character stats" title="Tap for all my stats"><div id="pops" aria-hidden="true"></div><div id="stats" style="display:contents"></div></div>
  <nav>
    <button id="bJob"><span class="ic">💼</span>Work</button>
    <button id="bMoney"><span class="ic">💰</span>Money</button>
    <button id="bAge" class="age" aria-label="Age up one year"><span class="plus">+</span>Age</button>
    <button id="bRel"><span class="ic">❤️</span>People</button>
    <button id="bAct"><span class="ic">🎯</span>Activities</button>
  </nav>
</div>
<div class="scrim" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div class="scrim modal" id="modalWrap"><div class="sheet" id="modal"></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* ================= helpers ================= */
/* Replay dice: every game roll comes from rnd(). Each life has a life code (S.seed) and the dice
   position (S.rng) is saved with it, so the same life code plus the same choices gives the same life.
   Math.random() is only used to make new life codes and for the AI storyteller's roll. */
let RS=1;
function rnd(){RS=(RS+0x6D2B79F5)|0;let t=RS;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}
const newSeed=()=>100000+Math.floor(Math.random()*900000);
const R=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
const uid=()=>rnd().toString(36).slice(2,9);
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const $=id=>document.getElementById(id);
function h(tag,props={},...kids){const e=document.createElement(tag);for(const k in props){const v=props[k];if(k==='on')e.onclick=v;else if(k==='style')e.setAttribute('style',v);else if(k in e)e[k]=v;else e.setAttribute(k,v);}kids.flat().forEach(c=>c!=null&&c!==false&&e.append(c));return e;}
function wpick(arr,w){const tot=arr.reduce((a,x)=>a+w(x),0);let r=rnd()*tot;for(const x of arr){r-=w(x);if(r<=0)return x;}return arr[arr.length-1];}

/* ================= data ================= */
const FM=['Liam','Noah','Mateo','Kai','Theo','Ezra','Omar','Ravi','Jonah','Felix','Marcus','Diego','Sam','Hugo','Arlo','Tobias','Kofi','Luca','Bram','Idris'];
const FF=['Ava','Maya','Isla','Zara','Nora','Leah','Priya','Chloe','Ruby','Ines','Hana','Sofia','Amara','Iris','Lena','June','Tessa','Mila','Wren','Esme'];
const LAST=['Carter','Nguyen','Okafor','Silva','Brennan','Patel','Lindqvist','Moreau','Hayes','Kowalski','Mendez','Ito','Walsh','Adeyemi','Fischer','Rossi','Kim','Bishop','Varga','Quinn'];
/* ================= COUNTRIES ================= */
// pp: price level & spending power, wage/rent: cost levels, corp:[small rate, main rate, small-profit threshold], div: dividend tax,
// inc: income tax brackets [from, rate], rate: loan-rate add-on, vol: economic swings, grow: demand growth, red: red tape,
// corrupt: bribery risk, union: union strength, pop: market depth (slows outlet saturation)
const COUNTRIES={
 us:{n:'USA',ic:'🇺🇸',cities:['Austin','Portland','Chicago'],pp:1,wage:1,rent:1,corp:[.21,.21,0],div:.15,inc:[[0,.1],[11000,.22],[95000,.24],[180000,.32],[400000,.37]],rate:0,vol:1,grow:1,red:.9,corrupt:.05,union:.7,pop:1.2},
 uk:{n:'UK',ic:'🇬🇧',cities:['Leeds','Glasgow','London'],pp:.95,wage:.9,rent:1.05,corp:[.19,.25,50000],div:.25,inc:[[0,0],[15900,.2],[63500,.4],[158800,.45]],rate:.005,vol:1,grow:.8,red:.8,corrupt:.03,union:1,pop:1},
 ca:{n:'Canada',ic:'🇨🇦',cities:['Toronto','Vancouver'],pp:.9,wage:.85,rent:.95,corp:[.12,.26,500000],div:.25,inc:[[0,.2],[40000,.27],[81000,.33],[125000,.38],[180000,.43]],rate:0,vol:.9,grow:.9,red:.8,corrupt:.03,union:1.1,pop:.9},
 au:{n:'Australia',ic:'🇦🇺',cities:['Melbourne','Sydney'],pp:1,wage:1.1,rent:1.1,corp:[.25,.3,5000000],div:.3,inc:[[0,0],[11700,.18],[29300,.32],[88000,.39],[123500,.47]],rate:.01,vol:.8,grow:1,red:.8,corrupt:.03,union:1.1,pop:.9},
 nz:{n:'New Zealand',ic:'🇳🇿',cities:['Auckland','Wellington'],pp:.9,wage:.85,rent:1,corp:[.28,.28,0],div:.2,inc:[[0,.105],[6000,.175],[19000,.3],[30000,.33],[66000,.39]],rate:.01,vol:.9,grow:.8,red:.6,corrupt:.02,union:.9,pop:.5},
 ie:{n:'Ireland',ic:'🇮🇪',cities:['Dublin','Cork'],pp:1,wage:.95,rent:1.2,corp:[.125,.125,0],div:.4,inc:[[0,.2],[45000,.4]],rate:0,vol:1.1,grow:1.2,red:.7,corrupt:.03,union:.9,pop:.6},
 de:{n:'Germany',ic:'🇩🇪',cities:['Berlin','Munich'],pp:.95,wage:1,rent:.95,corp:[.3,.3,0],div:.26,inc:[[0,0],[11000,.24],[60000,.42],[270000,.45]],rate:-.02,vol:.8,grow:.7,red:1.3,corrupt:.02,union:1.4,pop:1},
 ch:{n:'Switzerland',ic:'🇨🇭',cities:['Zurich','Geneva'],pp:1.5,wage:1.4,rent:1.35,corp:[.14,.14,0],div:.2,inc:[[0,.1],[50000,.2],[150000,.35]],rate:-.04,vol:.6,grow:.8,red:.9,corrupt:.01,union:.7,pop:.5},
 ae:{n:'UAE',ic:'🇦🇪',cities:['Dubai','Abu Dhabi'],pp:1.1,wage:.9,rent:1.3,corp:[0,.09,100000],div:0,inc:[[0,0]],rate:.005,vol:1.1,grow:1.3,red:.7,corrupt:.15,union:.1,pop:.6},
 ng:{n:'Nigeria',ic:'🇳🇬',cities:['Lagos','Abuja'],pp:.35,wage:.25,rent:.45,corp:[0,.3,60000],div:.1,inc:[[0,.07],[5000,.15],[15000,.19],[30000,.21],[60000,.24]],rate:.12,vol:1.8,grow:1.3,red:1.4,corrupt:.5,union:.6,pop:1.3},
 za:{n:'South Africa',ic:'🇿🇦',cities:['Cape Town','Johannesburg'],pp:.55,wage:.45,rent:.6,corp:[.27,.27,0],div:.2,inc:[[0,.18],[15000,.26],[25000,.31],[35000,.36],[50000,.41],[100000,.45]],rate:.06,vol:1.4,grow:.6,red:1.1,corrupt:.3,union:1.3,pop:.9},
 in:{n:'India',ic:'🇮🇳',cities:['Mumbai','Bengaluru'],pp:.3,wage:.2,rent:.35,corp:[.25,.25,0],div:.3,inc:[[0,0],[4000,.05],[8000,.1],[12000,.15],[16000,.2],[20000,.3]],rate:.05,vol:1.3,grow:1.6,red:1.5,corrupt:.35,union:.8,pop:1.5},
 jp:{n:'Japan',ic:'🇯🇵',cities:['Tokyo','Osaka'],pp:.9,wage:.8,rent:.9,corp:[.3,.3,0],div:.2,inc:[[0,.05],[13000,.1],[22000,.2],[45000,.23],[60000,.33],[120000,.4],[280000,.45]],rate:-.045,vol:.8,grow:.5,red:1.2,corrupt:.02,union:.8,pop:1.3},
 sg:{n:'Singapore',ic:'🇸🇬',cities:['Singapore'],pp:1.2,wage:1.1,rent:1.5,corp:[.085,.17,150000],div:0,inc:[[0,0],[15000,.02],[30000,.07],[60000,.115],[90000,.15],[120000,.18],[180000,.22],[250000,.24]],rate:0,vol:1,grow:1.1,red:.5,corrupt:.01,union:.2,pop:.7},
 my:{n:'Malaysia',ic:'🇲🇾',cities:['Kuala Lumpur','Penang'],pp:.45,wage:.35,rent:.45,corp:[.17,.24,130000],div:.02,inc:[[0,0],[1100,.03],[8000,.08],[11000,.13],[15000,.21],[22000,.245],[130000,.26],[440000,.28],[670000,.3]],rate:-.015,vol:1.1,grow:1.3,red:.9,corrupt:.2,union:.5,pop:.8},

function takeRole(o){
  const P=ACT_PROJECTS[o.k],q=actQuality(),flopChance=Math.max(.03,P.risk*(1-q/150));
  S.act.workedThisYear=true;S.act.inactive=0;S.used.actOffers=true;
  let pay=o.pay,rep=R(P.rep[0],P.rep[1]),outcome='normal',msg;
  if(rnd()<flopChance){pay=Math.round(pay*.4);rep=-Math.round(rep*.6);outcome='flop';
    msg=`${P.n} flopped. Reviews were rough. I still got paid ${fmt(pay)}, but it dented my reputation.`;}
  else if(q>=65&&rnd()<.25){pay=Math.round(pay*1.6);rep=Math.round(rep*1.8);outcome='hit';
    msg=`${P.n} was a hit! Paid ${fmt(pay)} and my reputation jumped.`;
    S.act.films.push({n:filmName(),k:o.k,age:S.age,hit:true,eligible:o.k!=='ad'});socBoost(.06,'📱 The hit film brought me new followers.');}
  else{msg=`Wrapped a ${P.n.toLowerCase()}. Paid ${fmt(pay)}.`;
    S.act.films.push({n:filmName(),k:o.k,age:S.age,hit:false,eligible:o.k!=='ad'});}
  S.money+=netStack(Math.round(pay*.8));S.act.rep=clamp(S.act.rep+rep);S.fame=Math.min(100,(S.fame||0)+Math.round(rep/4));

/* ================= economy & markets ================= */
/* S.econ is the world economy: it drives the global markets (stocks, crypto, bonds) and supplier prices.
   S.cecon holds each country's own economy: jobs, loans, home prices and business sales follow it. */
const initCecon=ph=>{const o={};Object.keys(COUNTRIES).forEach(k=>o[k]={phase:ph||'normal',yrs:0});return o;};
const phaseOf=k=>((S.cecon&&S.cecon[k])||S.econ).phase;
const localPhase=()=>phaseOf(resKey());
const bizPhase=b=>phaseOf(b.cty&&COUNTRIES[b.cty]?b.cty:resKey());
// Each country moves on its own, but tends to follow the world when the world economy turns.
function countryEconYear(glob,globTurned){
  S.cecon=S.cecon||initCecon(glob);
  const mine=resKey();
  Object.entries(COUNTRIES).forEach(([k,c])=>{const e=S.cecon[k]=S.cecon[k]||{phase:glob,yrs:0},old=e.phase;
    const follow=globTurned?.5:glob==='crash'?.3:.08;
    if(rnd()<follow)e.phase=glob;
    else{const x=rnd(),v=c.vol,g=c.grow;
      if(old==='normal')e.phase=x<.13*g?'boom':x<.13*g+.11*v?'recession':'normal';
      else if(old==='boom')e.phase=x<.1*v?'crash':x<.1*v+.35?'normal':'boom';
      else if(old==='recession')e.phase=x<.4?'normal':x<.4+.08*v?'crash':'recession';
      else e.phase=x<.6?'recession':'normal';}
    e.yrs=e.phase===old?e.yrs+1:0;
    if(k===mine&&e.phase!==old&&S.age>=16){const msg={boom:'is booming.',normal:'has settled back to normal.',recession:'fell into a recession.',crash:'crashed into a deep slump.'}[e.phase];
      line(`${c.ic} ${c.n}'s economy ${msg}`,e.phase==='boom'||e.phase==='normal'?'good':'bad');}
  });
}
function econYear(){
  const e=S.econ,old=e.phase,x=rnd();
  if(old==='normal')e.phase=x<.15?'boom':x<.27?'recession':'normal';
  else if(old==='boom')e.phase=x<.15?'crash':x<.5?'normal':'boom';
  else if(old==='recession')e.phase=x<.4?'normal':x<.5?'crash':'recession';
  else e.phase=x<.6?'recession':'normal';
  e.yrs=e.phase===old?e.yrs+1:0;
  if(e.phase!==old&&S.age>=16){const msg={boom:'World markets are booming.',normal:'World markets have settled back to normal.',recession:'World markets fell into a slump.',crash:'The global stock market crashed!'}[e.phase];line(`🌍 ${msg}`,e.phase==='boom'||e.phase==='normal'?'good':'bad');}
  countryEconYear(e.phase,e.phase!==old);
  const [mu,sd]=PHASE[e.phase].m;const mret=mu+gauss()*sd;
  const infl=Math.max(0,PHASE[e.phase].inf+gauss()*.6);S.cpi=(S.cpi||1)*(1+infl/100);S.infl=infl;
  TICK.forEach(t=>{const q=S.mkt[t.s];let r;
    if(t.fixed!=null)r=t.s==='BOND'?infl+1.5+({boom:-2,normal:0,recession:1,crash:3}[e.phase]||0):t.s==='SAVE'?Math.max(.2,infl-.8):t.fixed;
    else if(t.crypto){const y=rnd();r=y<.3?-50+gauss()*12:y<.65?-5+gauss()*20:y<.9?45+gauss()*20:130+gauss()*50;if(e.phase==='crash')r-=30;}
    else if(t.meme){const y=rnd();r=y<.1?-99:y<.65?-70+gauss()*10:y<.9?30+gauss()*20:y<.985?200+gauss()*60:1200;}
    else if(t.penny){r=gauss()*70;}
    else r=t.drift+t.beta*mret+gauss()*t.sd;
    if(S.tip===t.s){r=150+gauss()*30;const own=(S.hold[t.s]||0)*q.p;if(own>0){line(`${t.n} shares rocketed ${Math.round(r)}% this year. That tip was real!`,'good');if(mem('tipVLTR')&&t.s==='VLTR')unlock('timetravel');}}
    r=Math.max(-100,r);q.chg=r;q.p=q.p*(1+r/100);q.h=q.h||[];q.h.push({age:S.age,nw:q.p});if(q.h.length>40)q.h.shift();
    if(q.p<t.start*1e-6)q.p=t.start*1e-6;
  });
  bankruptcyYear(e);
  S.tip=null;
  marketEvents(e);
  S.ret.bal=Math.round(S.ret.bal*(1+(S.mkt.MKT.chg+1.5)/100));
  const hr=PHASE[localPhase()].home+gauss()*3;S.homeIdx*=1+hr/100;
  S.assets.forEach(a=>{if(a.k==='car'){a.v=Math.round(a.v*.88);a.age=(a.age||0)+1;}else a.v=Math.round(a.v*(1+(hr+hArea(a).g+gauss()*2)/100));});
}

/* ---- bankruptcy and delisting ---- */
function bankruptcyRisk(t){
  if(t.fixed!=null||t.s==='MKT'||t.crypto||t.meme)return null;
  if(t.penny)return{chance:.08,thresh:.5};
  if(t.blue)return{chance:.005,thresh:.25,crashOnly:true};
  if(TICK.indexOf(t)>=BASE_TICK_LEN)return{chance:.05,thresh:.4};
  return{chance:.02,thresh:.3};
}
function bankruptcyYear(e){
  const inCrash=e.phase==='crash';
  TICK.forEach(t=>{
    const risk=bankruptcyRisk(t);if(!risk)return;
    const q=S.mkt[t.s];
    if(q.warn){
      const recovered=rnd()<(q.bailout?.5:.3);
      if(recovered){
        const bounce=Math.max(20,50+gauss()*40);q.p*=1+bounce/100;q.chg=(q.chg||0)+bounce;
        line(`📈 ${t.n} avoided bankruptcy and is recovering.`,'good');
      }else{
        const held=S.hold[t.s]||0,heldVal=held*q.p,lossVal=held*(S.basis[t.s]||0);
        if(held>0){
          line(`🧾 ${t.n} went bankrupt and was delisted. My shares are now worthless.`,'bad');
          if(lossVal>=50000)unlock('wiped');
        }
        S.hold[t.s]=0;S.basis[t.s]=0;
        const shorts=(S.shorts||[]).filter(sh=>sh.s===t.s);
        if(shorts.length){shorts.forEach(sh=>{const win=sh.col+sh.entryP*sh.shares;S.money+=win;});
          S.shorts=(S.shorts||[]).filter(sh=>sh.s!==t.s);
          line(`💰 My short position on ${t.n} paid off big when it went bankrupt.`,'good');}
        q.p=t.start;q.h=[];q.delisted=(q.delisted||0)+1;
      }
      q.warn=false;q.bailout=false;
    }else{
      if(risk.crashOnly&&!inCrash)return;
      const pct=q.p/t.start;
      if(pct>=risk.thresh)return;
      let chance=risk.chance;if(inCrash&&!risk.crashOnly)chance*=2;
      if(rnd()<chance){
        q.warn=true;
        const drop=60+rnd()*20;q.p*=1-drop/100;q.chg=(q.chg||0)-drop;
        line(`⚠️ ${t.n} is in serious financial trouble -- the stock cratered ${Math.round(drop)}%. It may go bankrupt next year.`,'bad');
        if(stakeOf(t)>=.10&&S.money>=1000){
          const bailCost=Math.round(Math.min(S.money*.3,(S.hold[t.s]||0)*q.p*.15));
          Q.push({text:`As a major shareholder of ${t.n}, I'm being asked to back an emergency bailout to keep the company alive. It would cost ${fmt(bailCost)}.`,
            ch:[['Fund the bailout',()=>{S.money-=bailCost;S.mkt[t.s].bailout=true;return `I put up ${fmt(bailCost)} to back the bailout. It might buy the company time.`}],
                ['Let it ride',()=>{return `I decided not to fund the bailout. ${t.n}'s fate is out of my hands.`}]]});
        }
      }
    }
  });
}
/* ---- market events: splits, mergers, bubbles ---- */
const MKT_NAMES=['Apex Dynamics','Solara Energy','Cascade Health','Pinnacle AI','Stratos Aero','Cobalt Mining','Prism Media','Zenith Labs'];
function marketEvents(e){
  if(S.age<18)return;
  /* stock splits: a stock that doubled+ in price can split 2:1 */
  TICK.forEach(t=>{if(t.fixed!=null||t.penny||t.crypto||t.meme)return;
    const q=S.mkt[t.s];if(q.p>=t.start*2.5&&rnd()<.15&&!t._splitCd){
      const sh=S.hold[t.s]||0;S.hold[t.s]=sh*2;q.p/=2;q.h=(q.h||[]).map(x=>({age:x.age,nw:x.nw/2}));
      t._splitCd=3;
      if(sh>0)line(`📊 ${t.n} did a 2-for-1 stock split! I now hold ${fmtN(sh*2)} shares at ${fmtP(q.p)} each.`,'good');
      else line(`📊 ${t.n} announced a 2-for-1 stock split.`);
      q.p*=1.05;q.chg=(q.chg||0)+5; /* splits are usually bullish */
    }
    if(t._splitCd>0)t._splitCd--;
  });
  /* sector bubble: one random non-fixed ticker gets a multi-year run */
  if(!S.bubble&&rnd()<.06&&e.phase!=='crash'){
    const cands=TICK.filter(t=>!t.fixed&&!t.penny&&!t.meme&&t.k!=='Savings'&&t.k!=='Bonds');
    if(cands.length){const t=pick(cands);S.bubble={s:t.s,yrs:0,dur:R(2,4)};
      line(`📰 Analysts say ${t.n} is entering a hot streak.`);}
  }
  if(S.bubble){const b=S.bubble,q=S.mkt[b.s];b.yrs++;
    if(b.yrs<=b.dur){q.p*=1+(15+gauss()*8)/100;q.chg=(q.chg||0)+15;
      if(b.yrs===1)line(`🔥 ${TICK.find(t=>t.s===b.s).n} is in a bubble -- prices keep climbing.`);
    }else{
      /* bubble pops */
      const drop=-(30+Math.abs(gauss()*15));q.p*=1+drop/100;q.chg=(q.chg||0)+drop;
      const t=TICK.find(x=>x.s===b.s);
      if((S.hold[b.s]||0)>0)line(`💥 The ${t.n} bubble popped! The price crashed ${Math.abs(Math.round(drop))}%.`,'bad');
      else line(`💥 The ${t.n} bubble popped.`);
      S.bubble=null;
    }
  }
  /* IPO: new company goes public */
  if(rnd()<.12&&e.phase!=='crash'){
    const t=nextIpoTicker();
    if(t){const pop=R(-10,50);const ipoP=t.start;S.mkt[t.s].p=ipoP*(1+pop/100);S.mkt[t.s].chg=pop;
      line(`🔔 ${t.n} went public at ${fmtP(ipoP)} and ${pop>=0?'jumped':'fell'} ${Math.abs(pop)}% on day one.${pop>=20?' Hot IPO!':''}`,pop>=0?'good':'bad');
      if(S.money>=1000)ipoAlloc(t,ipoP);
    }
  }
  /* merger: very rare, one stock absorbs a target at a premium (queued as event) */
  if(rnd()<.03&&e.phase==='boom'){
    const stocks=TICK.filter(t=>t.k==='Stock'&&!t.penny);
    if(stocks.length>=2){
      const buyer=pick(stocks),tgt=pick(stocks.filter(t=>t.s!==buyer.s));
      const prem=R(15,40);const qT=S.mkt[tgt.s],sh=S.hold[tgt.s]||0;
      const newP=qT.p*(1+prem/100);
      if(sh>0){
        const payout=Math.round(sh*newP);S.money+=payout;S.hold[tgt.s]=0;S.basis[tgt.s]=0;
        line(`🤝 ${buyer.n} acquired ${tgt.n} at a ${prem}% premium! My shares converted to ${fmt(payout)} cash.`,'good');
      }else line(`🤝 ${buyer.n} acquired ${tgt.n} at a ${prem}% premium.`);
      /* target price resets after merger */
      qT.p=tgt.start;qT.chg=0;qT.h=[];
      /* buyer gets a small boost */
      S.mkt[buyer.s].p*=1.08;
    }
  }
}

  if(S.sloan>0){S.sloan=Math.round(S.sloan*1.055);if(S.job){const p=Math.min(S.sloan,Math.round(S.job.s*.1));S.sloan-=p;S.money-=p;if(S.sloan===0)line('I paid off my student loans!','good');}}
  if(S.flags.talentPay&&!S.jail&&S.age<70){S.money+=S.flags.talentPay;}

  if(S.age<18&&S.money<0){homes().sort((a,b)=>a.v-b.v).forEach(a=>{if(S.money<0){S.money+=saleVal(a)-(a.mort?a.mort.bal:0);S.assets=S.assets.filter(x=>x!==a);line(`My trustee sold the ${a.n.toLowerCase()} to cover costs.`,'bad');}});if(S.money<0)S.money=0;}
  if(S.age>=18&&S.age<22&&S.money<-2000&&living(['Mother','Father']).length){const x=-S.money,pr0=living(['Mother','Father'])[0];S.money=0;pr0.rel=Math.max(0,pr0.rel-4);line(`My parents helped me clear ${fmt(x)} of debt.`);}
  if(S.money<0&&S.age>=18){S.money=Math.round(S.money*(1+cardApr()));S.st.happy-=3;

/* Buy land, rezone it, build a commercial property, then lease it out or sell it.
   S.dev holds every parcel. d.st runs land, rezone, build, done. Equity (sale value minus loan) counts in net worth. */
const LAND_PSM=380;
const DEV_TYPES={
  warehouse:{n:'Warehouse park',ic:'🏭',psm:1250,rent:165,yrs:1,cap:.072,risk:.04},
  retail:{n:'Retail strip',ic:'🏬',psm:2300,rent:300,yrs:1,cap:.071,risk:.08},
  office:{n:'Office block',ic:'🏢',psm:3300,rent:385,yrs:2,cap:.065,risk:.10},
  mixed:{n:'Mixed-use tower',ic:'🏙️',psm:4500,rent:480,yrs:3,cap:.058,risk:.14}};

const DEV_AREA={city:1.2,suburb:1,out:.85};
const DEV_NAMES=['Harbour Plot','Junction Lot','Old Mill Site','Ridge Parcel','Market Square Lot','Airport Road Plot','Canal Yard','Station Parcel'];
const DEV_PH={boom:{r:1.08,c:-.004,t:.96},normal:{r:1,c:0,t:.92},recession:{r:.93,c:.004,t:.85},crash:{r:.82,c:.009,t:.72}};
const devPh=()=>DEV_PH[localPhase()];
const devCS=()=>(.4+.6*resC().rent)*(.85+.15*resC().red);
const devScale=()=>.4+.6*resC().pp;
const hasBiz=t=>S.biz.some(b=>b.type===t&&!b.ousted);
const parcelPrice=(area,sqm,zone)=>Math.round(sqm*LAND_PSM*AREA[area].p*S.homeIdx*devCS()*(zone==='commercial'?1:.55)/1000)*1000;
const devBuildCost=(t,sqm)=>Math.round(DEV_TYPES[t].psm*sqm*devCS()*S.regs.zoning*(hasBiz('construction')?.88:1)/1000)*1000;
const devPG=(t,area,sqm)=>sqm*DEV_TYPES[t].rent*devScale()*devPh().r*DEV_AREA[area];
const devTgt=area=>Math.min(.98,devPh().t-(area==='out'?.06:0)+(hasBiz('realty')?.04:0));
const devNet=(t,area,sqm,occ)=>devPG(t,area,sqm)*(occ-.22);
function devValue(d){
  if(d.st==='build')return Math.round(d.v+d.spent*.85);
  if(d.st!=='done')return d.v;

  return Math.max(d.v,Math.round(Math.max(0,devNet(d.type,d.area,d.bsqm,tg))*(.6+.4*Math.min(1,d.occ/tg))/(T.cap+devPh().c)));}
const devSale=d=>Math.round(devValue(d)*(d.st==='done'?(hasBiz('realty')?.99:.97):.94));
const devEquity=d=>devSale(d)-(d.loan?d.loan.bal:0);
const landEquity=()=>(S.dev||[]).reduce((a,d)=>a+devEquity(d),0);
const devDebt=()=>(S.dev||[]).reduce((a,d)=>a+(d.loan?d.loan.bal:0),0);
const rezoneP=()=>Math.max(.15,Math.min(.85,.55-(resC().red-1)*.25+(S.fame||0)/500+sk('ppl')/600));
const rezoneCost=d=>Math.round(d.v*.05*resC().red/100)*100;

function sellDev(d){

}

        return `I bought ${fmtN(shares)} shares of ${target.n}. The tip was garbage -- the stock tanked.`;}
    }],['Buy a little -- stay under the radar',()=>{
      const amt=Math.min(S.money,Math.round(netWorth()*.02));if(amt<500)return 'I couldn\'t afford to act on it.';
      const shares=Math.floor(amt/price(target.s));S.money-=shares*price(target.s);
      S.hold[target.s]=(S.hold[target.s]||0)+shares;S.basis[target.s]=(S.basis[target.s]||0)+amt;

function lottery(){S.money-=10;const r=rnd(),m=has('lucky')?1.5:1;
  if(r<.000002*m){S.money+=1200000;S.st.happy+=40;S.flags.lotto=true;unlock('jackpot');mile('Won the lottery jackpot');return 'I WON THE LOTTERY JACKPOT! After the lump-sum discount and tax, about $1,200,000 reached my account.'}
  if(r<.0002*m){S.money+=1000;return 'I bought a $10 lottery ticket and won $1,000!'}
  if(r<.005*m){S.money+=100;return 'I bought a $10 lottery ticket and won $100!'}
  if(r<.06*m){S.money+=25;return 'I bought a $10 lottery ticket and won $25.'}return 'I bought a $10 lottery ticket. Nothing.'}
/* ================= collectibles and auctions ================= */
/* S.col is my collection. S.cm is the market index for each category (1 = today's price when I started). S.cmHot is the category collectors are chasing.
   S.auc is this year's sale catalogue. Buyers pay a 20% premium on the hammer price, sellers pay 10% commission. */
const COL_CATS={
  art:{n:'Art',ic:'🖼️',drift:3,vol:10},watch:{n:'Watches',ic:'⌚',drift:4,vol:8},wine:{n:'Fine wine',ic:'🍷',drift:2.5,vol:7},
  coin:{n:'Rare coins',ic:'🪙',drift:2.5,vol:6},memo:{n:'Memorabilia',ic:'🎞️',drift:3,vol:11},guitar:{n:'Guitars',ic:'🎸',drift:3,vol:9}};
const COL_RAR=['Common','Uncommon','Rare','Epic','Legendary'],COL_GROW=[.003,.006,.012,.018,.025];
const colTier=v=>v<5e3?0:v<5e4?1:v<5e5?2:v<5e6?3:4;
const COL_PREM=.20,COL_COMM=.10;
const AUC_NAMES=['Paddle 12','Lady Ashcroft','Mr. Tanaka','The Duchess','A phone bidder','Baron von Riel','Dealer Moreau','Ms. Okonkwo','Sir Percival','Paddle 88'];
const AUC_HOUSES={
  local:{n:'Corner Saleroom',ic:'🏚️',lo:300,hi:2e4,cnt:6,bid:[2,4]},
  regional:{n:'Regional Auction House',ic:'🏛️',lo:2e4,hi:4e5,cnt:6,bid:[2,5]},
  grand:{n:'Grand Evening Sale',ic:'🏰',lo:4e5,hi:25e6,cnt:5,bid:[3,6]}};
const colIdx0=()=>Object.fromEntries(Object.keys(COL_CATS).map(k=>[k,1]));
const sig2=v=>{const d=Math.pow(10,Math.max(0,Math.floor(Math.log10(Math.max(1,v)))-1));return Math.round(v/d)*d;};
function colName(cat){const P=a=>pick(a);
  if(cat==='art')return `${P(['Blue','Silent','Golden','Fractured','Winter','Salt','Paper','Midnight'])} ${P(['Harbour','Orchard','Portrait','Study','Horizon','Garden','Interior','Procession'])} by ${P(['A. Verhoeven','M. Castellan','L. Okoro','J. Brandt','S. Kimura','R. Delacroix-Vale'])}`;
  if(cat==='watch')return `${P(['Veltrin','Aurelian','Hartmann & Voss','Corvane','Meridien'])} ${P(['Chronograph','Perpetual Calendar','Diver','Moonphase','Tourbillon'])}, ${R(1948,2012)}`;
  if(cat==='wine')return `Chateau ${P(['Montclair','Belrose','Vauclaire','Ormesson','Lunel'])} ${R(1945,2005)} (${P(['case of 12','magnum','double magnum'])})`;
  if(cat==='coin')return `${R(1795,1935)} ${P(['gold eagle','silver dollar','sovereign','double florin','commemorative crown'])} (${P(['mint state','extremely fine','proof'])})`;
  if(cat==='memo')return `${P(['Dex Marlowe','Sienna Vale','Jax Okoro'])}'s ${P(['award-night jacket','signed script','stage guitar','first contract','screen-worn boots'])}`;
  return `${P(['Halvorsen','Brennick','Castille','Dunmore'])} ${P(['Sunburst','Archtop','Dreadnought','Custom'])}, ${R(1952,1984)}`;}
const setMult=cat=>{const n=(S.col||[]).filter(x=>x.cat===cat&&!(x.fake&&x.known)).length;return n>=5?1.12:n>=3?1.06:1;};
const colValue=it=>Math.round(it.base*S.cm[it.cat]*(1+Math.min(it.yrs,15)*COL_GROW[it.t])*(it.fake&&it.known?.04:1)*(it.known&&!it.fake?1.03:1)*setMult(it.cat)*(it.mus?1.03:1));
const colVal=()=>(S.col||[]).reduce((a,it)=>a+colValue(it),0);
const colEquity=()=>Math.round(colVal()*(1-COL_COMM));
const hotMult=cat=>S.cmHot&&S.cmHot.k===cat?1.12:1;
function aucInc(p){const u=Math.pow(10,Math.max(1,Math.floor(Math.log10(Math.max(10,p)))-1));return Math.max(u,Math.round(p*.05/u)*u);}
function aucLot(hk){
  const H=AUC_HOUSES[hk],cat=pick(Object.keys(COL_CATS)),fair=sig2(H.lo*Math.pow(H.hi/H.lo,rnd()));
  let shown=fair*R(88,112)/100,flag='';const x=rnd();
  if(x<.003){shown=fair/R(2,4);flag='sleeper';}else if(x<.083){shown=fair*R(140,200)/100;flag='hype';}
  return {id:uid(),cat,name:colName(cat),fair,shown:sig2(shown),flag,fake:flag!=='sleeper'&&rnd()<.04,done:null,exp:null};}
function aucCat(){
  if(S.auc&&S.auc.age===S.age)return S.auc;
  const o={age:S.age};Object.keys(AUC_HOUSES).forEach(k=>{o[k]=Array.from({length:AUC_HOUSES[k].cnt},()=>aucLot(k));});
  S.auc=o;return o;}
function colAch(){if(S.col.length>=10)unlock('curator');if(Object.keys(COL_CATS).every(k=>S.col.some(x=>x.cat===k)))unlock('fullset');}
/* ---- live bidding ---- */
function aucBegin(lot,hk){
  const H=AUC_HOUSES[hk],nb=R(H.bid[0],H.bid[1]),names=AUC_NAMES.slice().sort(()=>rnd()-.5).slice(0,nb);
  const A={lot,hk,cur:0,leader:'none',log:[],ai:names.map(n=>({n,max:lot.shown*(.55+rnd()*.7)*hotMult(lot.cat)}))};
  A.start=Math.max(10,sig2(lot.shown*.4));
  const c=A.ai.filter(b=>b.max>=A.start);A.cur=A.start;
  if(c.length){const b=pick(c);A.leader=b.n;A.log.push(`${b.n} opens the bidding at ${fmt(A.start)}.`);}
  else A.log.push(`The room is quiet. The auctioneer asks for ${fmt(A.start)}.`);
  aucTurn(A);}
function aucTable(A){
  const L=A.lot,C=COL_CATS[L.cat],tot=Math.round(A.cur*(1+COL_PREM));
  return h('div',{},h('p',{className:'label'},`${C.ic} ${C.n}. Estimate ${fmt(L.shown*.8)} to ${fmt(L.shown*1.2)}`),
    h('p',{className:'event-text',style:'margin:0 0 6px'},A.leader==='none'?`No bids yet. Opening at ${fmt(A.cur)}.`:`Bid ${fmt(A.cur)}, held by ${A.leader==='me'?'me':A.leader}.`),
    h('p',{className:'sub',style:'margin:0 0 6px'},`If I win at this price I pay ${fmt(tot)} with the ${Math.round(COL_PREM*100)}% buyer's premium.${L.exp?` The expert says it is worth about ${fmt(L.exp.val)} and looks ${L.exp.auth}.`:''}`),
    h('p',{className:'sub'},A.log.slice(-4).join(' ')));}
function aucTurn(A){
  const inc=aucInc(A.cur),next=A.leader==='none'?A.cur:A.cur+inc,jump=A.cur+inc*3,afford=x=>S.money>=x*(1+COL_PREM);
  choiceModal(`🔨 ${A.lot.name}`,'',[
    [`Bid ${fmt(next)}`,()=>aucBid(A,next),()=>!afford(next)],
    ...(A.leader==='none'?[]:[[`Jump bid to ${fmt(jump)}`,()=>aucBid(A,jump),()=>!afford(jump)]]),
    ['Set my limit...',()=>aucLimit(A),()=>!afford(next)],
    ['Walk away',()=>aucEnd(A,A.leader==='none'?null:A.leader)]],aucTable(A));}
function aucBid(A,to){A.cur=to;A.leader='me';A.log.push(`I bid ${fmt(to)}.`);aucRespond(A);}
function aucRespond(A){
  const nx=A.cur+aucInc(A.cur),c=A.ai.filter(b=>b.max>=nx&&rnd()>.12);
  if(!c.length)return aucEnd(A,'me');
  const b=pick(c);A.cur=nx;A.leader=b.n;A.log.push(`${b.n} bids ${fmt(nx)}.`);aucTurn(A);}
function aucLimit(A){
  const cap=Math.floor(S.money/(1+COL_PREM)),next=A.leader==='none'?A.cur:A.cur+aucInc(A.cur);
  amountModal({title:'Set my limit',sub:`I will bid for myself up to this hammer price, then stop. The current bid is ${fmt(A.cur)}. The ${Math.round(COL_PREM*100)}% premium is added on top.`,min:next,max:cap,init:Math.min(cap,Math.max(next,Math.round(A.lot.shown*1.1))),step:10,
    btn:a=>`Bid up to ${fmt(a)}`,note:a=>`At most ${fmt(Math.round(a*(1+COL_PREM)))} with the premium.`,
    onOk:L=>{A.cur=next;A.leader='me';A.log.push(`I bid ${fmt(next)} and set my limit at ${fmt(L)}.`);
      for(let g=0;g<60;g++){const nx=A.cur+aucInc(A.cur),c=A.ai.filter(b=>b.max>=nx&&rnd()>.12);
        if(!c.length)return aucEnd(A,'me');
        const b=pick(c);A.cur=nx;A.leader=b.n;A.log.push(`${b.n} bids ${fmt(nx)}.`);
        const mine=A.cur+aucInc(A.cur);if(mine>L)return aucEnd(A,b.n);
        A.cur=mine;A.leader='me';A.log.push(`I counter at ${fmt(mine)}.`);}
      aucEnd(A,'me');},onCancel:()=>aucTurn(A)});}
function aucEnd(A,who){
  const L=A.lot,price=A.cur,back=[['Back to the catalog',()=>gRefresh()]];
  if(who==null){L.done='passed';return choiceModal('🔨 Passed',`Nobody bid, so ${L.name} was passed.`,back);}
  if(who!=='me'){L.done='lost';return choiceModal('🔨 Sold to '+who,`The hammer fell at ${fmt(price)}. ${who} takes ${L.name}.`,back);}
  const total=Math.round(price*(1+COL_PREM));
  S.money-=total;L.done='won';
  const it={id:uid(),cat:L.cat,name:L.name,base:L.fair/S.cm[L.cat],t:colTier(L.fair),yrs:0,paid:total,fake:L.fake,known:false,mus:false};
  S.col.push(it);mile(`Won ${L.name} at auction`);sfx('good');
  if(price>=1e6)unlock('gavel');colAch();
  let extra='';
  if(L.flag==='sleeper'){it.known=true;S.fame=Math.min(100,(S.fame||0)+3);extra=` After the sale, experts studied it and announced a discovery: it is a lost masterwork worth about ${fmt(L.fair)}!`;toast('🔨 A hidden treasure!');}
  gRefresh();
  choiceModal('🔨 Sold to me!',`The hammer fell at ${fmt(price)}. With the premium I paid ${fmt(total)} for ${L.name}.${extra}`,back);}
/* ---- selling ---- */
function colFakeCheck(it){
  if(!(it.fake&&!it.known)||rnd()>=.85)return false;
  it.known=true;gRefresh();
  choiceModal('🔨 Forgery!',`The house experts examined ${it.name} and flagged it as a forgery. The sale was withdrawn and it is worth almost nothing now.`,[['Ouch',()=>{}]]);return true;}
function colHouse(it){
  const v=colValue(it),ideal=v>=4e5?'grand':v>=2e4?'regional':'local';
  choiceModal(`Sell ${it.name}`,`Worth about ${fmt(v)}. The house takes ${Math.round(COL_COMM*100)}% commission. Pieces do best at the house that suits their price. Pick a reserve, the lowest price I will accept.`,
    Object.entries(AUC_HOUSES).map(([k,H])=>[`${H.ic} ${H.n}${k===ideal?' (best fit)':''}`,()=>colReserve(it,k)]).concat([['Cancel',()=>{}]]));}
function colReserve(it,hk){
  const v=colValue(it);
  choiceModal('Set the reserve',`${AUC_HOUSES[hk].n}. Estimate ${fmt(v*.8)} to ${fmt(v*1.2)}. A higher reserve can mean no sale, and an unsold lot costs a 2% catalogue fee.`,[
    [`Low reserve, ${fmt(v*.7)} (sells almost surely)`,()=>colSale(it,hk,.7)],[`Fair reserve, ${fmt(v*.95)}`,()=>colSale(it,hk,.95)],[`Ambitious reserve, ${fmt(v*1.2)} (may not sell)`,()=>colSale(it,hk,1.2)],['Back',()=>colHouse(it)]]);}
function colSale(it,hk,rp){
  if(colFakeCheck(it))return;
  const v=colValue(it),H=AUC_HOUSES[hk],ideal=v>=4e5?'grand':v>=2e4?'regional':'local',match=hk===ideal;
  let nb=R(H.bid[0],H.bid[1]);if(!match)nb=Math.max(1,nb-2);
  const mult=(match?1:.9)*hotMult(it.cat),maxes=Array.from({length:nb},()=>v*(.55+rnd()*.7)*mult).sort((a,b)=>b-a);
  const second=maxes[1]||v*.4;let price=Math.min(maxes[0],Math.round(second*1.03+aucInc(second)));price=Math.round(price/10)*10;
  const names=AUC_NAMES.slice().sort(()=>rnd()-.5).slice(0,Math.max(2,nb)),start=Math.max(10,sig2(price*.35)),lines=[`Bidding opens at ${fmt(start)}.`];
  const steps=R(2,4);for(let k=1;k<=steps;k++){const p=Math.round((start+(price-start)*k/(steps+1))/10)*10;lines.push(`${names[k%names.length]} bids ${fmt(p)}.`);}
  let head,res,cls='';
  if(price<v*rp){const fee=Math.min(Math.round(v*.02),Math.max(0,Math.floor(S.money)));S.money-=fee;head='🔨 Bought in';lines.push(`The bidding stalls at ${fmt(price)}, under my reserve.`);res=`Unsold. The house charged a ${fmt(fee)} catalogue fee. I still own ${it.name}.`;cls='bad';}
  else{const net=Math.round(price*(1-COL_COMM)),profit=net-it.paid;
    lines.push(`Sold to ${names[0]} for ${fmt(price)}!`);
    S.money+=net;S.col=S.col.filter(x=>x!==it);
    if(it.paid>0&&net>=3*it.paid)unlock('flip');
    if(it.fake&&!it.known){addKarma(-3);lines.push('The buyer\'s experts missed the forgery. Not my finest hour.');}
    mile(`Sold ${it.name} at auction`);head='🔨 Sold!';
    res=`After ${Math.round(COL_COMM*100)}% commission I received ${fmt(net)}. That is a ${profit>=0?'profit':'loss'} of ${fmt(Math.abs(profit))} on what I paid.`;cls=profit>=0?'good':'bad';}
  gRefresh();
  choiceModal(head,res,[['Back to my collection',()=>gRefresh()]],h('div',{},...lines.map(t=>h('p',{className:'sub',style:'margin:0 0 4px'},t))));}
function colDealer(it){
  if(colFakeCheck(it))return;

function yrCollect(){
  const cats=Object.keys(COL_CATS),ph=PHASE[S.econ.phase].m[0]*.15;
  if(S.cmHot){S.cmHot.yrs--;if(S.cmHot.yrs<0){const k=S.cmHot.k;S.cm[k]=Math.max(.35,S.cm[k]*.94);if(S.col.length)line(`🔨 The ${COL_CATS[k].n.toLowerCase()} frenzy cooled off.`);S.cmHot=null;}}
  else if(rnd()<.15){const k=pick(cats);S.cmHot={k,yrs:2};if(S.col.length)line(`🔨 Collectors are chasing ${COL_CATS[k].n.toLowerCase()} this year.`);}
  cats.forEach(k=>{const C=COL_CATS[k];S.cm[k]=Math.max(.35,Math.min(5,S.cm[k]*(1+(C.drift+ph+(S.cmHot&&S.cmHot.k===k?10:0)+gauss()*C.vol)/100)));});
  if(!S.col.length)return;
  let cost=0;
  S.col.slice().forEach(it=>{
    const v=colValue(it);cost+=v*.003+(S.colIns?v*.008:0);it.yrs+=it.mus?2:1;
    if(it.mus&&it.t>=3)S.fame=Math.min(100,(S.fame||0)+1);
    if(!it.mus&&rnd()<.012){const how=pick(['stolen','damaged in a fire']);S.col=S.col.filter(x=>x!==it);
      if(S.colIns){const p=Math.round(v*.85);S.money+=p;line(`🖼️ ${it.name} was ${how}. Insurance paid ${fmt(p)}.`,'bad');}
      else line(`🖼️ ${it.name} was ${how}. It was not insured, so it is gone.`,'bad');return;}
    if(it.fake&&!it.known&&rnd()<.10){it.known=true;line(`🖼️ Experts examined ${it.name} and declared it a forgery. It is worth almost nothing now.`,'bad');}});
  cost=Math.round(Math.min(cost,Math.max(0,S.money)));S.money-=cost;
  if(cost>=1000)line(`🖼️ Storage${S.colIns?' and insurance':''} for my collection cost ${fmt(cost)}.`);
}

/* ================= social media ================= */
/* S.soc is my online presence. pl holds followers (f) and engagement (e) for three platforms. Posts (quick ones are free, up to 6 a year;
   produced ones cost 1 energy) grow followers; ad revenue, subscriptions and brand deals pay; cancel drama, rivals, burnout and fake followers push back. */
const SOC_PLATS={
  snap:{n:'Snapshot',ic:'📸',rate:1,fit:['selfie','travel','workout']},
  clip:{n:'ClipTok',ic:'🎬',rate:1.1,fit:['funny','workout','behind']},
  chirp:{n:'Chirp',ic:'💬',rate:.5,fit:['biz','hot','review']}};
const SOC_CONT={
  selfie:{n:'Selfie',ic:'🤳',q:()=>S.st.looks/100,d:'Works when my looks are strong'},
  workout:{n:'Workout',ic:'💪',q:()=>Math.min(1,S.st.health/100+(has('athletic')?.2:0)),d:'Health and athletic traits help'},
  travel:{n:'Travel',ic:'✈️',q:()=>.6+rnd()*.3,cost:800,d:'Always looks good, but costs $800'},
  biz:{n:'Business tips',ic:'💼',q:()=>S.st.smarts/100,d:'Smarts help'},
  funny:{n:'Funny skit',ic:'😂',q:()=>.3+rnd()*.5+(has('charming')||has('creative')?.2:0),d:'Hit or miss. Charm and creativity help'},
  behind:{n:'Behind the scenes',ic:'🎥',q:()=>Math.min(1,.3+(S.fame||0)/100),d:'The more famous I am, the more people want a peek'},
  hot:{n:'Hot take',ic:'🔥',q:()=>.2+rnd()*.7+(has('hothead')?.15:0),d:'Big swings, and it can come back to bite me'},
  review:{n:'Product review',ic:'🛍️',q:()=>.45+rnd()*.25,d:'Steady, and sponsors like it'}};
const SOC_TIERS=[[1e8,'Global icon'],[1e7,'Mega star'],[1e6,'Macro influencer'],[1e5,'Mid-tier creator'],[1e4,'Micro influencer'],[0,'Nano creator']];
const SOC_BRANDS=SP_BRANDS.concat(['Glow Beauty','Bento Foods','Roam Travel','Pixel Games']);
const RIVAL_NAMES=['@VelvetVince','@QueenOfClips','@TheRealMaddox','@LunaLoud','@Hustle.Hank'];
const socTotal=()=>S.soc?Object.values(S.soc.pl).reduce((a,p)=>a+p.f,0):0;
const socTier=()=>SOC_TIERS.find(t=>socTotal()>=t[0])[1];
const fmtF=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e5?0:1)+'K':String(Math.round(n));
const socTrend=()=>({k:pick(Object.keys(SOC_CONT)),yrs:R(1,2)});
const socScale=p=>{Object.values(S.soc.pl).forEach(x=>{x.f=Math.max(0,Math.round(x.f*(1+p)));});};
const socMgrWage=()=>Math.max(36000,Math.round(socTotal()*.01));
const socDealMax=()=>Math.min(4,1+Math.floor(Math.max(0,Math.log10(Math.max(1,socTotal()))-3)));
function socBoost(p,msg){if(!S.soc)return;socScale(p);if(msg)line(msg,'good');}
function socRev(){
  const O=S.soc;let ads=0;
  Object.entries(SOC_PLATS).forEach(([k,P])=>{const pl=O.pl[k];if(k==='clip'&&pl.f>=10000)ads+=pl.f*.04*(pl.e/.04)*P.rate*(O.ver?1.15:1);});
  const fakeShare=O.fake?Math.min(.8,O.fake/Math.max(1,socTotal())):0;
  ads*=1-fakeShare*.6;
  const subs=O.sub&&socTotal()>=50000?Math.round(socTotal()*.004*(.6+(S.fame||0)/100)):0;
  return {ads:Math.round(ads),subs,subRev:subs*72};}
function startSocial(){
  const f0=()=>Math.round(R(60,260)+(S.fame||0)*80);
  S.soc={pl:{snap:{f:f0(),e:.04},clip:{f:f0(),e:.045},chirp:{f:f0(),e:.03}},ver:false,mgr:null,deals:[],offers:[],sub:false,trend:socTrend(),posts:0,quick:0,spicy:0,fake:0,burn:0,rival:null,viral:0,hist:[],brk:false};
  mile('Started posting online');
  stay('I set up accounts on Snapshot, ClipTok and Chirp. Time to build an audience.','good');}
/* ---- posting ---- */
function socPostCore(plat,ck,produced,auto){
  const O=S.soc,P=SOC_PLATS[plat],C=SOC_CONT[ck],pl=O.pl[plat];
  const quality=auto?(O.mgr.skill*.4+R(0,20)):C.q()*40;
  const score=Math.round(quality+(P.fit.includes(ck)?10:0)+(O.trend&&O.trend.k===ck?16:0)+(produced?8:0)+(O.mgr&&!auto?8:0)-(O.burn>70?10:0)+(S.fame||0)/12+(O.ver?4:0)+R(-14,14));
  const sat=Math.max(.25,1-Math.log10(Math.max(10,pl.f))/9),base=500+(S.fame||0)*60,tier=score>=70?'viral':score>=50?'hit':score>=28?'ok':'flop';
  let gain=tier==='viral'?Math.round(base*R(20,50)/10+pl.f*R(15,60)/100*sat):tier==='hit'?Math.round(base*R(10,20)/10+pl.f*R(4,10)/100*sat):tier==='ok'?Math.round(base+pl.f*.015*sat):-Math.round(pl.f*.004);
  pl.f=Math.max(0,pl.f+gain);
  pl.e=Math.max(.01,Math.min(.12,pl.e+(tier==='viral'||tier==='hit'?.002:tier==='flop'?-.002:0)));
  O.posts++;if(ck==='hot')O.spicy++;
  if(!auto)O.burn=Math.min(100,O.burn+(produced?5:3));
  if(tier==='viral'){O.viral++;S.fame=Math.min(100,(S.fame||0)+1.5);unlock('sviral');}
  O.hist.push({age:S.age,t:`${C.ic} ${C.n} on ${P.n}: ${tier==='viral'?'went viral':tier==='hit'?'a hit':tier==='ok'?'okay':'flopped'} (${gain>=0?'+':'-'}${fmtF(Math.abs(gain))})`});
  if(O.hist.length>8)O.hist.shift();
  socMilestones();
  return {score,gain,tier};}
function socMilestones(){const t=socTotal();if(t>=1e5)unlock('sf100k');if(t>=1e6)unlock('sf1m');if(t>=1e7)unlock('sf10m');if(S.soc.ver)unlock('sver');}
function postFlow(plat){
  const O=S.soc,P=SOC_PLATS[plat],tr=O.trend;
  choiceModal(`${P.ic} Post on ${P.n}`,`Trend this year: ${SOC_CONT[tr.k].ic} ${SOC_CONT[tr.k].n}. Quick posts left: ${6-O.quick}. Pick what to post.`,
    Object.entries(SOC_CONT).map(([k,C])=>[`${C.ic} ${C.n}${P.fit.includes(k)?' (fits here)':''}${tr.k===k?' 🔥 trending':''}: ${C.d}`,()=>postHow(plat,k),()=>false]).concat([['Cancel',()=>{}]]));}
function postHow(plat,ck){
  const O=S.soc,C=SOC_CONT[ck];
  choiceModal(`${SOC_CONT[ck].ic} ${SOC_CONT[ck].n}`,'How much effort do I put in?',[
    [`Quick post (free, ${6-O.quick} left this year)`,()=>postDone(plat,ck,false),()=>O.quick>=6||(!!C.cost&&S.money<C.cost)],
    [`Produced post (1 energy, better quality${C.cost?`, $${C.cost}`:''})`,()=>postDone(plat,ck,true),()=>energyLeft()<1||(!!C.cost&&S.money<C.cost)],
    ['Back',()=>postFlow(plat)]]);}
function postDone(plat,ck,produced){
  const C=SOC_CONT[ck],P=SOC_PLATS[plat],O=S.soc;
  if(C.cost)S.money-=C.cost;if(produced)spend(1);else O.quick++;
  const r=socPostCore(plat,ck,produced,false);
  gRefresh();
  const txt={viral:`It exploded! ${fmtF(Math.abs(r.gain))} new followers overnight.`,hit:`It did well: ${fmtF(Math.abs(r.gain))} new followers.`,ok:`A steady post: ${fmtF(Math.abs(r.gain))} new followers.`,flop:`It flopped and I lost ${fmtF(Math.abs(r.gain))} followers.`}[r.tier];
  choiceModal(`${C.ic} ${r.tier==='viral'?'GONE VIRAL':r.tier==='hit'?'A hit':r.tier==='ok'?'Posted':'It flopped'}`,`${txt} I have ${fmtF(O.pl[plat].f)} followers on ${P.n}.`,[
    ['Post again',()=>postFlow(plat)],['Done',()=>{}]]);}
/* ---- the year ---- */
function yrSocial(){
  const O=S.soc;if(!O)return;
  const keys=Object.keys(SOC_PLATS),before=socTotal();
  if(O.mgr){const wage=socMgrWage(),pay=Math.min(wage,Math.max(0,Math.floor(S.money)));S.money-=pay;
    if(pay<wage){line(`📱 I could not pay ${O.mgr.name}, so they left.`,'bad');O.mgr=null;}
    else{for(let i=0;i<4;i++)socPostCore(pick(keys),pick(Object.keys(SOC_CONT).filter(x=>x!=='hot')),false,true);}}
  if(O.posts===0){socScale(-.07);line('📱 I did not post this year, so the algorithm buried me and I lost followers.','bad');}
  keys.forEach(k=>{const pl=O.pl[k];pl.f+=Math.round((S.fame||0)*15+pl.f*.01);pl.e=Math.max(.015,Math.min(.1,pl.e+(.04-pl.e)*.15));});
  if(O.fake>0&&rnd()<.06+O.fake/Math.max(1,socTotal())*.4){
    const share=Math.min(.9,O.fake/Math.max(1,socTotal()));socScale(-share);O.fake=0;O.deals=[];S.fame=Math.max(0,(S.fame||0)-3);
    line('🕵️ A journalist exposed my fake followers. I lost them, my brand deals, and some of my reputation.','bad');}
  // income
  const rev=socRev();
  if(rev.subs>0&&O.posts<3){O.sub=false;line('📱 My subscribers left because I posted too little, so subscriptions are off.','bad');}
  else if(rev.subRev>0){const n=Math.round(rev.subRev*(O.mgr?.9:1));S.money+=netStack(n);line(`💎 ${fmtF(rev.subs)} paying subscribers brought in ${fmt(n)}.`,'good');}
  if(rev.ads>0){const n=Math.round(rev.ads*(O.mgr?.9:1));S.money+=netStack(n);line(`📺 Ad revenue paid ${fmt(n)}.`,'good');}
  let dealPay=0;
  O.deals.forEach(e=>{if(O.posts>=2){dealPay+=e.pay;e.yrs--;}else{e.yrs=0;S.fame=Math.max(0,(S.fame||0)-2);line(`📱 ${e.brand} dropped me because I posted too little for the deal.`,'bad');}});
  O.deals=O.deals.filter(e=>e.yrs>0);
  if(dealPay>0){const n=Math.round(dealPay*(O.mgr?.9:1));S.money+=netStack(n);line(`🤝 Brand deals paid ${fmt(n)}.`,'good');}
  // new offers
  O.offers=[];const tot=socTotal();
  if(tot>=5000&&O.deals.length<socDealMax()&&rnd()<.4+Math.min(.4,tot/5e6)){
    const n=rnd()<.35?2:1;for(let i=0;i<n;i++)O.offers.push({brand:pick(SOC_BRANDS.filter(b=>!O.deals.some(e=>e.brand===b))),pay:Math.round(tot*.08*R(80,120)/100*(1+(S.fame||0)/100)*(O.ver?1.2:1)/100)*100,yrs:R(1,3)});
    line(`🤝 ${n===1?'A brand wants':'Brands want'} to work with me.`,'good');}
  // trends, burnout, trolls
  O.trend.yrs--;if(O.trend.yrs<=0){O.trend=socTrend();line(`🔥 A new trend is taking over: ${SOC_CONT[O.trend.k].n.toLowerCase()}.`);}
  O.burn=Math.max(0,O.burn-30+(O.posts>10?10:0));
  if(O.burn>70){S.st.happy-=3;S.st.health-=2;line('😮‍💨 I am burned out from constant posting. It is hurting my mood and health.','bad');}
  if(((S.fame||0)>=15||tot>=50000)&&!O.mgr&&rnd()<.5){const d=R(1,3);S.st.happy-=d;line('😡 Trolls flooded my comments this year. It got to me.','bad');}
  // fame floor from my following
  S.fame=Math.min(100,Math.max(S.fame||0,Math.round(Math.max(0,Math.log10(Math.max(1,tot))*12-30)*.85)));
  // dramas
  if(tot>=20000&&rnd()<(.03+O.spicy*.02+(has('hothead')?.02:0)+(tot>1e6?.03:0))*(O.mgr?.6:1))socCancel();
  else if(tot>=100000&&rnd()<.10)socRival();
  else if(tot>=200000&&rnd()<.08)socMeetup();
  else if(O.deals.length&&rnd()<.06)socBrandCrisis();
  else if(rnd()<.08){const k=pick(keys),up=rnd()<.5;O.pl[k].e=Math.max(.015,Math.min(.1,O.pl[k].e*(up?1.25:.75)));line(`⚙️ ${SOC_PLATS[k].n} changed its algorithm. ${up?'My posts reach more people now.':'My posts reach fewer people now.'}`,up?'good':'bad');}
  const grew=socTotal()-before;
  if(grew!==0)line(`📱 My following ${grew>=0?'grew by':'shrank by'} ${fmtF(Math.abs(grew))} this year to ${fmtF(socTotal())} (${socTier()}).`);
  socMilestones();
  O.posts=0;O.quick=0;
}
function socCancel(){
  const O=S.soc,old=O.spicy>0;
  Q.push({own:true,text:`📱 ${old?'An old post of mine resurfaced':'A clip of me, taken out of context,'} and people are furious. I am trending for the wrong reasons.`,ch:[
    ['Apologise sincerely',()=>{socScale(-.06);S.st.happy-=2;unlock('scancel');return 'I posted an honest apology. I lost some followers but people respected it.'}],
    ['Double down',()=>{if(rnd()<.5){socScale(.15);S.fame=Math.min(100,(S.fame||0)+2);unlock('scancel');return 'My fans rallied behind me. The controversy made me bigger.';}socScale(-.3);S.soc.deals=[];return 'It backfired badly. I lost a third of my audience and every brand deal.';}],
    [`Hire a crisis PR firm ($40,000)`,()=>{S.money-=40000;socScale(-.03);unlock('scancel');return 'The PR team steered the story. I barely lost anything.';},()=>S.money<40000],
    ['Ignore it and log off',()=>{socScale(-.14);S.soc.deals=S.soc.deals.filter(()=>rnd()>.4);return 'I ignored it. The storm passed, but it cost me followers and some sponsors.';}]]});}
function socRival(){
  const O=S.soc,nm=O.rival||pick(RIVAL_NAMES);O.rival=nm;
  Q.push({own:true,text:`📱 ${nm}, another creator, called me out in a video and it is spreading fast.`,ch:[
    ['Reply with a savage roast',()=>{if(rnd()<.5){socScale(.2);S.fame=Math.min(100,(S.fame||0)+1);return `My reply went huge. Everyone is talking about how I won the feud with ${nm}.`;}socScale(-.12);return `My roast fell flat and ${nm} made me look petty.`;}],
    ['Ignore them',()=>{socScale(-.02);return 'I stayed above it. The feud died down.';}],
    ['Propose a collab',()=>{socScale(.1);O.rival=null;return `${nm} agreed to a collab. We both gained followers.`;}]]});}
function socMeetup(){
  Q.push({own:true,text:'📱 My fans are asking for a meet-up in real life.',ch:[
    ['Host a fan meet-up ($20,000)',()=>{S.money-=20000;socScale(.03);S.fame=Math.min(100,(S.fame||0)+2);S.st.happy+=5;return 'Hundreds of fans showed up. It was unforgettable.';},()=>S.money<20000],
    ['Keep things online',()=>'I thanked everyone online and kept my distance.']]});}
function socBrandCrisis(){
  const O=S.soc,e=pick(O.deals);
  Q.push({own:true,text:`📱 ${e.brand}, one of my sponsors, is caught in a scandal. Followers are asking why I still work with them.`,ch:[
    [`Drop ${e.brand}`,()=>{O.deals=O.deals.filter(x=>x!==e);socScale(.02);return `I dropped ${e.brand}. People respected the stand.`;}],
    ['Stay with them',()=>{socScale(-.05);return 'I stayed for the money. Some followers left.';}]]});}
/* ---- screens ---- */
function socialSheet(){openSheet(drawSocial);}
function drawSocial(s){
  const O=S.soc,ro=!S.alive||!!S.jail;
  s.append(h('button',{className:'back',on:()=>{wbTab='careers';closeSheet();jobSheet();}},'‹ Work'),h('h3',{},'📱 Social media'));
  if(!O){
    s.append(h('p',{className:'sub'},'Build an audience on three platforms: Snapshot for photos, ClipTok for short videos and Chirp for text. Post, ride trends, go viral, sign brand deals, and manage the drama that comes with being seen.'),
      row('Create my accounts','Free. Starts small, and fame gives me a head start','',startSocial,ro||S.age<12));return;}
  const rev=socRev(),tr=O.trend,tot=socTotal();

function clSign(p,fee,wage,yrs,bonus){
  const C=S.club,total=Math.round(fee+fee*.05+wage*.1);

  if(fee>0){
    const okS=fee>=p.fee*.9&&rnd()<Math.min(.98,(fee/p.fee-.9)/.25);
    if(!okS){stay(`${p.club} turned down the ${fmt(fee)} bid for ${p.n}.`,'bad');return;}
    if(p.ovr>=C.base+8&&fee<p.fee*1.2&&rnd()<.3){C.mkt=C.mkt.filter(x=>x!==p);stay(`A rival club outbid ${C.team} for ${p.n}.`,'bad');return;}}
  const appeal=C.brand*.5+clStrength(C)*.5,need=p.ovr*.85,pr=Math.max(.05,Math.min(.97,.5+(appeal-need)/40+bonus*3));
  if(rnd()>pr){stay(`${p.n} turned down the move to ${C.team}. ${bonus<0?'The wage offer was too low.':'He wants a bigger club.'}`,'bad');return;}
  C.cash-=total;C.spent=(C.spent||0)+fee;
  const q={...p};delete q.fee;delete q.ask;delete q.club;delete q.err;delete q.perr;q.wage=wage;q.yrs=yrs;q.mor=75;q.form=60;q.exp=false;q.tr=0;
  C.squad.push(q);C.mkt=C.mkt.filter(x=>x!==p);C.fa=C.fa.filter(x=>x!==p);C.chem=Math.max(0,(C.chem||0)-.3);
  mile(`Signed ${p.n} for ${C.team}`);
  stay(`${C.team} signed ${p.n} (${q.pos}, overall ${q.ovr}) ${fee?`from ${p.club} for ${fmt(fee)}`:'on a free transfer'}, on ${fmt(wage)} a year for ${yrs} years.`,'good');}

function clYouth(C){

    line(`${C.team} signed free agent ${q.n} (${q.pos}, overall ${q.ovr}) to keep the squad big enough.`);}
  while(C.squad.length<clMin(C)){const pos=CL_POSS[C.sport][C.squad.length%CL_POSS[C.sport].length],p=clPlayer(C.sport,pos,clamp(Math.round(C.base*.6)),R(19,26),0);p.wage=clPWage(C,p);p.yrs=1;C.squad.push(p);}}
function clYearEnd(C,res){

function continueAs(k){

  if(k.age<18&&W.guardian){const g=S.rels.find(x=>x.id===W.guardian&&x.alive);if(g)parents=[{...g,type:g.gender==='F'?'Mother':'Father',rel:70}];}

  const nd=S.dt||E.trust?{bal:(S.dt?S.dt.bal:0)+E.trust,log:[]}:null,nf=S.fdn?{...S.fdn,bal:S.fdn.bal+E.charity}:null,nfo=S.fo?{...S.fo,harm:Math.round(S.fo.harm*.9)}:null;
  const oldTal=k.life&&k.life.tal,eqShare=1/Math.max(1,heirs),short=otherKids.filter(p=>W.mode==='custom'&&(sh[p.id]||0)<eqShare*.5);
  const gen0=S.gen,pres0=S.pres||0,style0=S.pstyle||'support';
  newLife({name:k.name,gender:k.gender,last:k.name.split(' ').slice(1).join(' '),age:k.age,city:S.city,money:cash,assets,dev:inh.dev,col:inh.col,cm:S.cm,cmHot:S.cmHot,club:inh.club,med:inh.med,biz:S.biz,gen:S.gen+1,parents,siblings:sibs,mkt:S.mkt,econ:S.econ,cecon:S.cecon,homeIdx:S.homeIdx,cpi:S.cpi,dyn:S.dyn,seed:S.seed,inherit:S.traits,trend:S.trend,regs:S.regs,supIdx:S.supIdx,rivals:S.rivals,pres:Math.round(pres0*.85),pstyle:style0,dt:nd,fo:nfo,fdn:nf});
  if(E.tax)line(`🏛️ Estate tax took ${fmt(E.tax)}.${soldNote}`,'bad');else if(soldNote)line(soldNote.trim());
  if(E.charity&&S.fdn)line(`🎗️ ${fmt(E.charity)} went to the ${S.fdn.name}.`);
  inh.notes.forEach(t=>line(`📜 ${t}.`));
  if(oldTal){[['sport','athletic',75],['soc','charming',75],['acad','genius',85],['biz','hustler',80]].some(([t,tr,th])=>{if(oldTal[t]>=th&&TRAITS[tr]&&!S.traits.includes(tr)){S.traits[S.traits.length-1]=tr;line(`Growing up, ${tr==='athletic'?'sport':tr==='charming'?'people':tr==='genius'?'study':'business'} came naturally to me.`);return true;}return false;});}
  dReadyPenalty(k,{club:S.club&&inh.club?S.club:null,med:S.med&&inh.med?S.med:null});
  short.forEach(p=>{if(rnd()<.5)Q.push({text:`${fname(p.name)} is contesting the will. They feel they were treated unfairly.`,ch:[
    ['Settle for 15% of the cash',()=>{const x=Math.round(E.net*.15);S.money=Math.max(0,S.money-x);kidLife(S.rels.find(r=>r.id===p.id)||p).cash+=x;return `We settled quietly for ${fmt(x)}. The family stayed intact.`;}],
    ['Fight it in court',()=>{if(rnd()<.6){return 'The court upheld the will, but the relationship is cold.';}const x=Math.round(S.money*.2);S.money-=x;return `I lost and paid ${fmt(x)} in costs and damages.`;}]]});});
  if(k.life){const L=k.life;['smarts','looks'].forEach(x=>S.st[x]=L.st[x]);S.edu.degrees=[...L.degrees];if(L.major){S.edu.major=L.major;S.edu.yrs=L.degYrs;}
    if(L.job){S.job={c:L.job.c,s:L.job.s,perf:55,lvl:L.job.lvl,yrs:3,lvlYrs:1,warn:0,style:'normal'};if(!S.careers.includes(L.job.c))S.careers.push(L.job.c);}
    S.money+=L.cash+L.inv+(L.biz?L.biz.v:0);if(L.home)S.assets.push({n:L.home.n,v:L.home.v,k:'home',rent:false,mort:L.home.mort>0?{bal:L.home.mort,rate:loanRate(),pay:Math.round(annuity(L.home.mort,loanRate(),25))}:null});

function doImport(raw,slot){
  const txt=String(raw||'').trim();
  const body=txt.indexOf('ONELIFE1:')===0?txt.slice(9):txt;
  const json=b64dec(body);
  let d=null;try{d=JSON.parse(json)}catch(e){}
  if(!d||!d.S||!d.S.name){flash={t:'That backup code could not be read. Copy the whole code and try again.',c:'bad'};if(curSheet)drawSheet();return;}
  save();
  useSlot(slot);
  META=Object.assign(blankMeta(),d.META||{});
  undoSnap=null;Q=[];
  S=migrate(d.S);
  save();closeSheet();render();if(!S.alive)showDeath();
}

      ['Counter for 20% more',()=>{if(rnd()<.25+lev*.5){cur=Math.round(cur*1.2);toast('They accepted your counter.');step();}else if(rnd()<.4){stay(onWalk?onWalk():'They walked away from the table.','bad');}else{toast('They held firm.');step();}}],

/* ================= running out of money ================= */
function deficitEvent(b){

    const my=Math.max(0,Math.floor(S.money)),lmx=Math.floor(lm/1.2);
    return {text:`${b.name} ran out of money. It's ${fmt(short)} short. How do I keep it alive?`,ch:[
    my>=short?[`Cover it from my cash (${fmt(short)})`,()=>{S.money-=short;b.cash=0;cfAdd(b,'owner',short);return `I covered the shortfall to keep ${b.name} alive.`}]:my>1000?part('Put in all my cash',my,a=>{S.money-=a;cfAdd(b,'owner',a);}):[`Cover it from my cash (I only have ${fmt(my)})`,()=>'',()=>true],
    lm>=short*1.2?[`Emergency bank loan (${fmt(short*1.2)})`,()=>{addLoan(b,Math.round(short*1.2),.02);b.cash+=Math.round(short*1.2);cfAdd(b,'credit',Math.round(short*1.2));return `The bank lent ${fmt(short*1.2)} at a higher rate to keep ${b.name} going.`}]:lmx>1000?part('Borrow the most the bank allows',lmx,a=>{addLoan(b,Math.round(a*1.2),.02);cfAdd(b,'credit',Math.round(a*1.2));b.cash+=Math.round(a*.2);}):[`Emergency bank loan (the bank said no: ${badCredit()?'my credit is damaged':b.yrs<1?'the business is too new':b.lastPre<0?'it lost money':'too much debt already'})`,()=>'',()=>true],
    room>=short?[`Draw the credit line (${fmt(short)})`,()=>{b.credit=(b.credit||0)+short;b.cash=0;cfAdd(b,'credit',short);return 'I drew on the credit line to cover it.'}]:room>1000?part('Use the rest of the credit line',Math.floor(room),a=>{b.credit=(b.credit||0)+a;cfAdd(b,'credit',a);}):[`Draw the credit line (already used up)`,()=>'',()=>true],
    [`Rescue investor: ${fmt(short*1.5)} for ${(eq*100).toFixed(0)}%`,()=>{const keep=1-eq;b.own*=keep;if(b.co)b.co.share*=keep;b.inv=(b.inv||0)*keep+eq;b.cash+=Math.round(short*1.5);cfAdd(b,'owner',Math.round(short*1.5));return `A rescue investor put in ${fmt(short*1.5)} for ${(eq*100).toFixed(0)}% of ${b.name}.`},()=>ii.score<30||b.pub||b.own<.2],

  const zone=a=>a===0?'No salary. All profit stays in the business.':a<mk*.6?'Modest. Leaves more cash in the business.':a<=mk*1.15?'Fair for a business this size.':'Above market. Co-founders and investors will grumble, and the board may act if it lasts.';
  return row('💼 My salary',cur?`${fmt(cur)}/yr (${fmt(netPay(cur))} after ${resC().n} income tax). ${zone(cur).split('.')[0]}.`:`Not paying myself. Fair pay for my role here is about ${fmt(mk)}/yr`,cur?fmt(cur):'',()=>{
    amountModal({title:`My salary from ${b.name}`,sub:`Fair pay for my role (${{hands:'hands-on',delegate:'delegating',absent:'hands-off'}[b.life]}) at a business with about ${fmt(b.yrs?b.lastRev:Tof(b).base*b.locs)} in yearly sales is around ${fmt(mk)}. The most I can justify is ${fmt(mx)}.`,
      min:0,max:mx,init:cur||mk,step:1000,btn:a=>a?`Pay myself ${fmt(a)}/yr`:'Stop paying myself',
      note:a=>`${zone(a)} Paid each year as a business expense, taxed as income in ${resC().n}: I'd get ${fmt(netPay(a))}.${b.lastPre&&a>cur?` Profit would drop to about ${fmt(b.lastPre-(a-cur))}.`:''}`,
      onOk:a=>{b.salary=a;stay(a?`I set my salary at ${b.name} to ${fmt(a)} a year.`:`I stopped paying myself from ${b.name}.`)}});
  });
}
/* ================= boot ================= */
// Warn once a year before aging up if a business has nothing to sell.
function emptyBiz(){return S.alive&&!S.used.emptyOk?S.biz.find(b=>isGoods(b)&&!b.ousted&&b.products&&!b.products.length):null;}
function unrunBiz(){return S.alive&&!S.used.unrunOk&&canManage()?S.biz.find(b=>!b.ousted&&runBy(b)==='none'):null;}
$('statsWrap').onclick=()=>{if(S)charSheet();};$('statsWrap').onkeydown=e=>{if(e.key==='Enter'&&S)charSheet();};
$('bAge').onclick=()=>{if(modalOpen())return;if(!S.alive)return showDeath();
  const u=false;
  if(u)return choiceModal(`${Tof(u).ic} Nobody runs ${u.name}`,'Without me or a CEO in charge, quality and reputation slip every year.',[
    ['Choose who runs it',()=>{wbTab='biz';bizView=u.id;bTab='people';openSheet(drawWork);}],
    ['Age up anyway',()=>{S.used.unrunOk=true;ageUp();}]]);
  const b=emptyBiz();if(!b)return ageUp();
  const loss=Math.round(b.staff*wagePer(b)+(Tof(b).fixed*.5*b.locs+Tof(b).fixed*.5*Math.max(0,b.locs-b.prem)*b.rentMult)*cty(b).rent);
  choiceModal(`${Tof(b).ic} ${b.name} has nothing to sell`,`With no ${isSvc(b)?'services':'products'}, it will still pay staff and rent and lose about ${fmt(loss)} this year.`,[
    [`Add a ${isSvc(b)?'service':'product'} first`,()=>{wbTab='biz';bizView=b.id;bTab='prod';openSheet(drawWork);}],
    ['Age up anyway',()=>{S.used.emptyOk=true;ageUp();}]]);};
$('bUndo').onclick=()=>{
  if(!canUndo())return;
  if(modalOpen()){toast('Answer the decision on screen first.');return;}
  const back=undoSnap.age;
  choiceModal('Undo this year?',`This rewinds everything back to age ${back}: money, businesses, relationships, all of it. The year will play out differently.`,[
    [`Go back to age ${back}`,doUndo],['Stay here',()=>{}]]);
};
$('bJob').onclick=jobSheet;$('bMoney').onclick=moneySheet;$('bRel').onclick=relSheet;$('bAct').onclick=actSheet;$('bMenu').onclick=menuSheet;
bootLoad();
</script>
